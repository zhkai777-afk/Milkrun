<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>预约收货日历</title>
<style>
  :root {
    --primary: #07868d;
    --primary-dark: #046b71;
    --primary-soft: #e9f7f7;
    --text: #27313a;
    --text-2: #5e6975;
    --text-3: #8b95a1;
    --surface: #ffffff;
    --canvas: #f4f6f8;
    --muted: #f6f8fa;
    --border: #e5e9ef;
    --border-strong: #d8dee7;
    --success: #48a66b;
    --success-soft: #eef9f1;
    --warning: #d99026;
    --warning-soft: #fff7e8;
    --info: #3b82f6;
    --info-soft: #eff6ff;
    --danger: #e95d62;
    --shadow-sm: 0 1px 3px rgba(27,39,51,.05);
    --shadow: 0 12px 30px rgba(27,39,51,.08);
    --radius: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: var(--canvas);
    color: var(--text);
    font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid rgba(7,134,141,.22);
    outline-offset: 1px;
  }

  .icon { width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ===== App Shell ===== */
  .app-shell { min-height: 100dvh; display: flex; flex-direction: column; }

  /* ===== Top Bar ===== */
  .top-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: var(--text); }
  .logo-icon {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--primary); color: #fff;
    display: grid; place-items: center;
  }
  .logo-icon svg { width: 18px; height: 18px; }
  .user-info { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-2); }
  .user-info .company { color: var(--text-3); font-size: 12px; }
  .divider { width: 1px; height: 18px; background: var(--border-strong); }
  .user-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--primary-soft); color: var(--primary);
    display: grid; place-items: center; font-size: 13px; font-weight: 600;
  }

  /* ===== Page Body ===== */
  .page-body { flex: 1; padding: 24px; }
  .app-layout { display: flex; gap: 20px; align-items: flex-start; width: 100%; }

  /* ===== Calendar Sidebar ===== */
  .calendar-sidebar {
    width: 460px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 20px;
    position: sticky;
    top: 80px;
  }
  .sidebar-title { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .sidebar-avatar {
    width: 34px; height: 34px; border-radius: 9px;
    background: var(--primary-soft); color: var(--primary);
    display: grid; place-items: center;
  }
  .sidebar-avatar svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .sidebar-title h2 { font-size: 17px; font-weight: 600; color: var(--text); }

  .legend-row { display: flex; gap: 18px; padding: 10px 12px; background: var(--muted); border-radius: 8px; margin-bottom: 4px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  .legend-dot.delivery { background: var(--primary); }
  .legend-dot.pickup { background: #64748b; }

  .cal-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 4px 10px; }
  .cal-nav-btn {
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    cursor: pointer; display: grid; place-items: center;
    color: var(--text-2); font-size: 18px; transition: all .15s;
  }
  .cal-nav-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .cal-month-label { font-size: 15px; font-weight: 600; color: var(--text); }

  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 8px; }
  .cal-weekday { font-size: 13px; color: var(--text-3); padding: 8px 0; font-weight: 500; }
  .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-day {
    aspect-ratio: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 10px; cursor: pointer; position: relative;
    font-size: 15px; color: var(--text);
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .cal-day:hover { background: var(--muted); }
  .cal-day.other-month { color: var(--text-3); }
  .cal-day.other-month:hover { background: transparent; }
  .cal-day.today { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .cal-day.selected { background: var(--primary); color: #fff; font-weight: 600; box-shadow: 0 4px 10px rgba(7,134,141,.28); }
  .cal-day.has-apt::after { content: ''; position: absolute; bottom: 9px; width: 6px; height: 6px; border-radius: 50%; }
  .cal-day.delivery::after { background: var(--primary); }
  .cal-day.pickup::after { background: #64748b; }
  .cal-day.selected.has-apt::after { background: #fff; }

  /* ===== Main Content ===== */
  .main-content {
    flex: 1; min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .content-header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 24px; border-bottom: 1px solid var(--border);
  }
  .content-date { font-size: 17px; font-weight: 600; color: var(--text); }
  .content-sub { font-size: 12px; color: var(--text-3); margin-top: 3px; }

  /* Buttons */
  .btn {
    min-height: 36px; padding: 0 16px; border: 1px solid var(--border-strong);
    border-radius: 6px; background: var(--surface); color: var(--text-2);
    font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .18s, border-color .18s, color .18s, transform .12s;
  }
  .btn:hover { border-color: #bbc5d0; background: #fafbfc; color: var(--text); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { border-color: var(--primary); background: var(--primary); color: #fff; }
  .btn-primary:hover { border-color: var(--primary-dark); background: var(--primary-dark); color: #fff; }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--text-2); }

  /* Content Body */
  .content-body { flex: 1; min-height: 380px; }
  .appointments-area { flex: 1; padding: 20px 24px; overflow-y: auto; }

  /* Appointment Card */
  .appointment-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    box-shadow: var(--shadow-sm);
  }
  .card-top { display: flex; align-items: flex-start; gap: 14px; }
  .card-avatar {
    width: 46px; height: 46px; border-radius: 12px;
    background: var(--primary-soft); color: var(--primary);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .card-avatar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .card-info { flex: 1; min-width: 0; }
  .supplier-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .supplier-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .tag-vip {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 8px; border-radius: 10px;
    background: var(--warning-soft); color: var(--warning);
    font-size: 11px; font-weight: 600;
  }
  .tag-vip svg { width: 11px; height: 11px; fill: currentColor; stroke: none; }
  .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px 24px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
  .info-field { display: flex; flex-direction: column; gap: 4px; }
  .info-label { font-size: 12px; color: var(--text-3); }
  .info-value { font-size: 14px; color: var(--text); font-weight: 500; }
  .logistics-link {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--info); cursor: pointer; font-size: 14px; font-weight: 500;
    transition: opacity .15s;
  }
  .logistics-link:hover { opacity: .75; text-decoration: underline; }
  .logistics-link svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card-footer { display: flex; justify-content: flex-end; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }

  /* Shipment status badge */
  .ship-status {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 9px; border-radius: 20px;
    font-size: 12px; font-weight: 600; line-height: 1.7; white-space: nowrap;
  }
  .ship-status .icon { width: 13px; height: 13px; }
  .ship-status.pending { background: var(--warning-soft); color: var(--warning); }
  .ship-status.shipped { background: var(--info-soft); color: var(--info); }
  .ship-status.received { background: var(--success-soft); color: var(--success); }
  .empty-state { padding: 64px 20px; text-align: center; color: var(--text-3); font-size: 14px; }
  .detail-link { color: var(--text-3); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; transition: color .15s; }
  .detail-link:hover { color: var(--primary); }

  /* ===== Logistics Modal ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(27,39,51,.45); z-index: 1000;
    align-items: center; justify-content: center; animation: fadeIn .2s ease;
  }
  .modal-overlay.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal-dialog {
    background: var(--surface); border-radius: 14px;
    width: 720px; max-width: 92vw; max-height: 85vh;
    box-shadow: var(--shadow); display: flex; flex-direction: column;
    animation: slideUp .25s ease; overflow: hidden;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px; border-bottom: 1px solid var(--border);
  }
  .modal-title { font-size: 16px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .modal-title svg { width: 20px; height: 20px; fill: none; stroke: var(--primary); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .modal-close {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; display: grid; place-items: center;
    color: var(--text-2); font-size: 16px; transition: all .15s;
  }
  .modal-close:hover { background: var(--muted); color: var(--text); border-color: var(--border-strong); }
  .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }

  /* Route Summary */
  .route-summary {
    display: flex; align-items: center; gap: 16px;
    background: linear-gradient(135deg, var(--info-soft), #f3f9ff);
    border: 1px solid #dbeafe; border-radius: 12px;
    padding: 16px 20px; margin-bottom: 24px;
  }
  .route-from, .route-to { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; }
  .route-city { font-size: 15px; font-weight: 600; color: var(--text); }
  .route-detail { font-size: 11px; color: var(--text-3); }
  .route-arrow-area { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 0 10px; }
  .route-line { height: 2px; flex: 1; background: repeating-linear-gradient(90deg, var(--info) 0, var(--info) 6px, transparent 6px, transparent 10px); position: relative; }
  .route-truck-icon {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 30px; height: 30px; background: var(--info); border-radius: 50%;
    display: grid; place-items: center; color: #fff; z-index: 1;
    box-shadow: 0 4px 10px rgba(59,130,246,.3);
  }
  .route-truck-icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .route-stats { display: flex; gap: 22px; margin-left: auto; }
  .stat-item { text-align: center; }
  .stat-val { font-size: 15px; font-weight: 700; color: var(--info); }
  .stat-lbl { font-size: 10px; color: var(--text-3); margin-top: 2px; }

  /* Timeline */
  .timeline-section { margin-bottom: 20px; }
  .section-label { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .section-label::before { content: ''; width: 3px; height: 14px; background: var(--primary); border-radius: 2px; }
  .timeline { position: relative; padding-left: 28px; }
  .timeline::before { content: ''; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: var(--border-strong); }
  .timeline-item { position: relative; padding-bottom: 22px; }
  .timeline-item:last-child { padding-bottom: 0; }
  .tl-dot { position: absolute; left: -25px; top: 2px; width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid var(--border-strong); background: var(--surface); z-index: 1; }
  .tl-dot.completed { border-color: var(--success); background: var(--success); }
  .tl-dot.current { border-color: var(--info); background: var(--info); box-shadow: 0 0 0 4px rgba(59,130,246,.18); }
  .tl-dot.pending { border-color: var(--border-strong); background: var(--surface); }
  .tl-content { background: var(--muted); border-radius: 10px; padding: 12px 16px; border: 1px solid var(--border); }
  .tl-item.completed .tl-content { background: var(--success-soft); border-color: #cdeed8; }
  .tl-item.current .tl-content { background: var(--info-soft); border-color: #cfe3fd; }
  .tl-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .tl-status-text { font-size: 12px; font-weight: 600; color: var(--text); }
  .tl-time { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .tl-desc { font-size: 12px; color: var(--text-2); line-height: 1.6; }
  .tl-location { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-3); margin-top: 6px; }
  .tl-location svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Progress */
  .progress-section { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); }
  .progress-bar-wrap { display: flex; align-items: center; gap: 12px; }
  .progress-track { flex: 1; height: 8px; background: var(--muted); border-radius: 4px; overflow: hidden; position: relative; border: 1px solid var(--border); }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--info), var(--primary)); border-radius: 4px; transition: width .5s ease; position: relative; }
  .progress-fill::after { content: ''; position: absolute; right: 0; top: 0; width: 16px; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45)); animation: shimmer 1.5s infinite; }
  @keyframes shimmer { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
  .progress-pct { font-size: 14px; font-weight: 700; color: var(--primary); min-width: 42px; text-align: right; }
  .progress-stages { display: flex; justify-content: space-between; margin-top: 10px; padding: 0 2px; }
  .ps-stage { font-size: 11px; color: var(--text-3); text-align: center; }
  .ps-stage.active { color: var(--primary); font-weight: 600; }

  .modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

  /* Receipt detail: shares the same information model as the mobile warehouse view. */
  .receipt-dialog { width: min(980px, 94vw); max-height: 90dvh; }
  .receipt-dialog .modal-body { padding: 22px 24px 28px; }
  .receipt-meta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 28px; margin-bottom: 22px; }
  .receipt-meta-item { min-width: 0; }
  .receipt-meta-label { font-size: 12px; color: var(--text-3); }
  .receipt-meta-value { margin-top: 2px; font-size: 14px; color: var(--text); font-weight: 500; word-break: break-word; }
  .receipt-section-title { display: flex; align-items: center; gap: 7px; margin: 24px 0 12px; font-size: 14px; font-weight: 600; color: var(--text); }
  .receipt-section-title::before { content: ''; width: 3px; height: 14px; border-radius: 2px; background: var(--primary); }
  .receipt-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 9px; }
  .receipt-table { width: 100%; min-width: 820px; border-collapse: collapse; font-size: 13px; }
  .receipt-table th { padding: 9px 12px; background: var(--muted); color: var(--text-3); font-size: 11px; font-weight: 500; text-align: left; white-space: nowrap; }
  .receipt-table td { padding: 10px 12px; border-top: 1px solid var(--border); vertical-align: middle; }
  .receipt-table .material-code { color: var(--text); font-weight: 600; }
  .receipt-table .supplier-cell { color: var(--text-2); }
  .receipt-table .number-cell { color: var(--primary); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .receipt-table .promise-cell { color: var(--text); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .actual-arrival { color: var(--text); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
  .qty-diff { margin-top: 3px; color: var(--text-3); font-size: 11px; }
  .qty-diff.negative { color: var(--danger); }

  .receipt-map { position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: 14px; background: #eef4f0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.6), 0 8px 24px rgba(17,51,40,.08); }
  .receipt-map svg { display: block; width: 100%; height: auto; min-height: 260px; }
  .receipt-map-overlay { position: absolute; z-index: 2; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
  .receipt-map-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 20px; background: rgba(255,255,255,.93); color: var(--text); font-size: 11px; font-weight: 600; box-shadow: 0 2px 8px rgba(17,51,40,.1); backdrop-filter: blur(6px); }
  .receipt-map-badge.status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
  .receipt-map-legend { position: absolute; right: 10px; bottom: 10px; z-index: 2; display: grid; gap: 6px; }
  .receipt-map-legend span { display: flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 12px; background: rgba(255,255,255,.9); color: var(--text-3); font-size: 10px; }
  .receipt-map-legend i { width: 7px; height: 7px; border-radius: 50%; background: #0d9488; }
  .receipt-map-legend span:last-child i { background: #94a3b8; }
  .map-label { fill: var(--text-2); font-size: 10px; }
  .map-label.strong { fill: var(--text); font-size: 10.5px; font-weight: 600; letter-spacing: .1px; paint-order: stroke; stroke: rgba(247,249,248,.94); stroke-width: 4px; stroke-linejoin: round; }

  @media (prefers-reduced-motion: reduce) {
    .receipt-map animate { display: none; }
  }

  .receipt-timeline { max-width: 560px; padding: 2px 0; }
  .receipt-timeline-item { display: flex; gap: 12px; align-items: stretch; }
  .receipt-timeline-rail { display: flex; flex-direction: column; align-items: center; width: 14px; flex: 0 0 14px; }
  .receipt-timeline-dot { width: 12px; height: 12px; margin-top: 2px; border-radius: 50%; background: #fff; border: 2px solid var(--border-strong); }
  .receipt-timeline-item.done .receipt-timeline-dot { border-color: var(--primary); background: var(--primary); }
  .receipt-timeline-item.current .receipt-timeline-dot { border-color: var(--primary); background: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
  .receipt-timeline-line { flex: 1; width: 2px; margin-top: 3px; background: var(--border); }
  .receipt-timeline-item.done .receipt-timeline-line, .receipt-timeline-item.current .receipt-timeline-line { background: var(--primary); }
  .receipt-timeline-item:last-child .receipt-timeline-line { display: none; }
  .receipt-timeline-content { flex: 1; min-width: 0; padding-bottom: 18px; }
  .receipt-timeline-title { color: var(--text-2); font-size: 13px; }
  .receipt-timeline-item.done .receipt-timeline-title, .receipt-timeline-item.current .receipt-timeline-title { color: var(--text); }
  .receipt-timeline-item.current .receipt-timeline-title { font-weight: 600; }
  .receipt-timeline-time { margin-top: 2px; color: var(--text-3); font-size: 11px; }

  /* Responsive */
  @media (max-width: 860px) {
    .app-layout { flex-direction: column; }
    .calendar-sidebar { width: 100%; position: static; }
    .route-summary { flex-wrap: wrap; }

<script src="./logistics-flow.js"></script>
<script>
// ===== Calendar Logic =====
let currentYear = 2026;
let currentMonth = 6; // 0-based, July = 6
let selectedDate = new Date(2026, 6, 14);

// 从共享计划数据按 ASN 生成工厂预约日历，直送/自提共用同一口径。
const appointments = {};
const calendarRows = LogisticsFlow.loadRows();
const routeGroups = [
  ...LogisticsFlow.byAsn(calendarRows.filter(r => LogisticsFlow.deliveryText(r.deliveryMode) === '直送')),
  ...LogisticsFlow.byAsn(calendarRows.filter(r => LogisticsFlow.deliveryText(r.deliveryMode) === '自提'))
];
routeGroups.forEach(g => {
  const first = g.items[0];
  const date = g.deliveryMode === '直送' ? first.appointmentDate : first.deliveryAppointmentDate;
  if (!date) return;
  const p = date.split('-').map(Number), key = `${p[0]}-${p[1]}-${p[2]}`;
  const status = g.items.every(r => r.status === 'received') ? 'received' : g.items.some(r => r.status === 'in_transit') ? 'shipped' : 'pending';
  if (!appointments[key]) appointments[key] = [];
  appointments[key].push({
    type: g.deliveryMode === '直送' ? 'delivery' : 'pickup', status,
    supplier: g.supplierName, vip: false,
    asn: g.asnNo, po: g.voucher, eta: date + (first.appointmentSlot ? ' ' + first.appointmentSlot : ''),
    delivery: g.deliveryMode === '直送' ? '供应商直送' : '工厂自提', logistics: first.logisticsProvider || first.logistics || '-',
    drivers: first.drivers, driver: first.pickupPerson || '', driverPhone: first.pickupPhone || '', plate: first.vehiclePlate || '',
    registeredAt: first.shippedAt || first.stockReadyTime || first.updatedAt || '',
    items: g.items.map(item => ({
      materialCode: item.materialCode || '-', supplierName: item.supplierName || g.supplierName || '-',
      planQty: Number(item.planQty) || 0,
      promisedQty: LogisticsFlow.hasValue(item.confirmQty) ? Number(item.confirmQty) :
        (LogisticsFlow.hasValue(item.promisedQty) ? Number(item.promisedQty) : Number(item.planQty) || 0),
      actualQty: LogisticsFlow.hasValue(item.actualArrivalQty) ? Number(item.actualArrivalQty) :
        (LogisticsFlow.hasValue(item.actualShipQty) ? Number(item.actualShipQty) : Number(item.promisedQty ?? item.planQty) || 0),
      id: item.id, batchDetails: item.batchDetails, batchNo: item.batchNo, batches: item.batches,
      voucher: item.voucher || '-'
    }))
  });
});

// 页面独立演示记录：仅加入内存日历，不写入共享计划或登记存储。
const demoPickupDate = Object.keys(appointments).sort((a,b) => new Date(a)-new Date(b))[0] || '2026-10-15';
const demoPickup = {
  demo: true, type:'pickup', status:'shipped', supplier:'宁波示例零部件有限公司（演示）',
  asn:'DEMO-PICKUP-001', po:'DEMO-PO-001', eta:demoPickupDate, delivery:'工厂自提',
  logistics:'示例物流有限公司（演示）', plate:'浙B·演示', registeredAt:demoPickupDate + ' 09:00',
  drivers:[{name:'演示司机甲',phone:'未填写',plate:'浙B·演示01'},{name:'演示司机乙',phone:'未填写',plate:'浙B·演示02'}],
  items:[
    {materialCode:'DEMO-MAT-001',supplierName:'宁波示例零部件有限公司（演示）',voucher:'DEMO-PO-001',planQty:1000,promisedQty:1000,actualQty:1000,batchDetails:[{batchNo:'DEMO-B001',quantity:600,actualShipQty:600},{batchNo:'DEMO-B002',quantity:400,actualShipQty:400}]},
    {materialCode:'DEMO-MAT-002',supplierName:'宁波示例零部件有限公司（演示）',voucher:'DEMO-PO-002',planQty:800,promisedQty:800,actualQty:800,batchDetails:[{batchNo:'DEMO-B003',quantity:800,actualShipQty:800}]},
    {materialCode:'DEMO-MAT-003',supplierName:'宁波示例零部件有限公司（演示）',voucher:'DEMO-PO-002',planQty:500,promisedQty:500,actualQty:500,batchDetails:[]}
  ]
};
(appointments[demoPickupDate] ||= []).push(demoPickup);

const STATUS_MAP = {
  pending:  { label: '待发货', cls: 'pending',  icon: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>' },
  shipped:  { label: '已发货', cls: 'shipped',  icon: '<rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>' },
  received: { label: '已收货', cls: 'received', icon: '<path d="M20 6 9 17l-5-5"/>' },
};

function updateSub(dateKey) {
  const sub = document.getElementById('selectedDateSub');
  const list = appointments[dateKey];
  if (list?.length) {
    const labels = [...new Set(list.map(apt => (STATUS_MAP[apt.status] || {}).label).filter(Boolean))];
    sub.textContent = `共 ${list.length} 条预约 · 发货状态：${labels.join(' / ')}`;
  } else {
    sub.textContent = '暂无预约安排';
  }
}

function renderCalendar() {
  const container = document.getElementById('calDays');
  const firstDay = new Date(currentYear, currentMonth, 1);
  const lastDay = new Date(currentYear, currentMonth + 1, 0);

  let startWeekDay = firstDay.getDay(); // 0=Sun
  startWeekDay = startWeekDay === 0 ? 6 : startWeekDay - 1; // Convert to Mon=0

  const daysInMonth = lastDay.getDate();
  const prevMonthLast = new Date(currentYear, currentMonth, 0).getDate();

  document.getElementById('monthLabel').textContent =
    `${currentYear}年${String(currentMonth + 1).padStart(2, '0')}月`;

  let html = '';

  // Previous month days
  for (let i = startWeekDay - 1; i >= 0; i--) {
    const day = prevMonthLast - i;
    html += `<div class="cal-day other-month">${day}</div>`;
  }

  // Current month days
  const today = new Date();
  for (let d = 1; d <= daysInMonth; d++) {
    const dateKey = `${currentYear}-${currentMonth + 1}-${d}`;
    const apt = appointments[dateKey];
    const isToday = today.getFullYear() === currentYear &&
                    today.getMonth() === currentMonth &&
                    today.getDate() === d;
    const isSelected = selectedDate.getFullYear() === currentYear &&
                       selectedDate.getMonth() === currentMonth &&
                       selectedDate.getDate() === d;

    let cls = 'cal-day';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';
    if (apt?.length) cls += ' has-apt ' + (apt.some(item => item.type === 'delivery') ? 'delivery' : 'pickup');

    html += `<div class="${cls}" onclick="selectDate(${currentYear}, ${currentMonth}, ${d})">${d}</div>`;
  }

  // Next month days
  const totalCells = startWeekDay + daysInMonth;
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="cal-day other-month">${i}</div>`;
  }

  container.innerHTML = html;
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderCalendar();
}

function selectDate(y, m, d) {
  selectedDate = new Date(y, m, d);
  document.getElementById('selectedDateTitle').textContent =
    `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')} 预约信息`;
  updateSub(`${y}-${m+1}-${d}`);
  renderAppointment(`${y}-${m+1}-${d}`);
  renderCalendar();
}

// ===== Render selected appointment card =====
function renderAppointment(dateKey) {
  const area = document.getElementById('appointmentsArea');
  const list = appointments[dateKey];
  if (!list?.length) {
    area.innerHTML = '<div class="empty-state">该日期暂无预约安排</div>';
    return;
  }
  const truckIcon = '<svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13" rx="1"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>';
  area.innerHTML = list.map((apt, aptIndex) => {
    const s = STATUS_MAP[apt.status];
    const vip = apt.vip
      ? '<span class="tag-vip"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> VIP</span>'
      : '';
    return `
    <div class="appointment-card">
      <div class="card-top">
        <div class="card-avatar"><svg viewBox="0 0 24 24"><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/></svg></div>
        <div class="card-info">
          <div class="supplier-name-row">
            <span class="supplier-name">${apt.supplier}</span>
            ${vip}
            <span class="ship-status ${s.cls}"><svg class="icon" viewBox="0 0 24 24">${s.icon}</svg>${s.label}</span>
          </div>
          <div class="info-grid">
            <div class="info-field"><span class="info-label">ASN号</span><span class="info-value">${apt.asn || apt.po}</span></div>
            <div class="info-field"><span class="info-label">物流路线</span><span class="info-value">--- <span class="logistics-link" role="button" tabindex="0" onclick="openReceiptDetail('${dateKey}', ${aptIndex}, true)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openReceiptDetail('${dateKey}', ${aptIndex}, true)}">${truckIcon}查看物流进度</span></span></div>
            <div class="info-field"><span class="info-label">预计到货</span><span class="info-value">${apt.eta}</span></div>
            <div class="info-field"><span class="info-label">配送方式</span><span class="info-value">${apt.delivery}</span></div>
            <div class="info-field"><span class="info-label">发货状态</span><span class="info-value"><span class="ship-status ${s.cls}"><svg class="icon" viewBox="0 0 24 24">${s.icon}</svg>${s.label}</span></span></div>
          </div>
        </div>
      </div>
      <div class="card-footer"><span class="detail-link" role="button" tabindex="0" onclick="openReceiptDetail('${dateKey}', ${aptIndex})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openReceiptDetail('${dateKey}', ${aptIndex})}">详细内容 ›</span></div>
    </div>`;
  }).join('');
}

// ===== Receipt detail (same fields and records as the mobile warehouse view) =====
let lastDetailTrigger = null;
let currentReceiptDetail = null;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[ch]));
}

function formatQty(value) {
  return Number(value || 0).toLocaleString('zh-CN');
}

function shortPartyName(value) {
  const clean = String(value || '供应商').replace(/（[^）]*）|\([^)]*\)|有限责任公司|股份有限公司|有限公司/g, '').trim();
  return clean.length > 10 ? clean.slice(0, 9) + '…' : clean;
}

function resolveMobileReceipt(apt) {
  const isSupplier = apt.type === 'delivery';
  const records = apt.demo ? [] : LogisticsFlow.read(isSupplier ? 'bw_supplier_deliveries' : 'bw_carrier_pickups', []);
  const aptCodes = new Set((apt.items || []).map(item => item.materialCode));
  const matched = Array.isArray(records) ? records.find(rec => {
    if (rec.asnNo === apt.asn || rec.no === apt.asn) return true;
    const partyMatches = isSupplier ? rec.supplier === apt.supplier : (rec.relSupplier === apt.supplier || rec.carrier === apt.logistics);
    const materialMatches = (rec.items || []).some(item => aptCodes.has(item.materialCode));
    return partyMatches && materialMatches;
  }) : null;
  const source = matched || {};
  return {
    no: source.no || apt.asn || apt.po || '-',
    asnNo: source.asnNo || apt.asn || '',
    kind: isSupplier ? 'supplier' : 'carrier',
    supplier: source.supplier || source.relSupplier || apt.supplier || '-',
    carrier: source.carrier || apt.logistics || '-',
    mode: isSupplier ? '供应商直送' : '工厂自提',
    eta: source.eta || apt.eta || '-',
    time: source.time || apt.registeredAt || '',
    status: source.status || (apt.status === 'received' ? 'ok' : 'shipped'),
    receivedTime: source.receivedTime || '',
    distanceKm: source.distanceKm || (isSupplier ? 68 : 92),
    plate: source.plate || apt.plate || '', driver: source.driver || apt.driver || '',
    drivers: Array.isArray(source.drivers) && source.drivers.length ? source.drivers : (Array.isArray(apt.drivers) && apt.drivers.length ? apt.drivers : [{ name: source.driver || apt.driver || '', phone: source.driverPhone || source.phone || apt.driverPhone || '' }]), trackNo: source.trackNo || '',
    items: (source.items?.length ? source.items : apt.items || []).map(item => {
      const planItem = (apt.items || []).find(candidate => (item.id && candidate.id === item.id) || (candidate.materialCode === item.materialCode && (!item.voucher || candidate.voucher === item.voucher))) || {};
      const planQty = Number(item.planQty ?? planItem.planQty) || 0;
      const promisedQty = Number(item.confirmQty ?? item.promisedQty ?? item.actualShipQty ?? planItem.promisedQty ?? planQty) || 0;
      const actualQty = Number(item.actualQty ?? item.actualArrivalQty ?? planItem.actualQty ?? item.actualShipQty ?? promisedQty) || 0;
      return {
        materialCode: item.materialCode || planItem.materialCode || '-',
        supplierName: item.supplierName || planItem.supplierName || source.supplier || apt.supplier || '-',
        planQty, promisedQty, actualQty,
        batchDetails: Array.isArray(item.batchDetails) ? item.batchDetails : planItem.batchDetails,
        batchNo: item.batchNo ?? planItem.batchNo, batches: item.batches ?? planItem.batches,
        voucher: item.voucher || planItem.voucher || '-'
      };
    })
  };
}

function receiptMetaHtml(rec) {
  const fields = [
    ['ASN号', rec.asnNo || rec.no || '-'],
    ['类型', rec.mode],
    [rec.kind === 'supplier' ? '供应商' : '物流商', rec.kind === 'supplier' ? rec.supplier : rec.carrier],
    ['预计到货', rec.eta]
  ];
  if (rec.kind === 'carrier') {
    if (rec.supplier) fields.push(['关联供应商', rec.supplier]);
    if (rec.trackNo) fields.push(['物流单号', rec.trackNo]);
  }
  return `<div class="receipt-meta">${fields.map(([label, value]) => `
    <div class="receipt-meta-item"><div class="receipt-meta-label">${escapeHtml(label)}</div><div class="receipt-meta-value">${escapeHtml(value || '-')}</div></div>`).join('')}</div>${rec.kind === 'carrier' ? receiptDriversHtml(rec) : ''}`;
}

function receiptDriversHtml(rec) {
  const drivers = Array.isArray(rec.drivers) && rec.drivers.length ? rec.drivers : [{}];
  return `<div class="receipt-driver-section"><div class="receipt-section-title">司机信息</div><div class="receipt-table-wrap"><table class="receipt-table receipt-driver-table" aria-label="司机信息">
    <thead><tr><th scope="col">序号</th><th scope="col">车牌号</th><th scope="col">司机姓名</th><th scope="col">联系电话</th></tr></thead>
    <tbody>${drivers.map((driver, index) => `<tr><td>${index + 1}</td><td>${escapeHtml(driver.plate || driver.vehiclePlate || (drivers.length === 1 ? rec.plate : '') || '未填写')}</td><td>${escapeHtml(driver.name || '未填写')}</td><td>${escapeHtml(driver.phone || '未填写')}</td></tr>`).join('')}</tbody>
  </table></div></div>`;
}

function receiptBatchesHtml(item, kind) {
  const qty = value => value !== null && value !== undefined && String(value).trim() !== '' && Number.isFinite(Number(value)) ? formatQty(value) : '—';
  let details = Array.isArray(item.batchDetails) ? item.batchDetails : [];
  if (!Array.isArray(item.batchDetails)) {
    details = (Array.isArray(item.batches) ? item.batches : item.batchNo ? [item.batchNo] : []).filter(Boolean).map(batchNo => ({batchNo}));
  }
  if (!details.length) return '<span class="receipt-batch-empty">物料批次：未维护</span>';
  return `<div class="receipt-batches">${details.map(detail => `<div class="receipt-batch"><span>批次号 <strong>${escapeHtml(detail.batchNo || '未维护')}</strong></span><span>批次数量 <strong>${qty(detail.quantity)}</strong></span>${detail.actualShipQty != null ? `<span>${kind === 'carrier' ? '实际取货' : '实际发货'}数量 <strong>${qty(detail.actualShipQty)}</strong></span>` : ''}</div>`).join('')}</div>`;
}

function receiptItemsHtml(rec) {
  return `<div class="receipt-table-wrap"><table class="receipt-table">
    <thead><tr><th>物料编号</th><th>供应商</th><th style="text-align:right">计划</th><th style="text-align:right">承诺</th><th style="text-align:right">实际</th><th>凭证</th></tr></thead>
    <tbody>${rec.items.map(item => {
      const diff = item.planQty - item.actualQty;
      return `<tr>
        <td class="material-code">${escapeHtml(item.materialCode)}</td>
        <td class="supplier-cell">${escapeHtml(item.supplierName)}</td>
        <td class="number-cell">${formatQty(item.planQty)}</td>
        <td class="promise-cell">${formatQty(item.promisedQty)}</td>
        <td style="text-align:right"><div class="actual-arrival">${formatQty(item.actualQty)}</div><div class="qty-diff ${diff ? 'negative' : ''}">${diff ? `${diff > 0 ? '缺' : '超'} ${formatQty(Math.abs(diff))}` : '持平'}</div></td>
        <td class="supplier-cell">${escapeHtml(item.voucher)}</td>
      </tr><tr class="receipt-batch-row"><td colspan="6">${receiptBatchesHtml(item, rec.kind)}</td></tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

function receiptMapHtml(rec) {
  const origin = shortPartyName(rec.kind === 'supplier' ? rec.supplier : rec.carrier);
  const delivered = rec.status === 'ok';
  return `<div class="receipt-map" id="receiptMapSection">
    <div class="receipt-map-overlay"><span class="receipt-map-badge status">${delivered ? '已送达 · 已完成收货' : `运输中 · 预计 ${escapeHtml(rec.eta)}`}</span><span class="receipt-map-badge">约 ${formatQty(rec.distanceKm)} km</span></div>
    <div class="receipt-map-legend"><span><i></i>当前路线</span><span><i></i>道路网络</span></div>
    <svg viewBox="0 0 640 260" role="img" aria-label="${escapeHtml(origin)}至博格华纳宁波仓库的物流路线">
      <defs>
        <linearGradient id="receiptLand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faf9"/><stop offset="1" stop-color="#eef3f1"/></linearGradient>
        <linearGradient id="receiptRoute" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#18b8aa"/><stop offset="1" stop-color="#07868d"/></linearGradient>
        <filter id="receiptShadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#173f3b" flood-opacity=".15"/></filter>
      </defs>
      <rect width="640" height="260" fill="url(#receiptLand)"/>

      <!-- JD-style restrained map texture: fine roads, quiet land blocks, clear route. -->
      <g fill="#e8eeeb" opacity=".72"><rect x="28" y="28" width="126" height="54" rx="10"/><rect x="466" y="146" width="142" height="66" rx="10"/><rect x="246" y="190" width="118" height="42" rx="9"/><rect x="458" y="24" width="100" height="48" rx="10"/></g>
      <g fill="#dcebe0" opacity=".7"><ellipse cx="122" cy="142" rx="30" ry="13"/><ellipse cx="526" cy="126" rx="27" ry="12"/><circle cx="282" cy="172" r="8"/></g>
      <path d="M0 238 C126 224 236 252 390 238 S548 210 640 220" fill="none" stroke="#d7eaf2" stroke-width="18"/><path d="M0 238 C126 224 236 252 390 238 S548 210 640 220" fill="none" stroke="#edf7fa" stroke-width="8"/>
      <g fill="none" stroke="#dfe5e3" stroke-width="10" stroke-linecap="round"><path d="M0 105H640"/><path d="M0 190H640"/><path d="M170 0V260"/><path d="M410 0V260"/></g>
      <g fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="9 11" opacity=".9"><path d="M0 105H640"/><path d="M0 190H640"/><path d="M170 0V260"/><path d="M410 0V260"/></g>
      <g fill="none" stroke="#e6ebe9" stroke-width="4" opacity=".8"><path d="M18 52H242"/><path d="M290 48H622"/><path d="M64 156H250"/><path d="M310 158H596"/><path d="M92 0V105"/><path d="M296 0V190"/><path d="M520 105V260"/></g>
      <g class="map-label" opacity=".7"><text x="184" y="99">园区路</text><text x="424" y="184">物流大道</text><text x="326" y="42">沪昆高速</text><text x="572" y="213">宁波</text></g>

      <!-- Route casing and completed / remaining segments. -->
      <path d="M92 196 L92 190 L170 190 L170 105 L548 105 L548 70" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" opacity=".96"/>
      <path d="M92 196 L92 190 L170 190 L170 105 L548 105 L548 70" fill="none" stroke="#b8d6d2" stroke-width="5" stroke-linecap="round"/>
      <path d="${delivered ? 'M92 196 L92 190 L170 190 L170 105 L548 105 L548 70' : 'M92 196 L92 190 L170 190 L170 105 L350 105'}" fill="none" stroke="url(#receiptRoute)" stroke-width="5" stroke-linecap="round"/>
      ${delivered ? '' : '<path d="M350 105 L548 105 L548 70" fill="none" stroke="#83bdb7" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 8"/>'}

      <!-- Compact start / destination nodes. -->
      <g transform="translate(92 196)" filter="url(#receiptShadow)"><circle r="10" fill="#fff" stroke="#15aa9e" stroke-width="3"/><circle r="3.5" fill="#15aa9e"/></g>
      <text class="map-label strong" x="92" y="220" text-anchor="middle">${escapeHtml(origin)}</text>
      <g transform="translate(548 70)" filter="url(#receiptShadow)"><circle r="12" fill="#fff" stroke="#07868d" stroke-width="2.5"/><path d="M-7-2 0-7 7-2V7H-7Z" fill="#07868d"/><rect x="-3" y="1" width="6" height="6" rx="1" fill="#fff"/></g>
      <text class="map-label strong" x="548" y="43" text-anchor="middle">博格华纳·宁波</text>

      <!-- Small live vehicle marker, sized as a status point rather than a hero icon. -->
      <g transform="translate(${delivered ? 548 : 350} ${delivered ? 70 : 105})" filter="url(#receiptShadow)"><circle r="19" fill="none" stroke="#14b8a6" stroke-width="1.5" opacity=".22"><animate attributeName="r" values="18;25" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".24;0" dur="2s" repeatCount="indefinite"/></circle><circle r="15" fill="#fff" stroke="#0ea398" stroke-width="2.5"/><g transform="translate(-8 -5)" fill="#087f78"><rect y="2" width="11" height="7" rx="1.5"/><path d="M11 4h4.5l2.5 3.5V9h-7Z"/><circle cx="3.5" cy="11" r="1.7" fill="#334155"/><circle cx="14.5" cy="11" r="1.7" fill="#334155"/></g></g>
    </svg>
  </div>`;
}

function receiptTimelineHtml(rec) {
  const received = rec.status === 'ok';
  const partyStep = rec.kind === 'supplier' ? '供应商发货' : `${rec.carrier || '物流商'} 已揽收`;
  const transportStep = rec.kind === 'supplier' ? `运输中（${rec.mode}）` : '运输中';
  const steps = received ? [
    ['已确认收货', rec.receivedTime, 'current'], ['到达博格华纳·宁波工厂仓库', '', 'done'], [transportStep, '', 'done'], [partyStep, rec.time, 'done']
  ] : [
    [transportStep, '', 'current'], [partyStep, rec.time, 'done'], ['到达博格华纳·宁波工厂仓库', '', 'todo'], ['已确认收货', '', 'todo']
  ];
  return `<div class="receipt-timeline">${steps.map(([title, time, state]) => `
    <div class="receipt-timeline-item ${state}"><div class="receipt-timeline-rail"><span class="receipt-timeline-dot"></span><span class="receipt-timeline-line"></span></div><div class="receipt-timeline-content"><div class="receipt-timeline-title">${escapeHtml(title)}</div>${time ? `<div class="receipt-timeline-time">${escapeHtml(time)}</div>` : ''}</div></div>`).join('')}</div>`;
}

function openReceiptDetail(dateKey, index, focusMap = false) {
  const apt = appointments[dateKey]?.[index];
  if (!apt) return;
  const rec = resolveMobileReceipt(apt);
  currentReceiptDetail = rec;
  document.getElementById('receiptDetailBody').innerHTML = `
    ${receiptMetaHtml(rec)}
    <div class="receipt-tabs" role="tablist" aria-label="预约详情">
      <button id="receipt-route-tab" role="tab" aria-selected="true" aria-controls="receipt-route-panel" onclick="switchReceiptTab('route')" onkeydown="receiptTabKey(event, 'route')">物流路线</button>
      <button id="receipt-items-tab" role="tab" aria-selected="false" tabindex="-1" aria-controls="receipt-items-panel" onclick="switchReceiptTab('items')" onkeydown="receiptTabKey(event, 'items')">物料明细</button>
    </div>
    <div id="receipt-route-panel" role="tabpanel" aria-labelledby="receipt-route-tab">
      ${rec.kind === 'supplier' ? `<div class="receipt-route-empty"><div class="route-empty-icon" aria-hidden="true">⌁</div><strong>暂未接入物流路线</strong><p>本次预约为供应商直送，暂不提供路线与轨迹信息。</p><button class="btn-secondary" onclick="switchReceiptTab('items')">查看物料明细</button></div>` : `<div class="receipt-section-title">物流地图与路线</div><div class="route-demo-note">路线与轨迹为模拟展示，非实时定位</div>${receiptMapHtml(rec)}<div class="receipt-section-title">物流轨迹</div>${receiptTimelineHtml(rec)}`}
    </div>
    <div id="receipt-items-panel" role="tabpanel" aria-labelledby="receipt-items-tab" hidden>
      <div class="receipt-filters">
        <label>物料编号<input id="receiptMaterialQuery" type="search" placeholder="输入物料编号" oninput="filterReceiptItems()"></label>
        <label>采购凭证<input id="receiptVoucherQuery" type="search" placeholder="输入采购凭证" oninput="filterReceiptItems()"></label>
        <button class="btn" onclick="resetReceiptItems()">重置</button>
      </div>
      <div class="receipt-result-count" id="receiptResultCount" aria-live="polite">共 ${rec.items.length} 项物料</div>
      <div id="receiptItemsResult">${receiptItemsHtml(rec)}</div>
    </div>`;
  lastDetailTrigger = document.activeElement;
  const modal = document.getElementById('logisticsModal');
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
  modal.querySelector('.modal-close').focus();
  document.getElementById('receiptDetailBody').scrollTop = 0;
}

function matchingReceiptItems(items, material, voucher) {
  const m = String(material || '').trim().toLowerCase();
  const v = String(voucher || '').trim().toLowerCase();
  return items.filter(item => String(item.materialCode || '').toLowerCase().includes(m) && String(item.voucher || '').toLowerCase().includes(v));
}

function filterReceiptItems() {
  if (!currentReceiptDetail) return;
  const rec = currentReceiptDetail;
  const items = matchingReceiptItems(rec.items, document.getElementById('receiptMaterialQuery').value, document.getElementById('receiptVoucherQuery').value);
  document.getElementById('receiptResultCount').textContent = `共 ${rec.items.length} 项物料，匹配 ${items.length} 项`;
  document.getElementById('receiptItemsResult').innerHTML = items.length ? receiptItemsHtml({...rec, items}) : '<div class="receipt-search-empty">没有匹配的物料，请调整条件或点击重置。</div>';
}

function resetReceiptItems() {
  document.getElementById('receiptMaterialQuery').value = '';
  document.getElementById('receiptVoucherQuery').value = '';
  filterReceiptItems();
}

function switchReceiptTab(tab) {
  ['route', 'items'].forEach(key => {
    const active = key === tab;
    const button = document.getElementById(`receipt-${key}-tab`);
    button.setAttribute('aria-selected', String(active));
    button.tabIndex = active ? 0 : -1;
    document.getElementById(`receipt-${key}-panel`).hidden = !active;
  });
}

function receiptTabKey(event, current) {
  if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
  event.preventDefault();
  const next = event.key === 'Home' ? 'route' : event.key === 'End' ? 'items' : current === 'route' ? 'items' : 'route';
  switchReceiptTab(next);
  document.getElementById(`receipt-${next}-tab`).focus();
}

function openLogisticsModal() {
  const key = `${selectedDate.getFullYear()}-${selectedDate.getMonth() + 1}-${selectedDate.getDate()}`;
  openReceiptDetail(key, 0, true);
}

function closeLogisticsModal() {
  document.getElementById('logisticsModal').classList.remove('active');
  document.body.style.overflow = '';
  if (lastDetailTrigger?.focus) lastDetailTrigger.focus();
}

// Close on overlay click
document.getElementById('logisticsModal').addEventListener('click', function(e) {
  if (e.target === this) closeLogisticsModal();
});

// ESC key closes modal
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLogisticsModal();
});

// Init：优先定位到最早的共享预约日期。
const firstAppointmentKey = Object.keys(appointments).sort((a,b)=>new Date(a)-new Date(b))[0];
if (firstAppointmentKey) {
  const [y,m,d] = firstAppointmentKey.split('-').map(Number);
  currentYear=y; currentMonth=m-1; selectedDate=new Date(y,m-1,d);
  document.getElementById('selectedDateTitle').textContent = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')} 预约信息`;
}
renderCalendar();
updateSub(firstAppointmentKey || '');
renderAppointment(firstAppointmentKey || '');
</script>

</body>
</html>
