<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="light">
  <title>博格华纳 · 供应商发货登记</title>
  <style>
    .search-fields { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
    .search-fields input { flex:1; min-width:140px; width:100%; padding:10px 12px; border:1px solid var(--border-strong); border-radius:8px; background:var(--surface); color:var(--text); font:inherit; }
    .search-fields input:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
    :root {
      --primary: #07868d;
      --primary-dark: #046b71;
      --primary-soft: #e9f7f7;
      --primary-light: #eef9f9;
      --text: #27313a;
      --text-2: #5e6975;
      --text-3: #8b95a1;
      --surface: #ffffff;
      --canvas: #f4f6f8;
      --muted: #f6f8fa;
      --border: #e5e9ef;
      --border-strong: #d8dee7;
      --danger: #e95d62;
      --danger-soft: #fff0f0;
      --success: #48a66b;
      --success-soft: #eef9f1;
      --warning: #d99026;
      --warning-soft: #fff7e8;
      --shadow-sm: 0 1px 3px rgba(27,39,51,.06);
      --shadow: 0 12px 30px rgba(27,39,51,.08);
      --radius: 12px;
      --radius-sm: 8px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100dvh; background: var(--canvas); color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding-bottom: calc(var(--safe-bottom) + 84px); user-select: none;
    }
    button { font: inherit; cursor: pointer; touch-action: manipulation; border: none; background: none; }
    button:active { transform: scale(.97); }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 10; background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-top) + 10px) 16px 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .back-btn {
      width: 36px; height: 36px; border-radius: 50%; background: var(--muted);
      display: grid; place-items: center; color: var(--text-2); transition: background .15s;
    }
    .back-btn:active { background: var(--border); }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .header-logo {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff; display: grid; place-items: center; font-size: 16px; font-weight: 700; flex-shrink: 0;
    }
    .header-title { font-size: 16px; font-weight: 600; color: var(--text); }
    .header-sub { font-size: 11px; color: var(--text-3); margin-top: -1px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--muted); display: grid; place-items: center; color: var(--text-2); }
    .icon-btn:active { background: var(--border); }

    /* ── Page Body ── */
    .page-body { padding: 16px 16px 0; max-width: 640px; margin: 0 auto; }
    @media (min-width: 768px) { .page-body { padding: 24px 0 0; } }

    /* ── Page Intro ── */
    .page-intro { margin-bottom: 16px; }
    .page-intro h1 { font-size: 20px; font-weight: 700; color: var(--text); }
    .page-intro p { font-size: 13px; color: var(--text-3); margin-top: 6px; line-height: 1.5; }

    /* ── Pending List ── */
    .pend-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 2px; }
    .section-title { font-size: 15px; font-weight: 600; color: var(--text); }
    .pend-hint { font-size: 12px; color: var(--text-3); }
    .pend-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .pend-item {
      display: flex; align-items: flex-start; gap: 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px; box-shadow: var(--shadow-sm); cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .pend-item:hover { border-color: rgba(7,134,141,.45); }
    .pend-item:focus-visible { outline: 3px solid rgba(7,134,141,.18); outline-offset: 2px; }
    .pend-item:has(input:checked) { border-color: var(--primary); background: var(--primary-light); }
    .pend-check { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--primary); flex-shrink: 0; pointer-events: none; }
    .pend-body { flex: 1; min-width: 0; }
    .pend-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pend-code { font-size: 15px; font-weight: 600; color: var(--text); }
    .pend-status { font-size: 12px; color: var(--primary); background: var(--primary-soft); padding: 3px 8px; border-radius: 10px; white-space: nowrap; }
    .pend-sub { font-size: 13px; color: var(--text-2); margin-top: 3px; }
    .pend-meta { font-size: 11px; color: var(--text-3); margin-top: 5px; }
    .pend-tag { display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: 11px; background: var(--muted); color: var(--text-3); margin-left: 6px; }
    .pend-tag.direct { background: var(--primary-soft); color: var(--primary); }

    /* ── Tabs ── */
    .tab-bar {
      display: flex; gap: 6px; margin-bottom: 16px;
      background: var(--muted); padding: 4px; border-radius: 10px;
    }
    .tab {
      flex: 1; padding: 9px 8px; text-align: center; font-size: 14px; font-weight: 500;
      color: var(--text-2); border-radius: 8px; transition: all .15s;
    }
    .tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); font-weight: 600; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Shipped groups ── */
    .group-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 18px 0 8px; padding: 0 2px; }
    .group-title:first-child { margin-top: 0; }
    .group-count { color: var(--text-3); font-weight: 400; margin-left: 4px; }

    /* ── Today List ── */
    .recent-list { display: flex; flex-direction: column; gap: 1px; margin-bottom: 24px; }
    .recent-item { background: var(--surface); padding: 14px; display: flex; align-items: center; gap: 12px; border-radius: 0; cursor: pointer; }
    .recent-item:hover { background: var(--primary-light); }
    .recent-item:focus-visible { outline: 3px solid rgba(7,134,141,.18); outline-offset: 2px; }
    .recent-item:first-child { border-radius: var(--radius) var(--radius) 0 0; }
    .recent-item:last-child { border-radius: 0 0 var(--radius) var(--radius); }
    .recent-item:only-child { border-radius: var(--radius); }
    .recent-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--primary); }
    .recent-info { flex: 1; min-width: 0; }
    .recent-type { font-size: 11px; color: var(--text-3); }
    .recent-code { font-size: 14px; font-weight: 500; color: var(--text); }
    .recent-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .recent-status { font-size: 12px; padding: 3px 8px; border-radius: 10px; flex-shrink: 0; font-weight: 500; }
    .recent-status.ok     { background: var(--success-soft); color: var(--success); }
    .recent-status.shipped { background: var(--primary-soft); color: var(--primary); }
    .recent-status.danger { background: var(--danger-soft); color: var(--danger); }

    .empty-state { padding: 36px 20px; text-align: center; color: var(--text-3); background: var(--surface); border-radius: var(--radius); }

    /* ── Bottom Action Bar ── */
    .action-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 12px 16px calc(12px + var(--safe-bottom));
      display: flex; align-items: center; gap: 12px; max-width: 640px; margin: 0 auto;
    }
    .action-info { flex: 1; font-size: 13px; color: var(--text-2); }
    .action-info b { color: var(--primary); font-size: 17px; margin-right: 2px; }
    .action-btn { padding: 12px 24px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 600; border-radius: var(--radius-sm); }
    .action-btn:disabled { background: var(--border-strong); opacity: .65; }
    .action-btn:active:not(:disabled) { background: var(--primary-dark); }

    /* ── Bottom Sheet ── */
    .sheet-mask { position: fixed; inset: 0; background: rgba(27,39,51,.4); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .sheet-mask.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
      background: var(--surface); border-radius: 16px 16px 0 0; max-width: 640px; margin: 0 auto;
      transform: translateY(100%); transition: transform .25s ease; max-height: 88dvh;
      display: flex; flex-direction: column; padding-bottom: var(--safe-bottom);
    }
    .sheet.show { transform: translateY(0); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
    .sheet-title { font-size: 17px; font-weight: 700; }
    .sheet-close { width: 44px; height: 44px; border-radius: 50%; background: var(--muted); display: grid; place-items: center; color: var(--text-2); flex-shrink: 0; }
    .sheet-body { padding: 16px; overflow-y: auto; }
    .sheet-foot { padding: 12px 16px calc(12px + var(--safe-bottom)); border-top: 1px solid var(--border); }
    .asn-summary { background: var(--muted); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 16px; }
    .asn-summary-code { color: var(--primary-dark); font-size: 15px; font-weight: 700; }
    .asn-summary-supplier { color: var(--text-2); font-size: 13px; margin-top: 3px; }
    .asn-summary-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .asn-summary-meta span { color: var(--text-3); font-size: 11px; }
    .asn-summary-meta b { display: block; color: var(--text); font-size: 13px; font-weight: 600; margin-top: 2px; }
    .material-section { margin-bottom: 16px; }
    .material-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .material-head h3 { font-size: 14px; font-weight: 650; }
    .material-head span { color: var(--text-3); font-size: 12px; }
    .material-list { display: flex; flex-direction: column; gap: 10px; }
    .material-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; background: var(--surface); }
    .material-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .material-code { font-size: 14px; font-weight: 650; color: var(--text); overflow-wrap: anywhere; }
    .material-index { flex-shrink: 0; color: var(--text-3); font-size: 11px; background: var(--muted); padding: 2px 7px; border-radius: 8px; }
    .material-voucher { color: var(--text-3); font-size: 11px; margin-top: 8px; overflow-wrap: anywhere; }
    .material-qty-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
    .qty-readonly span { display: block; color: var(--text-3); font-size: 11px; margin-bottom: 4px; }
    .qty-readonly strong { display: block; min-height: 44px; line-height: 44px; color: var(--text); font-size: 15px; }
    .shipment-actual { text-align: right; }
    .batch-section { border-top: 1px dashed var(--border); margin-top: 10px; padding-top: 10px; }
    .batch-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .batch-head span { color: var(--text-3); font-size: 11px; }
    .batch-add { min-height: 30px; padding: 5px 9px; color: var(--primary-dark); border: 1px dashed var(--primary); border-radius: 6px; font-size: 12px; }
    .batch-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .batch-row { display: flex; align-items: center; gap: 8px; }
    .batch-row input { min-width: 0; min-height: 38px; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 7px; color: var(--text); font: inherit; outline: none; }
    .batch-no-input { flex: 1; }
    .batch-qty-input { width: 112px; text-align: right; }
    .batch-row input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(7,134,141,.1); }
    .batch-row input.input-error { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(233,93,98,.12); }
    .batch-remove { width: 32px; height: 32px; border: 1px solid var(--border-strong); border-radius: 6px; color: var(--text-2); flex-shrink: 0; }
    .batch-error { min-height: 18px; margin-top: 6px; color: var(--danger); font-size: 12px; }

    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
    .field .req { color: var(--danger); margin-left: 2px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 11px 12px; font-size: 14px; color: var(--text);
      background: var(--muted); border: 1px solid var(--border); border-radius: var(--radius-sm);
      outline: none; transition: border-color .15s, background .15s; font-family: inherit;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); background: var(--surface); }
    .field textarea { resize: vertical; min-height: 64px; }
    .sheet-foot .action-btn { width: 100%; }
    .detail-record { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .detail-record-item { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--muted); min-width: 0; }
    .detail-record-item.full { grid-column: 1 / -1; }
    .detail-record-item span { display: block; color: var(--text-3); font-size: 11px; }
    .detail-record-item b { display: block; color: var(--text); font-size: 13px; font-weight: 600; margin-top: 4px; overflow-wrap: anywhere; }

    .svg-icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .svg-icon.sm { width: 18px; height: 18px; }

    .toast {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(.9);
      background: rgba(39,49,58,.92); color: #fff; padding: 12px 20px; border-radius: 10px;
      font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100;
    }
    .toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <button class="back-btn" onclick="location.href='factory-warehouse.html'" aria-label="返回">
        <svg class="svg-icon sm" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="header-brand">
        <div class="header-logo">BW</div>
        <div>
          <div class="header-title">发货登记</div>
          <div class="header-sub">供应商直送</div>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" aria-label="通知">
        <svg class="svg-icon sm" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      </button>
    </div>
  </header>

  <!-- Page Body -->
  <div class="page-body">

    <div class="page-intro">
      <h1>供应商直送发货登记</h1>
      <p>直送预约成功后按 ASN 主单登记发货；一个 ASN 包含当日全部物料明细，提交后同步工厂收货端。</p>
    </div>

    <!-- Tabs -->
    <div class="tab-bar" id="tabBar">
      <button class="tab active" data-tab="pending">待发货</button>
      <button class="tab" data-tab="shipped">已发货</button>
    </div>

    <div class="search-fields"><input id="asnSearch" type="search" placeholder="输入 ASN 号查询" aria-label="ASN号模糊查询"></div>
    <!-- Pending panel -->
    <div class="tab-panel active" id="tabPending">
      <div class="pend-toolbar">
        <div class="section-title">待发货 <span id="pendCount" style="color:var(--text-3);font-weight:400;"></span></div>
        <span class="pend-hint">点击卡片查看详细信息</span>
      </div>
      <div class="pend-list" id="pendList"></div>
    </div>

    <!-- Shipped panel -->
    <div class="tab-panel" id="tabShipped">
      <div id="shippedGroups"></div>
    </div>

  </div>

  <!-- Bottom action bar -->
  <div class="action-bar">
    <div class="action-info">已选 <b id="selCount">0</b> 个 ASN</div>
    <button class="action-btn" id="confirmBtn" disabled onclick="openSheet()">确认发货</button>
  </div>

  <!-- Confirm sheet -->
  <div class="sheet-mask" id="sheetMask" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle">确认发货</div>
      <button class="sheet-close" onclick="closeSheet()" aria-label="关闭">
        <svg class="svg-icon sm" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <div class="asn-summary" id="asnSummary"></div>
      <div class="material-section">
        <div class="material-head"><h3>ASN 物料清单</h3><span id="ssCount"></span></div>
        <div class="search-fields"><input id="shipMaterialSearch" type="search" placeholder="物料编号" aria-label="物料编号模糊查询"><input id="shipVoucherSearch" type="search" placeholder="采购凭证" aria-label="采购凭证模糊查询"></div>
        <div id="shipSearchEmpty" class="empty-state" hidden>没有符合条件的物料</div>
        <div class="material-list" id="ssList"></div>
      </div>
      <div class="field">
        <label>备注</label>
        <textarea id="remark" placeholder="选填，如包装要求、特殊说明等"></textarea>
      </div>
    </div>
    <div class="sheet-foot">
      <button class="action-btn" onclick="submitShip()">确认提交</button>
    </div>
  </div>

  <!-- Shipped record detail sheet -->
  <div class="sheet-mask" id="detailMask" onclick="closeShippedDetail()"></div>
  <div class="sheet" id="detailSheet" aria-labelledby="detailTitle">
    <div class="sheet-head">
      <div class="sheet-title" id="detailTitle">发货详情</div>
      <button class="sheet-close" onclick="closeShippedDetail()" aria-label="关闭">
        <svg class="svg-icon sm" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <div class="asn-summary" id="detailSummary"></div>
      <div class="material-section">
        <div class="material-head"><h3>发货物料</h3><span id="detailCount"></span></div>
        <div class="search-fields"><input id="detailMaterialSearch" type="search" placeholder="物料编号" aria-label="物料编号模糊查询"><input id="detailVoucherSearch" type="search" placeholder="采购凭证" aria-label="采购凭证模糊查询"></div>
        <div id="detailSearchEmpty" class="empty-state" hidden>没有符合条件的物料</div>
        <div class="material-list" id="detailList"></div>
      </div>
      <div class="detail-record" id="detailRecord"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./logistics-flow.js"></script>
  <script>
    const SUP_KEY = 'bw_supplier_deliveries';
    const PLAN_KEY = LogisticsFlow.PLAN_KEY;

    const SAMPLE_PENDING = [
      { id:'DEMO-D01', materialCode:'108143-101', materialName:'壳体总成', sapSupplierCode:'30015', supplierName:'博世汽车部件（苏州）有限公司', voucher:'5500575741-10', shipDate:'2026-08-13', arrivalDate:'2026-08-15', appointmentDate:'2026-08-15', planQty:800, promisedQty:800, deliveryMode:'直送', appointmentStatus:'scheduled', status:'pending_shipment' },
      { id:'DEMO-D02', materialCode:'108143-102', materialName:'端盖组件', sapSupplierCode:'30015', supplierName:'博世汽车部件（苏州）有限公司', voucher:'5500575741-20', shipDate:'2026-08-13', arrivalDate:'2026-08-15', appointmentDate:'2026-08-15', planQty:1200, promisedQty:1180, deliveryMode:'直送', appointmentStatus:'scheduled', status:'pending_shipment' },
      { id:'DEMO-D03', materialCode:'110233-301', materialName:'输入轴组件', sapSupplierCode:'51120', supplierName:'采埃孚传动系统（上海）有限公司', voucher:'5500650001-10', shipDate:'2026-08-14', arrivalDate:'2026-08-16', appointmentDate:'2026-08-16', planQty:1500, promisedQty:1500, deliveryMode:'直送', appointmentStatus:'scheduled', status:'pending_shipment' }
    ];

    let selected = new Set();
    let activeTab = 'pending';
    let activeSheetGroup = null;

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('#tabBar .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      document.getElementById('tabPending').classList.toggle('active', tab === 'pending');
      document.getElementById('tabShipped').classList.toggle('active', tab === 'shipped');
      document.querySelector('.action-bar').style.display = tab === 'pending' ? 'flex' : 'none';
      if (tab === 'shipped') renderShipped();
    }

    function loadPlanRows() {
      return LogisticsFlow.loadRows();
    }
    function getRegisteredAsns() {
      let arr = [];
      try { arr = JSON.parse(localStorage.getItem(SUP_KEY) || '[]'); } catch (e) {}
      if (!Array.isArray(arr)) arr = [];
      return new Set(arr.map(rec => rec.asnNo || rec.no));
    }
    function getPending() {
      const rows = loadPlanRows();
      const base = rows.length ? rows : SAMPLE_PENDING;
      const reg = getRegisteredAsns();
      const directRows = base.filter(r => LogisticsFlow.deliveryText(r.deliveryMode) === '直送');
      return LogisticsFlow.byAsn(directRows).filter(g => g.items.every(r => r.status === 'pending_shipment' && r.appointmentStatus === 'scheduled') && !reg.has(g.asnNo));
    }
    function getSelectedItems() {
      const pending = getPending();
      return pending.filter(r => selected.has(r.asnNo));
    }
    // 发货登记后，按 ASN 回溯全部物料明细。
    function markPlanShipped(asnNo, quantities) {
      try {
        const rows = LogisticsFlow.loadRows();
        if (!rows.length) return;
        let changed = false;
        let itemIndex = 0;
        rows.forEach(r => {
          if (r.asnNo !== asnNo || LogisticsFlow.deliveryText(r.deliveryMode) !== '直送') return;
          r.status = 'in_transit';
          r.actualShipQty = Number(quantities[itemIndex] || 0);
          r.shipmentRegDate = new Date().toISOString().slice(0,10);
          itemIndex += 1;
          changed = true;
        });
        if (changed) LogisticsFlow.saveRows(rows);
      } catch (e) {}
    }

    function genNo(prefix) {
      const d = new Date();
      const ymd = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
      return prefix + '-' + ymd + String(Math.floor(Math.random()*900)+100);
    }
    function nowStr() {
      const d = new Date(); const p = n => String(n).padStart(2,'0');
      return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }
    let toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function renderPending() {
      const pending = getPending().filter(g => fuzzyMatch(g.asnNo, document.getElementById('asnSearch').value));
      const list = document.getElementById('pendList');
      document.getElementById('pendCount').textContent = pending.length ? '(' + pending.length + ')' : '';
      if (!pending.length) {
        list.innerHTML = `<div class="empty-state">暂无已预约待发货 ASN</div>`;
      } else {
        list.innerHTML = pending.map(g => `
          <div class="pend-item" role="button" tabindex="0" data-asn="${escapeHtml(g.asnNo)}" aria-label="查看 ${escapeHtml(g.asnNo)} 发货详细信息">
            <input type="radio" name="pendingAsn" class="pend-check" value="${escapeHtml(g.asnNo)}" ${selected.has(g.asnNo) ? 'checked' : ''} tabindex="-1" aria-hidden="true">
            <div class="pend-body">
              <div class="pend-top">
                <span class="pend-code">${escapeHtml(g.asnNo)}</span>
                <span class="pend-status">待发货</span>
              </div>
              <div class="pend-sub">${escapeHtml(g.supplierName)} · ${g.items.length} 种物料</div>
              <div class="pend-meta">预约送货 ${escapeHtml(g.items[0].appointmentDate || '-')} · 计划到货 ${escapeHtml(g.arrivalDate || '-')}<span class="pend-tag direct">直送</span></div>
            </div>
          </div>`).join('');
      }
      updateBar();
    }

    function formatNum(n) { return Number(n).toLocaleString('en-US'); }

    function updateBar() {
      const n = selected.size;
      document.getElementById('selCount').textContent = n;
      document.getElementById('confirmBtn').disabled = n === 0;
    }
    function selectAndOpen(asnNo) {
      selected.clear();
      selected.add(asnNo);
      renderPending();
      openSheet();
    }
    document.getElementById('pendList').addEventListener('click', e => {
      const item = e.target.closest('.pend-item');
      if (item) selectAndOpen(item.dataset.asn);
    });
    document.getElementById('pendList').addEventListener('keydown', e => {
      const item = e.target.closest('.pend-item');
      if (!item || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault();
      selectAndOpen(item.dataset.asn);
    });

    document.getElementById('tabBar').addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (tab) switchTab(tab.dataset.tab);
    });

    function openSheet() {
      const group = getSelectedItems()[0];
      if (!group) { toast('请先选择待发货 ASN'); return; }
      const items = group.items;
      activeSheetGroup = group;
      document.getElementById('sheetTitle').textContent = '发货详细信息 · ' + group.asnNo;
      document.getElementById('remark').value = '';
      document.getElementById('ssCount').textContent = items.length + ' 种物料';
      document.getElementById('asnSummary').innerHTML = `
        <div class="asn-summary-code">${escapeHtml(group.asnNo)}</div>
        <div class="asn-summary-supplier">${escapeHtml(group.supplierName || '-')}</div>
        <div class="asn-summary-meta">
          <span>预约送货日期<b>${escapeHtml(items[0].appointmentDate || '-')}</b></span>
          <span>计划到货日期<b>${escapeHtml(group.arrivalDate || '-')}</b></span>
        </div>`;
      document.getElementById('ssList').innerHTML = items.map((i, index) => `
        <div class="material-card">
          <div class="material-card-head">
            <div class="material-code">${escapeHtml(i.materialCode || '-')}</div>
            <span class="material-index">${index + 1}/${items.length}</span>
          </div>
          <div class="material-voucher">采购凭证：${escapeHtml(i.voucher || '-')}</div>
          <div class="batch-section"><div class="batch-head"><span>批次发货明细</span></div>${shipmentBatchRows(i).map(detail => `
            <div class="material-qty-row">
              <div class="qty-readonly"><span>批次号</span><strong>${escapeHtml(detail.batchNo || '暂未维护')}</strong><small>批次数量 ${escapeHtml(formatNum(detail.quantity))}</small></div>
              <div class="qty-readonly shipment-actual"><span>实际发货数量</span><strong>${escapeHtml(formatNum(detail.quantity))}</strong></div>
            </div>`).join('')}</div>
        </div>`).join('');
      document.getElementById('sheetMask').classList.add('show');
      document.getElementById('sheet').classList.add('show');
      setupMaterialSearch('ship', items);
    }
    function closeSheet() {
      document.getElementById('sheetMask').classList.remove('show');
      document.getElementById('sheet').classList.remove('show');
    }

    function shipmentBatchRows(item) {
      if (Array.isArray(item.batchDetails) && item.batchDetails.length) return item.batchDetails;
      const confirmed = LogisticsFlow.hasValue(item.confirmQty) ? item.confirmQty : item.promisedQty;
      return [{ batchNo: '', quantity: Number(confirmed) || 0 }];
    }


    function submitShip() {
      const group = activeSheetGroup;
      if (!group) return;
      const items = group.items;
      const quantities = [];
      const savedBatchDetails = [];
      for (let index = 0; index < items.length; index++) {
        const details = Array.isArray(items[index].batchDetails) ? items[index].batchDetails : [];
        if (!details.length) {
          const source = LogisticsFlow.hasValue(items[index].confirmQty) ? items[index].confirmQty : items[index].promisedQty;
          const value = Number(source);
          if (!LogisticsFlow.hasValue(source) || !Number.isFinite(value) || value < 0) {
            toast('请返回供应商工作台维护有效的发货数量'); return;
          }
          quantities[index] = value;
          savedBatchDetails[index] = [];
          continue;
        }
        const batchValid = details.every(detail => detail && String(detail.batchNo || '').trim() && Number.isFinite(Number(detail.quantity)) && Number(detail.quantity) >= 0);
        if (!batchValid) {
          toast('请返回供应商工作台维护完整的批次明细');
          return;
        }
        const actualDetails = details.map(detail => ({
          batchNo: detail.batchNo,
          quantity: Number(detail.quantity),
          actualShipQty: Number(detail.quantity)
        }));
        quantities[index] = actualDetails.reduce((total, detail) => total + detail.actualShipQty, 0);
        savedBatchDetails[index] = actualDetails;
      }
      const shipmentNo = genNo('SHP');
      const rec = {
        no: group.asnNo, asnNo: group.asnNo, shipmentNo,
        supplier: items[0].supplierName,
        items: items.map((i, index) => { const batchDetails = savedBatchDetails[index]; const batches = batchDetails.map(detail => detail.batchNo); return { id:i.id, asnNo:i.asnNo, materialCode: i.materialCode, materialName:i.materialName || i.materialCode, voucher: i.voucher, planQty: i.planQty, promisedQty:i.promisedQty, actualShipQty:quantities[index], batchDetails, batches, batchNo:batches[0] || '', arrivalDate: i.arrivalDate, supplierName:i.supplierName }; }),
        mode: '供应商直送',
        remark: document.getElementById('remark').value.trim(),
        time: nowStr(),
        status: 'shipped'
      };
      const arr = JSON.parse(localStorage.getItem(SUP_KEY) || '[]');
      arr.unshift(rec);
      localStorage.setItem(SUP_KEY, JSON.stringify(arr));
      markPlanShipped(group.asnNo, quantities);
      closeSheet();
      activeSheetGroup = null;
      selected.clear();
      toast('发货登记已保存，计划状态已更新为运输中');
      renderPending();
      renderShipped();
      switchTab('shipped');
    }

    function isToday(isoStr) {
      const d = new Date();
      const today = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      return String(isoStr || '').startsWith(today);
    }
    function statusClass(status) {
      if (status === 'ok') return 'ok';
      if (status === 'rejected') return 'danger';
      return 'shipped';
    }
    function statusText(status) {
      if (status === 'ok') return '已签收';
      if (status === 'rejected') return '已打回';
      return '已发货';
    }
    function recordRowHtml(r) {
      const items = Array.isArray(r.items) ? r.items : [];
      return `
        <div class="recent-item" role="button" tabindex="0" data-shipment-no="${escapeHtml(r.shipmentNo || '')}" data-asn-no="${escapeHtml(r.asnNo || r.no || '')}" aria-label="查看 ${escapeHtml(r.asnNo || r.no || '-')} 的发货详情">
          <div class="recent-dot"></div>
          <div class="recent-info">
            <div class="recent-type">供应商直送 · ${escapeHtml(r.supplier)}</div>
            <div class="recent-code">ASN ${escapeHtml(r.asnNo || r.no)}</div>
            <div class="recent-meta">物料 ${items.length} 项 · 发货单 ${escapeHtml(r.shipmentNo || '-')} · 登记 ${escapeHtml(r.time)}</div>
          </div>
          <span class="recent-status ${statusClass(r.status)}">${statusText(r.status)}</span>
        </div>`;
    }
    function renderShipped() {
      const arr = JSON.parse(localStorage.getItem(SUP_KEY) || '[]').filter(r => fuzzyMatch(r.asnNo || r.no, document.getElementById('asnSearch').value));
      const wrap = document.getElementById('shippedGroups');
      if (!arr.length) {
        wrap.innerHTML = `<div class="empty-state">暂无发货记录</div>`;
        return;
      }
      const todayArr = arr.filter(r => isToday(r.time));
      const histArr = arr.filter(r => !isToday(r.time));
      let html = '';
      if (todayArr.length) {
        html += `<div class="group-title">今日发货<span class="group-count">(${todayArr.length})</span></div>
                 <div class="recent-list">${todayArr.map(recordRowHtml).join('')}</div>`;
      }
      if (histArr.length) {
        html += `<div class="group-title">历史发货<span class="group-count">(${histArr.length})</span></div>
                 <div class="recent-list">${histArr.map(recordRowHtml).join('')}</div>`;
      }
      wrap.innerHTML = html;
    }

    function loadDeliveries() {
      try {
        const arr = JSON.parse(localStorage.getItem(SUP_KEY) || '[]');
        return Array.isArray(arr) ? arr : [];
      } catch (e) { return []; }
    }
    function displayQty(value) {
      return value == null || value === '' || !Number.isFinite(Number(value)) ? '-' : formatNum(value);
    }
    function openShippedDetail(shipmentNo, asnNo) {
      const rec = loadDeliveries().find(item => String(item.shipmentNo || '') === String(shipmentNo || '') && String(item.asnNo || item.no || '') === String(asnNo || ''));
      if (!rec) { toast('未找到该发货记录'); return; }
      const items = Array.isArray(rec.items) ? rec.items : [];
      document.getElementById('detailTitle').textContent = '发货详情 · ' + (rec.asnNo || rec.no || '-');
      document.getElementById('detailSummary').innerHTML = `
        <div class="asn-summary-code">${escapeHtml(rec.asnNo || rec.no || '-')}</div>
        <div class="asn-summary-supplier">${escapeHtml(rec.supplier || items[0]?.supplierName || '-')}</div>`;
      document.getElementById('detailCount').textContent = items.length + ' 种物料';
      document.getElementById('detailList').innerHTML = items.length ? items.map((item, index) => `
        <div class="material-card">
          <div class="material-card-head"><div class="material-code">${escapeHtml(item.materialCode || '-')}</div><span class="material-index">${index + 1}/${items.length}</span></div>
          <div class="material-voucher">采购凭证：${escapeHtml(item.voucher || '-')}</div>
          <div class="material-qty-row">
            <div class="qty-readonly"><span>承诺发货数量</span><strong>${escapeHtml(displayQty(item.promisedQty))}</strong></div>
            <div class="qty-readonly"><span>实际发货数量</span><strong>${escapeHtml(displayQty(item.actualShipQty))}</strong></div>
          </div>
          <div class="batch-section"><div class="batch-head"><span>批次号 / 批次数量</span></div><div class="material-voucher">${escapeHtml(displayBatchDetails(item) || '-')}</div></div>
        </div>`).join('') : '<div class="empty-state">该记录未保存物料明细</div>';
      document.getElementById('detailRecord').innerHTML = `
        <div class="detail-record-item"><span>发货单号</span><b>${escapeHtml(rec.shipmentNo || '-')}</b></div>
        <div class="detail-record-item"><span>登记时间</span><b>${escapeHtml(rec.time || '-')}</b></div>
        <div class="detail-record-item full"><span>备注</span><b>${escapeHtml(rec.remark || '-')}</b></div>`;
      document.getElementById('detailMask').classList.add('show');
      document.getElementById('detailSheet').classList.add('show');
      setupMaterialSearch('detail', items);
    }
    function fuzzyMatch(value, query) {
      return String(value ?? '').toLowerCase().includes(String(query ?? '').trim().toLowerCase());
    }
    function setupMaterialSearch(mode, items) {
      const list = document.getElementById(mode === 'ship' ? 'ssList' : 'detailList');
      [...list.querySelectorAll('.material-card')].forEach((card, index) => {
        card.dataset.materialCode = items[index].materialCode || '';
        card.dataset.voucher = items[index].voucher || '';
      });
      document.getElementById(mode+'MaterialSearch').value = '';
      document.getElementById(mode+'VoucherSearch').value = '';
      filterMaterialCards(mode);
    }
    function filterMaterialCards(mode) {
      const list = document.getElementById(mode === 'ship' ? 'ssList' : 'detailList');
      const material = document.getElementById(mode+'MaterialSearch').value;
      const voucher = document.getElementById(mode+'VoucherSearch').value;
      let visible = 0;
      list.querySelectorAll('.material-card').forEach(card => {
        const match = fuzzyMatch(card.dataset.materialCode, material) && fuzzyMatch(card.dataset.voucher, voucher);
        card.style.display = match ? '' : 'none';
        if (match) visible++;
      });
      document.getElementById(mode+'SearchEmpty').hidden = visible > 0 || !list.querySelector('.material-card');
    }
    document.getElementById('asnSearch').addEventListener('input', () => { renderPending(); renderShipped(); });
    ['ship','detail'].forEach(mode => ['Material','Voucher'].forEach(field => {
      document.getElementById(mode+field+'Search').addEventListener('input', () => filterMaterialCards(mode));
    }));
    function displayBatchDetails(item) {
      if (Array.isArray(item.batchDetails) && item.batchDetails.length) return item.batchDetails.map(detail => detail.actualShipQty != null ? `${detail.batchNo || '-'}：实发 ${displayQty(detail.actualShipQty)}（批次数量 ${displayQty(detail.quantity)}）` : `${detail.batchNo || '-'}：${displayQty(detail.quantity)}`).join('；');
      return (Array.isArray(item.batches) ? item.batches : (item.batchNo ? [item.batchNo] : [])).filter(Boolean).join('、');
    }
    function closeShippedDetail() {
      document.getElementById('detailMask').classList.remove('show');
      document.getElementById('detailSheet').classList.remove('show');
    }
    document.getElementById('shippedGroups').addEventListener('click', e => {
      const item = e.target.closest('.recent-item');
      if (item) openShippedDetail(item.dataset.shipmentNo, item.dataset.asnNo);
    });
    document.getElementById('shippedGroups').addEventListener('keydown', e => {
      const item = e.target.closest('.recent-item');
      if (!item || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault();
      openShippedDetail(item.dataset.shipmentNo, item.dataset.asnNo);
    });

    renderPending();
    renderShipped();
    switchTab('pending');
    window.addEventListener('storage', e => {
      if (e.key !== PLAN_KEY && e.key !== SUP_KEY) return;
      const pendingAsns = new Set(getPending().map(g => g.asnNo));
      selected = new Set([...selected].filter(asnNo => pendingAsns.has(asnNo)));
      renderPending();
      renderShipped();
    });
    window.addEventListener('focus', () => {
      const pendingAsns = new Set(getPending().map(g => g.asnNo));
      selected = new Set([...selected].filter(asnNo => pendingAsns.has(asnNo)));
      renderPending();
      if (activeTab === 'shipped') renderShipped();
    });
  </script>

</body>
</html>
