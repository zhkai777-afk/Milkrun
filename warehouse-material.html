<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>库区物料管理</title>
  <style>
    :root {
      --primary: #07868d;
      --primary-dark: #046b71;
      --primary-soft: #e9f7f7;
      --text: #27313a;
      --text-2: #5e6975;
      --text-3: #8b95a1;
      --surface: #ffffff;
      --canvas: #f4f6f8;
      --muted: #f6f8fa;
      --border: #e5e9ef;
      --border-strong: #d8dee7;
      --danger: #e95d62;
      --danger-soft: #fff0f0;
      --warning: #d99026;
      --warning-soft: #fff7e8;
      --shadow: 0 12px 30px rgba(27, 39, 51, .08);
      --radius: 10px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--canvas);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(7, 134, 141, .22); outline-offset: 1px; }

    .app-shell { min-height: 100dvh; padding: 20px; }
    .page-card { width: 100%; min-height: calc(100dvh - 40px); padding: 22px; background: var(--surface); border-radius: 4px; }
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .page-head h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .page-note { color: var(--text-3); font-size: 13px; }

    /* 搜索筛选区 */
    .filter-bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; padding: 16px; margin-bottom: 16px; background: var(--muted); border: 1px solid var(--border); border-radius: var(--radius); }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { color: var(--text-2); font-size: 13px; font-weight: 500; }
    .field input, .field select { min-width: 200px; min-height: 38px; padding: 7px 11px; border: 1px solid var(--border-strong); border-radius: 5px; background: #fff; color: var(--text); transition: border-color .18s, box-shadow .18s; }
    .field input:hover, .field select:hover { border-color: #bbc5d0; }
    .field input:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(7,134,141,.1); outline: none; }
    .field input::placeholder { color: #a8b0ba; }
    .filter-actions { display: flex; gap: 8px; margin-left: auto; }

    /* 按钮 */
    .btn { min-height: 38px; padding: 0 16px; border: 1px solid var(--border-strong); border-radius: 5px; background: var(--surface); color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: background .18s, border-color .18s, color .18s, transform .18s; }
    .btn:hover { border-color: #bfc8d3; color: var(--text); background: #fafbfc; }
    .btn:active { transform: translateY(1px); }
    .btn-primary { border-color: var(--primary); background: var(--primary); color: #fff; }
    .btn-primary:hover { border-color: var(--primary-dark); background: var(--primary-dark); color: #fff; }
    .btn-danger { border-color: #f4c9cb; background: var(--danger-soft); color: #c94349; }
    .btn-danger:hover { border-color: var(--danger); background: #ffe8e9; color: #b73238; }
    .btn-warning { border-color: #f0c781; background: var(--warning-soft); color: #b66b13; }
    .btn-warning:hover { border-color: var(--warning); background: #fff2d8; color: #9d5b0c; }
    .btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
    .btn-icon { width: 38px; padding: 0; }
    .icon { width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }

    /* 表格 */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; min-width: 1160px; }
    thead th { position: sticky; top: 0; z-index: 1; background: #fbfcfd; color: var(--text-2); font-weight: 600; font-size: 13px; text-align: left; padding: 13px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    tbody td { padding: 13px 14px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr { transition: background .15s; }
    tbody tr:hover { background: var(--primary-soft); }
    .col-check { width: 44px; text-align: center; }
    .col-operate { width: 198px; white-space: nowrap; }
    .col-time { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--text-2); }
    .check { width: 17px; height: 17px; accent-color: var(--primary); cursor: pointer; }
    .row-actions { display: flex; flex-wrap: nowrap; gap: 4px; }
    .link-btn { border: 0; background: transparent; padding: 5px 9px; border-radius: 4px; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; flex: 0 0 auto; }
    .link-btn.edit { color: var(--primary); }
    .link-btn.edit:hover { background: rgba(7,134,141,.1); }
    .link-btn.standards { color: #2b6cb0; }
    .link-btn.standards:hover { background: #eaf2fb; }
    .link-btn.delete { color: var(--danger); }
    .link-btn.delete:hover { background: var(--danger-soft); }

    .empty { padding: 64px 20px; text-align: center; color: var(--text-3); }
    .empty .icon { width: 34px; height: 34px; margin-bottom: 8px; color: #b8c0ca; }

    /* 分页 */
    .pagination { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .pagination .total { color: var(--text-3); font-size: 13px; margin-right: auto; }
    .page-size { min-height: 34px; padding: 5px 8px; border: 1px solid var(--border-strong); border-radius: 5px; background: #fff; color: var(--text); }
    .page-btn { min-width: 34px; min-height: 34px; padding: 0 9px; border: 1px solid var(--border-strong); border-radius: 5px; background: #fff; color: var(--text-2); }
    .page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .page-btn.active { border-color: var(--primary); background: var(--primary); color: #fff; }
    .page-btn:disabled { opacity: .45; cursor: not-allowed; }
    .go-page { display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 13px; }
    .go-page input { width: 56px; min-height: 34px; text-align: center; border: 1px solid var(--border-strong); border-radius: 5px; }

    /* 弹窗 */
    .modal-layer { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(22, 28, 34, .54); }
    .modal-layer.show { display: flex; }
    .modal { width: min(560px, 100%); max-height: calc(100dvh - 40px); overflow: auto; border-radius: 12px; background: #fff; box-shadow: 0 24px 70px rgba(0,0,0,.22); animation: modalIn .2s ease-out; }
    .modal.small { width: min(430px, 100%); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; min-height: 72px; padding: 0 24px; border-bottom: 1px solid var(--border); }
    .modal-head h3 { margin: 0; font-size: 19px; }
    .close-btn { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--text-3); display: grid; place-items: center; }
    .close-btn:hover { background: var(--muted); color: var(--text); }
    .modal-body { padding: 24px; }
    .form-row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; align-items: start; margin-bottom: 20px; }
    .form-label { padding-top: 10px; color: var(--text-2); text-align: right; }
    .required { color: var(--danger); margin-right: 5px; }
    .form-row input, .form-row select { width: 100%; min-height: 40px; padding: 8px 11px; border: 1px solid var(--border-strong); border-radius: 5px; background: #fff; color: var(--text); }
    .form-row input[readonly] { background: var(--muted); color: var(--text-2); cursor: default; }
    .form-row input:focus, .form-row select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(7,134,141,.1); outline: none; }
    .field-error { min-height: 19px; margin-top: 4px; color: var(--danger); font-size: 12px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px 22px; }
    .modal-foot .btn { min-width: 88px; }
    .confirm-copy { margin: 0; color: var(--text-2); line-height: 1.75; }

    /* 提示 */
    .toast-region { position: fixed; top: 20px; left: 50%; z-index: 1200; transform: translateX(-50%); display: grid; gap: 8px; pointer-events: none; }
    .toast { min-width: 260px; max-width: calc(100vw - 32px); padding: 11px 15px; border: 1px solid #b8e0ca; border-radius: 7px; background: #f2fbf5; color: #277645; box-shadow: var(--shadow); animation: toastIn .2s ease-out; }
    .toast.error { border-color: #f1bfc1; background: #fff3f3; color: #b63a40; }
    @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

    /* 检验标准 */
    .modal.wide { width: min(920px, 100%); }
    .standards-section { margin-top: 6px; padding-top: 20px; border-top: 1px dashed var(--border-strong); }
    .standards-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
    .standards-title { font-size: 15px; font-weight: 600; color: var(--text); }
    .standards-sub { margin-top: 3px; color: var(--text-3); font-size: 12.5px; }
    .standards-meta { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 6px; background: #fbfcfd; }
    .standards-meta { align-items: flex-start; }
    .standards-meta label { padding-top: 9px; color: var(--text-2); font-size: 13px; font-weight: 600; white-space: nowrap; }
    .standards-meta-main { min-width: 0; flex: 1; }
    .standards-meta input { width: min(360px, 100%); min-height: 36px; padding: 7px 10px; border: 1px solid var(--border-strong); border-radius: 5px; background: #fff; color: var(--text); }
    .standards-meta input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(7,134,141,.1); outline: none; }
    .standards-wrap { min-width: 0; }
    .standards-table { min-width: 760px; }
    .standards-table thead th { padding: 11px 12px; font-size: 12.5px; }
    .standards-table tbody td { padding: 11px 12px; font-size: 13px; }
    .standards-table .std-item { font-weight: 600; color: var(--text); }
    .standards-table .std-normal { color: var(--text-2); }
    .num-cell { font-variant-numeric: tabular-nums; text-align: right; }
    .standards-empty { padding: 26px 16px; text-align: center; color: var(--text-3); font-size: 13px; }
    .standards-empty .icon { width: 26px; height: 26px; margin-bottom: 6px; color: #b8c0ca; }
    .std-count { display: inline-flex; align-items: center; min-height: 30px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 999px; background: #fff; color: var(--text-2); font-size: 13px; white-space: nowrap; }
    .std-count:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
    .std-count.zero { color: var(--text-3); border-style: dashed; }

    /* 检验项目编辑：按信息类型分组，减少长表单的纵向扫视距离 */
    .modal.standard-editor { width: min(760px, 100%); overflow: hidden; display: flex; flex-direction: column; }
    .standard-editor .modal-head { min-height: 68px; }
    .standard-editor form { min-height: 0; display: flex; flex: 1; flex-direction: column; }
    .standard-editor .modal-body { min-height: 0; overflow-y: auto; padding: 22px 24px 8px; }
    .standard-editor-intro { margin: 0 0 18px; color: var(--text-3); font-size: 13px; }
    .standard-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
    .standard-field { min-width: 0; }
    .standard-field.full { grid-column: 1 / -1; }
    .standard-field label { display: block; margin-bottom: 7px; color: var(--text-2); font-size: 13px; font-weight: 600; }
    .standard-field input { width: 100%; min-height: 42px; padding: 8px 11px; border: 1px solid var(--border-strong); border-radius: 6px; background: #fff; color: var(--text); transition: border-color .18s, box-shadow .18s; }
    .standard-field input:hover { border-color: #bbc5d0; }
    .standard-field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(7,134,141,.1); outline: none; }
    .standard-field .field-error { min-height: 18px; }
    .field-helper { margin-top: 6px; color: var(--text-3); font-size: 12px; line-height: 1.5; }
    .drawing-entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
    .drawing-entry .btn { min-height: 42px; padding: 0 18px; }
    .drawing-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .drawing-tags:empty { display: none; }
    .drawing-tag { min-height: 34px; display: inline-flex; align-items: center; padding: 0 12px; border: 1px solid #b8dfe1; border-radius: 999px; background: #fff; color: var(--primary-dark); font-size: 13px; cursor: pointer; }
    .drawing-tag:hover { background: var(--primary-soft); }
    .drawing-tag.active { border-color: var(--primary); background: var(--primary); color: #fff; }
    .drawing-tag:focus-visible { outline: 3px solid rgba(7,134,141,.22); outline-offset: 1px; }
    .standard-editor .modal-foot { flex: 0 0 auto; margin-top: 12px; border-top: 1px solid var(--border); background: #fbfcfd; }

    @media (max-width: 820px) {
      .app-shell { padding: 12px; }
      .page-card { min-height: calc(100dvh - 24px); padding: 16px; }
      .filter-bar { padding: 14px; }
      .field input, .field select { min-width: 150px; }
      .filter-actions { margin-left: 0; width: 100%; }
      .filter-actions .btn { flex: 1; }
      .pagination { justify-content: center; }
      .pagination .total { margin-right: 0; width: 100%; text-align: center; }
      .standards-meta { align-items: stretch; flex-direction: column; gap: 6px; }
      .standards-meta input { width: 100%; }
      .standard-form-grid { grid-template-columns: 1fr; }
      .standard-field.full { grid-column: auto; }
      .drawing-entry { grid-template-columns: 1fr; }
      .drawing-entry .btn { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="page-card" aria-labelledby="pageTitle">
      <header class="page-head">
        <h1 id="pageTitle">库区物料管理</h1>
        <span class="page-note">维护库区与物料的对应关系及基础信息</span>
      </header>

      <!-- 搜索筛选 -->
      <form class="filter-bar" id="searchForm" role="search">
        <div class="field">
          <label for="fMaterialCode">物料编码</label>
          <input id="fMaterialCode" type="text" placeholder="请输入物料编码" autocomplete="off">
        </div>
        <div class="field">
          <label for="fMaterialDesc">物料描述</label>
          <input id="fMaterialDesc" type="text" placeholder="请输入物料描述" autocomplete="off">
        </div>
        <div class="field">
          <label for="fSupplierCode">供应商编号</label>
          <input id="fSupplierCode" type="text" placeholder="请输入供应商编号" autocomplete="off">
        </div>
        <div class="field">
          <label for="fSupplierName">供应商名称</label>
          <input id="fSupplierName" type="text" placeholder="请输入供应商名称" autocomplete="off">
        </div>
        <div class="field">
          <label for="fZoneCode">库区编号</label>
          <input id="fZoneCode" type="text" placeholder="请输入库区编号" autocomplete="off">
        </div>
        <div class="filter-actions">
          <button class="btn btn-primary" type="submit">
            <svg class="icon" aria-hidden="true"><circle cx="7.5" cy="7.5" r="4.5"/><path d="m11 11 4 4"/></svg>查询
          </button>
          <button class="btn" type="button" id="resetBtn">
            <svg class="icon" aria-hidden="true"><path d="M4 4v5h5M5 9a7 7 0 1 1-1 4"/></svg>重置
          </button>
        </div>
      </form>

      <!-- 操作工具栏 -->
      <div class="toolbar">
        <button class="btn btn-primary" id="addBtn" type="button">
          <svg class="icon" aria-hidden="true"><path d="M9 3v12M3 9h12"/></svg>新增
        </button>
        <button class="btn btn-danger" id="batchDeleteBtn" type="button" disabled>
          <svg class="icon" aria-hidden="true"><path d="M3 5h12M7 5V3h4v2m2 0-.7 10H5.7L5 5m3 3v4m3-4v4"/></svg>批量删除
        </button>
        <button class="btn btn-warning" id="importBtn" type="button">
          <svg class="icon" aria-hidden="true"><path d="M9 12V3m0 0L5 7m4-4 4 4M3 14v3h12v-3"/></svg>导入
        </button>
        <input id="importFile" type="file" accept=".csv,.json" hidden>
      </div>

      <!-- 数据表格 -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-check"><input class="check" id="selectAll" type="checkbox" aria-label="全选"></th>
              <th>物料编码</th>
              <th>物料描述</th>
              <th>供应商编号</th>
              <th>供应商名称</th>
              <th>库区编号</th>
              <th>库区名称</th>
              
              <th>创建时间</th>
              <th>修改时间</th>
              <th>检验标准</th>
              <th class="col-operate">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <!-- 分页 -->
      <div class="pagination">
        <span class="total" id="totalText">共 0 条</span>
        <select class="page-size" id="pageSize">
          <option value="10" selected>10 条/页</option>
          <option value="20">20 条/页</option>
          <option value="50">50 条/页</option>
        </select>
        <button class="page-btn" id="prevPage" type="button" aria-label="上一页">‹</button>
        <span id="pageNumbers" style="display:flex;gap:8px;"></span>
        <button class="page-btn" id="nextPage" type="button" aria-label="下一页">›</button>
        <span class="go-page">前往 <input id="goPageInput" type="number" min="1"> 页</span>
      </div>
    </section>
  </main>

  <!-- 新增/编辑弹窗 -->
  <div class="modal-layer" id="formModal" role="presentation">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="formModalTitle">
      <div class="modal-head">
        <h3 id="formModalTitle">新增物料</h3>
        <button class="close-btn" type="button" data-close="formModal" aria-label="关闭"><svg class="icon" aria-hidden="true"><path d="M4 4l10 10M14 4 4 14"/></svg></button>
      </div>
      <form id="materialForm" novalidate>
        <div class="modal-body">
          <div class="form-row">
            <label class="form-label" for="mMaterialCode"><span class="required">*</span>物料编码</label>
            <div>
              <input id="mMaterialCode" type="text" maxlength="30" placeholder="请输入物料编码" autocomplete="off">
              <div class="field-error" id="materialCodeError" role="alert"></div>
            </div>
          </div>
          <div class="form-row">
            <label class="form-label" for="mMaterialDesc"><span class="required">*</span>物料描述</label>
            <div>
              <input id="mMaterialDesc" type="text" maxlength="60" placeholder="请输入物料描述" autocomplete="off">
              <div class="field-error" id="materialDescError" role="alert"></div>
            </div>
          </div>
          <div class="form-row">
            <label class="form-label" for="mSupplierName">供应商名称</label>
            <div>
              <select id="mSupplierName">
                <option value="">请选择供应商</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <label class="form-label" for="mSupplierCode">供应商编号</label>
            <div>
              <input id="mSupplierCode" type="text" maxlength="30" placeholder="选择供应商后自动带入" readonly aria-readonly="true">
            </div>
          </div>
          <div class="form-row">
            <label class="form-label" for="mZoneName"><span class="required">*</span>库区名称</label>
            <div>
              <select id="mZoneName" aria-describedby="zoneNameError">
                <option value="">请选择库区</option>
              </select>
              <div class="field-error" id="zoneNameError" role="alert"></div>
            </div>
          </div>
          <div class="form-row">
            <label class="form-label" for="mZoneCode"><span class="required">*</span>库区编号</label>
            <div>
              <input id="mZoneCode" type="text" maxlength="20" placeholder="选择库区后自动带入" readonly aria-readonly="true">
              <div class="field-error" id="zoneCodeError" role="alert"></div>
            </div>
          </div>
<input id="mOwner" type="hidden">
        </div>
        <div class="modal-foot">
          <button class="btn" type="button" data-close="formModal">取消</button>
          <button class="btn btn-primary" type="submit">确认</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 检验标准维护弹窗 -->
  <div class="modal-layer" id="standardsManageModal" role="presentation">
    <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="standardsManageTitle">
      <div class="modal-head">
        <h3 id="standardsManageTitle">检验标准维护</h3>

  <!-- 删除确认弹窗 -->

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'warehouse-material-v1';
      const SUPPLIER_STORAGE_KEY = 'bw-suppliers';
      const ZONE_STORAGE_KEY = 'warehouse-zone-maintenance-v1';
      const FALLBACK_SUPPLIERS = [
        { code: 'CS_011011', name: '供应商甲', enabled: true },
        { code: 'cs-0001', name: '测试-供应商01', enabled: true },
        { code: '16670', name: '新增供应商', enabled: true },
        { code: '16668', name: '苏州瑞玛精密工业集团股份有限公司2', enabled: true }
      ];
      const FALLBACK_ZONES = [
        { code: '1', name: '1号库区', status: 'enabled' },
        { code: '2', name: '2号库区', status: 'enabled' },
        { code: '3', name: '3号库区', status: 'enabled' },
        { code: '4', name: '4号库区', status: 'disabled' }
      ];
      const svg = {
        edit: '<svg class="icon" aria-hidden="true"><path d="m10.8 3.2 2 2L6 12l-3 .8.8-3 7-6.6ZM9.5 4.5l2 2"/></svg>',
        trash: '<svg class="icon" aria-hidden="true"><path d="M3 5h12M7 5V3h4v2m2 0-.7 10H5.7L5 5m3 3v4m3-4v4"/></svg>',
        search: '<svg class="icon" aria-hidden="true"><circle cx="7.5" cy="7.5" r="4.5"/><path d="m11 11 4 4"/></svg>'
      };

      const seedData = [
        { id: crypto.randomUUID(), materialCode: 'M0001', materialDesc: '涡轮增压器总成', supplierCode: 'S1001', supplierName: '博格华纳供应链（上海）有限公司', zoneCode: 'A01', zoneName: '1号库区', owner: '王磊', createdAt: '2026-01-29 15:03:52', updatedAt: '2026-03-17 11:10:10' },
        { id: crypto.randomUUID(), materialCode: 'M0002', materialDesc: '排气歧管', supplierCode: 'S1002', supplierName: '华东精密铸造有限公司', zoneCode: 'A02', zoneName: '2号库区', owner: '李娜', createdAt: '2026-01-29 15:04:36', updatedAt: '2026-01-29 15:04:36' },
        { id: crypto.randomUUID(), materialCode: 'M0003', materialDesc: '中冷器', supplierCode: 'S1003', supplierName: '苏州冷却系统有限公司', zoneCode: 'A03', zoneName: '3号库区', owner: '张伟', createdAt: '2026-03-17 09:21:08', updatedAt: '2026-05-02 16:44:53' },
        { id: crypto.randomUUID(), materialCode: 'M0004', materialDesc: '增压器叶轮', supplierCode: 'S1002', supplierName: '华东精密铸造有限公司', zoneCode: 'A01', zoneName: '1号库区', owner: '刘洋', createdAt: '2026-03-18 10:11:22', updatedAt: '2026-03-18 10:11:22' },
        { id: crypto.randomUUID(), materialCode: 'M0005', materialDesc: '电子节气门', supplierCode: 'S1004', supplierName: '常州电子部件有限公司', zoneCode: 'B01', zoneName: '4号库区', owner: '陈静', createdAt: '2026-03-20 14:02:45', updatedAt: '2026-04-11 08:30:19' },
        { id: crypto.randomUUID(), materialCode: 'M0006', materialDesc: '进气歧管', supplierCode: 'S1005', supplierName: '宁波汽车配件有限公司', zoneCode: 'B02', zoneName: '5号库区', owner: '赵强', createdAt: '2026-04-01 11:55:00', updatedAt: '2026-04-01 11:55:00' },
        { id: crypto.randomUUID(), materialCode: 'M0007', materialDesc: '废气旁通阀', supplierCode: 'S1006', supplierName: '无锡阀门科技有限公司', zoneCode: 'A02', zoneName: '2号库区', owner: '孙莉', createdAt: '2026-04-05 13:20:31', updatedAt: '2026-06-09 17:12:44' },
        { id: crypto.randomUUID(), materialCode: 'M0008', materialDesc: '燃油分配管', supplierCode: 'S1005', supplierName: '宁波汽车配件有限公司', zoneCode: 'B01', zoneName: '4号库区', owner: '周涛', createdAt: '2026-04-12 09:08:17', updatedAt: '2026-04-12 09:08:17' },
        { id: crypto.randomUUID(), materialCode: 'M0009', materialDesc: '水泵总成', supplierCode: 'S1007', supplierName: '杭州泵业制造有限公司', zoneCode: 'C01', zoneName: '6号库区', owner: '吴敏', createdAt: '2026-05-03 15:41:09', updatedAt: '2026-05-20 10:05:51' },
        { id: crypto.randomUUID(), materialCode: 'M0010', materialDesc: '节温器', supplierCode: 'S1007', supplierName: '杭州泵业制造有限公司', zoneCode: 'C02', zoneName: '7号库区', owner: '郑浩', createdAt: '2026-05-11 18:33:26', updatedAt: '2026-05-11 18:33:26' }
      ];

      // 出厂默认检验标准（来源于出货质量数据设置与输入模板）
      const DEFAULT_STANDARDS = [
        { inspectionItem: '包装',   inspectionMethod: '目测',       technicalRequirement: '防潮，防尘，无破损，无脏污', inspectionQty: 1, standardValue: '',   upperTolerance: '',    lowerTolerance: '' },
        { inspectionItem: '孔径',   inspectionMethod: '卡尺',       technicalRequirement: '5.3+/-0.12',                inspectionQty: 5, standardValue: '5.3', upperTolerance: 0.12,  lowerTolerance: -0.12 },
        { inspectionItem: '轮廓度', inspectionMethod: 'CMM',        technicalRequirement: '0.16 Max',                  inspectionQty: 3, standardValue: '5.3', upperTolerance: 0.12,  lowerTolerance: -0.12 },
        { inspectionItem: '清洁度', inspectionMethod: '清洁度设备', technicalRequirement: '1000um Max',                inspectionQty: 5, standardValue: '5.3', upperTolerance: 0.12,  lowerTolerance: -0.12 },
        { inspectionItem: '清洁度', inspectionMethod: '清洁度设备', technicalRequirement: '5mg/pcs',                  inspectionQty: 2, standardValue: '5.3', upperTolerance: 0.12,  lowerTolerance: -0.12 }
      ];
      function cloneStandards(list) { return list.map(s => ({ ...s, drawingNumbers: Array.isArray(s.drawingNumbers) ? [...s.drawingNumbers] : undefined })); }

      const state = {
        rows: loadRows(),
        checkedIds: new Set(),
        filters: { materialCode: '', materialDesc: '', supplierCode: '', supplierName: '', zoneCode: '' },
        page: 1,
        pageSize: 10,
        editingId: null,
        pendingDelete: [],
        workingStandards: [],
        workingDrawingNumbers: [],
        activeDrawingNumber: '',
        editingStandardIndex: null,
        standardsTargetId: null
      };

      const $ = id => document.getElementById(id);
      const els = {
        tableBody: $('tableBody'), selectAll: $('selectAll'), batchDeleteBtn: $('batchDeleteBtn'),
        totalText: $('totalText'), pageNumbers: $('pageNumbers'), prevPage: $('prevPage'), nextPage: $('nextPage'),
        pageSize: $('pageSize'), goPageInput: $('goPageInput'),
        formModal: $('formModal'), formModalTitle: $('formModalTitle'), materialForm: $('materialForm'),
        mMaterialCode: $('mMaterialCode'), mMaterialDesc: $('mMaterialDesc'), mSupplierCode: $('mSupplierCode'), mSupplierName: $('mSupplierName'), mZoneCode: $('mZoneCode'), mZoneName: $('mZoneName'), mOwner: $('mOwner'),
        confirmModal: $('confirmModal'), confirmText: $('confirmText'),
        standardsManageModal: $('standardsManageModal'), standardsManageTitle: $('standardsManageTitle'), standardsDoneBtn: $('standardsDoneBtn'),
        groupDrawingNumber: $('groupDrawingNumber'), addDrawingGroupBtn: $('addDrawingGroupBtn'), drawingGroupTabs: $('drawingGroupTabs'),
        standardsBody: $('standardsBody'), standardsEmpty: $('standardsEmpty'), standardsEmptyText: $('standardsEmptyText'),
        addStandardBtn: $('addStandardBtn'),
        standardModal: $('standardModal'), standardModalTitle: $('standardModalTitle'), standardForm: $('standardForm'),
        sItem: $('sItem'), sMethod: $('sMethod'), sRequirement: $('sRequirement'), sQty: $('sQty'),
        sValue: $('sValue'), sUpper: $('sUpper'), sLower: $('sLower')
      };

      function loadRows() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return Array.isArray(parsed) && parsed.length ? parsed : seedData;
        } catch { return seedData; }
      }
      function saveRows() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.rows)); }
      function loadMasterData(key, fallback) {
        try {
          const parsed = JSON.parse(localStorage.getItem(key));
          return Array.isArray(parsed) && parsed.length ? parsed : fallback;
        } catch { return fallback; }
      }
      function escapeHtml(v) { return String(v).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
      function pad(n) { return String(n).padStart(2, '0'); }
      function formatNow() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }

      function getFilteredRows() {
        const f = state.filters;
        return state.rows.filter(r =>
          (!f.materialCode || r.materialCode.toLowerCase().includes(f.materialCode.toLowerCase())) &&
          (!f.materialDesc || r.materialDesc.toLowerCase().includes(f.materialDesc.toLowerCase())) &&
          (!f.supplierCode || (r.supplierCode || '').toLowerCase().includes(f.supplierCode.toLowerCase())) &&
          (!f.supplierName || (r.supplierName || '').toLowerCase().includes(f.supplierName.toLowerCase())) &&
          (!f.zoneCode || r.zoneCode.toLowerCase().includes(f.zoneCode.toLowerCase()))
        );
      }

      function renderTable() {
        const filtered = getFilteredRows();
        const total = filtered.length;
        const pageCount = Math.max(1, Math.ceil(total / state.pageSize));
        if (state.page > pageCount) state.page = pageCount;
        const start = (state.page - 1) * state.pageSize;
        const pageRows = filtered.slice(start, start + state.pageSize);

        if (!pageRows.length) {
          els.tableBody.innerHTML = `<tr><td colspan="11"><div class="empty">${svg.search}<div>未找到符合条件的物料记录</div></div></td></tr>`;
        } else {
          els.tableBody.innerHTML = pageRows.map(r => {
            const standards = Array.isArray(r.inspectionStandards) ? r.inspectionStandards : [];
            const count = standards.length;
            return `
            <tr>
              <td class="col-check"><input class="check row-check" type="checkbox" data-id="${r.id}" aria-label="选择${escapeHtml(r.materialCode)}" ${state.checkedIds.has(r.id) ? 'checked' : ''}></td>
              <td>${escapeHtml(r.materialCode)}</td>
              <td>${escapeHtml(r.materialDesc)}</td>
              <td>${escapeHtml(r.supplierCode || '—')}</td>
              <td>${escapeHtml(r.supplierName || '—')}</td>
              <td>${escapeHtml(r.zoneCode)}</td>
              <td>${escapeHtml(r.zoneName)}</td>
              
              <td class="col-time">${escapeHtml(r.createdAt)}</td>
              <td class="col-time">${escapeHtml(r.updatedAt)}</td>
              <td><button class="std-count${count ? '' : ' zero'}" data-standards-manage="${r.id}" type="button">${count ? count + ' 项' : '未维护'}</button></td>
              <td class="col-operate">
                <div class="row-actions">
                  <button class="link-btn edit" data-edit="${r.id}" type="button">${svg.edit}编辑</button>
                  <button class="link-btn standards" data-standards-manage="${r.id}" type="button">标准维护</button>
                  <button class="link-btn delete" data-delete="${r.id}" type="button">${svg.trash}删除</button>
                </div>
              </td>
            </tr>`;
          }).join('');
        }

        // 全选状态
        const visibleIds = pageRows.map(r => r.id);
        const checkedVisible = visibleIds.filter(id => state.checkedIds.has(id)).length;
        els.selectAll.checked = visibleIds.length > 0 && checkedVisible === visibleIds.length;
        els.selectAll.indeterminate = checkedVisible > 0 && checkedVisible < visibleIds.length;
        els.batchDeleteBtn.disabled = state.checkedIds.size === 0;

        // 分页
        els.totalText.textContent = `共 ${total} 条`;
        els.prevPage.disabled = state.page <= 1;
        els.nextPage.disabled = state.page >= pageCount;
        let pages = [];
        for (let i = 1; i <= pageCount; i++) pages.push(i);
        els.pageNumbers.innerHTML = pages.map(p =>
          `<button class="page-btn ${p === state.page ? 'active' : ''}" data-page="${p}" type="button">${p}</button>`
        ).join('');
        els.goPageInput.max = pageCount;
      }

      function renderAll() { renderTable(); }

      function openModal(id) {
        $(id).classList.add('show');
        document.body.style.overflow = 'hidden';
        setTimeout(() => $(id).querySelector('input, button, select')?.focus(), 0);
      }
      function closeModal(id) {
        $(id).classList.remove('show');
        if (!document.querySelector('.modal-layer.show')) document.body.style.overflow = '';
      }
      function toast(message, type = 'success') {
        const node = document.createElement('div');
        node.className = `toast ${type === 'error' ? 'error' : ''}`;
        node.textContent = message;
        $('toastRegion').appendChild(node);
        setTimeout(() => node.remove(), 3200);
      }
      function clearErrors() { ['materialCodeError','materialDescError','zoneCodeError','zoneNameError'].forEach(id => $(id).textContent = ''); }
      function clearStandardErrors() { ['sItemError','sMethodError','sRequirementError','sQtyError','sValueError','sUpperError','sLowerError'].forEach(id => $(id).textContent = ''); }

      function normalizeDrawingNumbers(standard) {
        const source = Array.isArray(standard?.drawingNumbers) && standard.drawingNumbers.length
          ? standard.drawingNumbers
          : standard?.drawingNumber ? [standard.drawingNumber] : [];
        const seen = new Set();
        return source.map(value => String(value).trim()).filter(value => {
          const key = value.toLowerCase();
          if (!value || seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      function renderDrawingGroups() {
        els.drawingGroupTabs.innerHTML = state.workingDrawingNumbers.map(number => `
          <button class="drawing-tag${number === state.activeDrawingNumber ? ' active' : ''}" type="button" data-drawing-group="${escapeHtml(number)}" aria-pressed="${number === state.activeDrawingNumber}">${escapeHtml(number)}</button>`).join('');
        els.addStandardBtn.disabled = !state.activeDrawingNumber;
      }

      function addDrawingGroup() {
        const number = els.groupDrawingNumber.value.trim();
        $('groupDrawingError').textContent = '';
        if (!number) { $('groupDrawingError').textContent = '请输入图纸编号'; els.groupDrawingNumber.focus(); return; }
        const existing = state.workingDrawingNumbers.find(value => value.toLowerCase() === number.toLowerCase());
        if (existing) {
          state.activeDrawingNumber = existing;
          $('groupDrawingError').textContent = '该图纸编号已存在，已切换到对应标准';
        } else {
          const firstDrawing = state.workingDrawingNumbers.length === 0;
          state.workingDrawingNumbers.push(number);
          state.activeDrawingNumber = number;
          if (firstDrawing) {
            state.workingStandards = state.workingStandards.map(item => item.drawingNumber
              ? item
              : { ...item, drawingNumbers: [number], drawingNumber: number });
          }
        }
        els.groupDrawingNumber.value = '';
        renderDrawingGroups();
        renderStandards();
      }

      function populateMasterSelect(select, records, currentCode, currentName, { placeholder, isEnabled }) {
        const normalizedCode = String(currentCode || '').toLowerCase();
        const currentRecord = records.find(item => String(item.code || '').toLowerCase() === normalizedCode);
        const visible = records.filter(isEnabled);
        if (currentRecord && !visible.includes(currentRecord)) visible.push(currentRecord);
        if (!currentRecord && (currentCode || currentName)) {
          visible.push({ code: currentCode, name: currentName, legacy: true });
        }

        select.innerHTML = '';
        const empty = document.createElement('option');
        empty.value = '';
        empty.textContent = placeholder;
        select.appendChild(empty);
        visible.forEach((item, index) => {
          const option = document.createElement('option');
          option.value = String(index);
          option.dataset.code = item.code || '';
          option.dataset.name = item.name || '';
          option.textContent = `${item.name || '未命名'}（${item.code || '无编号'}）${item.legacy ? '（当前记录关联）' : isEnabled(item) ? '' : '（已停用）'}`;
          select.appendChild(option);
        });

        const matchedIndex = visible.findIndex(item =>
          String(item.code || '').toLowerCase() === normalizedCode &&
          (!currentName || item.name === currentName || item === currentRecord)
        );
        select.value = matchedIndex >= 0 ? String(matchedIndex) : '';
      }

      function syncMasterSelection(select, codeInput) {
        const option = select.selectedOptions[0];
        codeInput.value = option?.dataset.code || '';
      }

      function refreshMasterOptions(row) {
        const suppliers = loadMasterData(SUPPLIER_STORAGE_KEY, FALLBACK_SUPPLIERS);
        const zones = loadMasterData(ZONE_STORAGE_KEY, FALLBACK_ZONES);
        populateMasterSelect(els.mSupplierName, suppliers, row?.supplierCode, row?.supplierName, {
          placeholder: '请选择供应商（选填）',
          isEnabled: item => item.enabled !== false
        });
        populateMasterSelect(els.mZoneName, zones, row?.zoneCode, row?.zoneName, {
          placeholder: '请选择库区',
          isEnabled: item => item.status !== 'disabled'
        });
        syncMasterSelection(els.mSupplierName, els.mSupplierCode);
        syncMasterSelection(els.mZoneName, els.mZoneCode);
      }

      function renderStandards() {
        const list = state.activeDrawingNumber
          ? state.workingStandards
            .map((standard, index) => ({ standard, index }))
            .filter(({ standard }) => standard.drawingNumber === state.activeDrawingNumber)
          : [];
        if (!list.length) {
          els.standardsBody.innerHTML = '';
          els.standardsEmpty.hidden = false;
          els.standardsEmptyText.textContent = state.activeDrawingNumber
            ? `图纸「${state.activeDrawingNumber}」下暂无检验项目，点击「添加检验项目」开始维护`
            : '请先添加并选中图纸编号';
          return;
        }
        els.standardsEmpty.hidden = true;
        els.standardsBody.innerHTML = list.map(({ standard: s, index }) => `
          <tr>
            <td class="std-item">${escapeHtml(s.inspectionItem)}</td>
            <td class="std-normal">${escapeHtml(s.inspectionMethod || '—')}</td>
            <td class="std-normal">${escapeHtml(s.technicalRequirement || '—')}</td>
            <td class="num-cell">${s.inspectionQty != null && s.inspectionQty !== '' ? escapeHtml(String(s.inspectionQty)) : '—'}</td>
            <td class="num-cell">${s.standardValue != null && s.standardValue !== '' ? escapeHtml(String(s.standardValue)) : '—'}</td>
            <td class="num-cell">${s.upperTolerance != null && s.upperTolerance !== '' ? escapeHtml(String(s.upperTolerance)) : '—'}</td>
            <td class="num-cell">${s.lowerTolerance != null && s.lowerTolerance !== '' ? escapeHtml(String(s.lowerTolerance)) : '—'}</td>
            <td class="col-operate">
              <div class="row-actions">
                <button class="link-btn edit" data-edit-standard="${index}" type="button">${svg.edit}编辑</button>
                <button class="link-btn delete" data-delete-standard="${index}" type="button">${svg.trash}删除</button>
              </div>
            </td>
          </tr>`).join('');
      }

      function openStandardModal(index = null) {
        if (!state.activeDrawingNumber) {
          $('groupDrawingError').textContent = '请先添加并选中图纸编号';
          els.groupDrawingNumber.focus();
          return;
        }
        state.editingStandardIndex = index;
        clearStandardErrors();
        const s = index != null ? state.workingStandards[index] : null;
        els.standardModalTitle.textContent = s ? '编辑检验项目' : '添加检验项目';
        els.sItem.value = s?.inspectionItem || '';
        els.sMethod.value = s?.inspectionMethod || '';
        els.sRequirement.value = s?.technicalRequirement || '';
        els.sQty.value = s?.inspectionQty ?? '';
        els.sValue.value = s?.standardValue ?? '';
        els.sUpper.value = s?.upperTolerance ?? '';
        els.sLower.value = s?.lowerTolerance ?? '';
        openModal('standardModal');
      }

      function submitStandard(event) {
        event.preventDefault();
        clearStandardErrors();
        const inspectionItem = els.sItem.value.trim();
        if (!inspectionItem) { $('sItemError').textContent = '请输入检验项目'; return; }
        const drawingNumber = state.activeDrawingNumber;
        const item = {
          inspectionItem, drawingNumbers: [drawingNumber], drawingNumber,
          inspectionMethod: els.sMethod.value.trim(),
          technicalRequirement: els.sRequirement.value.trim(),
          inspectionQty: els.sQty.value === '' ? '' : Number(els.sQty.value),
          standardValue: els.sValue.value.trim(),
          upperTolerance: els.sUpper.value === '' ? '' : Number(els.sUpper.value),
          lowerTolerance: els.sLower.value === '' ? '' : Number(els.sLower.value)
        };
        if (state.editingStandardIndex != null) state.workingStandards[state.editingStandardIndex] = item;
        else state.workingStandards.push(item);
        renderStandards();
        closeModal('standardModal');
      }

      function deleteStandard(index) {
        state.workingStandards.splice(index, 1);
        renderStandards();
      }

      function loadWorkingStandards(row) {
        const source = Array.isArray(row?.inspectionStandards) ? cloneStandards(row.inspectionStandards) : cloneStandards(DEFAULT_STANDARDS);
        return source.flatMap(standard => {
          const numbers = normalizeDrawingNumbers({
            drawingNumbers: standard.drawingNumbers,
            drawingNumber: standard.drawingNumber || row?.drawingNumber || ''
          });
          if (!numbers.length) return [{ ...standard, drawingNumbers: [], drawingNumber: '' }];
          return numbers.map(number => ({ ...standard, drawingNumbers: [number], drawingNumber: number }));
        });
      }

      function loadWorkingDrawingNumbers(row, standards) {
        const values = Array.isArray(row?.inspectionDrawingNumbers) ? row.inspectionDrawingNumbers : [];
        const source = [...values, ...standards.map(item => item.drawingNumber), row?.drawingNumber || ''];
        const seen = new Set();
        return source.map(value => String(value || '').trim()).filter(value => {
          const key = value.toLowerCase();
          if (!value || seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      function openStandardsManage(id) {
        const row = state.rows.find(r => r.id === id);
        if (!row) return;
        state.standardsTargetId = id;
        state.workingStandards = loadWorkingStandards(row);
        state.workingDrawingNumbers = loadWorkingDrawingNumbers(row, state.workingStandards);
        state.activeDrawingNumber = state.workingDrawingNumbers[0] || '';
        els.groupDrawingNumber.value = '';
        $('groupDrawingError').textContent = '';
        els.standardsManageTitle.textContent = `检验标准维护 · ${row.materialCode}`;
        renderDrawingGroups();
        renderStandards();
        openModal('standardsManageModal');
      }

      function commitStandards() {
        const row = state.rows.find(r => r.id === state.standardsTargetId);
        if (row) {
          row.inspectionStandards = cloneStandards(state.workingStandards);
          row.inspectionDrawingNumbers = [...state.workingDrawingNumbers];
          row.drawingNumber = state.workingDrawingNumbers[0] || '';
          row.updatedAt = formatNow();
        }
        saveRows();
        renderAll();
      }

      function openForm(id = null) {
        state.editingId = id;
        clearErrors();
        const row = state.rows.find(r => r.id === id);
        els.formModalTitle.textContent = row ? '编辑物料' : '新增物料';
        els.mMaterialCode.value = row?.materialCode || '';
        els.mMaterialDesc.value = row?.materialDesc || '';
        refreshMasterOptions(row);
        els.mOwner.value = row?.owner || '';
        openModal('formModal');
      }

      function submitForm(event) {
        event.preventDefault();
        clearErrors();
        const materialCode = els.mMaterialCode.value.trim();
        const materialDesc = els.mMaterialDesc.value.trim();
        const supplierCode = els.mSupplierCode.value.trim();
        const supplierName = els.mSupplierName.selectedOptions[0]?.dataset.name || '';
        const zoneCode = els.mZoneCode.value.trim();
        const zoneName = els.mZoneName.selectedOptions[0]?.dataset.name || '';
        const owner = els.mOwner.value.trim();
        let valid = true;
        if (!materialCode) { $('materialCodeError').textContent = '请输入物料编码'; valid = false; }
        else if (state.rows.some(r => r.materialCode.toLowerCase() === materialCode.toLowerCase() && r.id !== state.editingId)) { $('materialCodeError').textContent = '物料编码已存在'; valid = false; }
        if (!materialDesc) { $('materialDescError').textContent = '请输入物料描述'; valid = false; }
        if (!zoneCode || !zoneName) { $('zoneNameError').textContent = '请选择库区'; valid = false; }
        if (!valid) return;

        if (state.editingId) {
          const row = state.rows.find(r => r.id === state.editingId);
          // 物料基础信息编辑不改动检验标准，保持原有值
          Object.assign(row, { materialCode, materialDesc, supplierCode, supplierName, zoneCode, zoneName, owner, updatedAt: formatNow() });
          toast('物料信息已更新');
        } else {
          state.rows.unshift({ id: crypto.randomUUID(), materialCode, materialDesc, supplierCode, supplierName, zoneCode, zoneName, owner, inspectionStandards: cloneStandards(DEFAULT_STANDARDS), inspectionDrawingNumbers: [], createdAt: formatNow(), updatedAt: formatNow() });
          toast('物料新增成功');
        }
        saveRows();
        closeModal('formModal');
        renderAll();
      }

      function requestDelete(ids) {
        const valid = [...new Set(ids)].filter(id => state.rows.some(r => r.id === id));
        if (!valid.length) return;
        state.pendingDelete = valid;
        const names = state.rows.filter(r => valid.includes(r.id)).map(r => r.materialCode);
        els.confirmText.textContent = valid.length === 1
          ? `确定删除物料「${names[0]}」吗？删除后无法恢复。`
          : `确定删除选中的 ${valid.length} 条物料记录吗？删除后无法恢复。`;
        openModal('confirmModal');
      }

      function confirmDelete() {
        const removed = state.pendingDelete.length;
        state.rows = state.rows.filter(r => !state.pendingDelete.includes(r.id));
        state.pendingDelete.forEach(id => state.checkedIds.delete(id));
        state.pendingDelete = [];
        saveRows();
        closeModal('confirmModal');
        renderAll();
        toast(`已删除 ${removed} 条记录`);
      }

      function importData(text, type) {
        let imported;
        try {
          if (type === 'json') imported = JSON.parse(text);
          else {
            const lines = text.trim().split(/\r?\n/);
            const headers = lines[0].split(',');
            imported = lines.slice(1).map(line => {
              const cells = line.split(',');
              const obj = {};
              headers.forEach((h, i) => obj[h.trim()] = (cells[i] || '').trim());
              return obj;
            });
          }
        } catch (e) {
          toast('导入文件解析失败，请检查格式', 'error');
          return;
        }
        if (!Array.isArray(imported)) { toast('导入文件格式不正确', 'error'); return; }
        let count = 0;
        const now = formatNow();
        imported.forEach(item => {
          const materialCode = (item.materialCode || '').trim();
          const materialDesc = (item.materialDesc || '').trim();
          const supplierCode = (item.supplierCode || '').trim();
          const supplierName = (item.supplierName || '').trim();
          const zoneCode = (item.zoneCode || '').trim();
          const zoneName = (item.zoneName || '').trim();
          const owner = (item.owner || '').trim();
          if (!materialCode || !materialDesc || !zoneCode || !zoneName) return;
          if (state.rows.some(r => r.materialCode.toLowerCase() === materialCode.toLowerCase())) return;
          state.rows.unshift({ id: crypto.randomUUID(), materialCode, materialDesc, supplierCode, supplierName, zoneCode, zoneName, owner, inspectionStandards: [], createdAt: now, updatedAt: now });
          count++;
        });
        saveRows();
        renderAll();
        toast(`成功导入 ${count} 条记录`);
      }

      // 事件绑定
      $('searchForm').addEventListener('submit', e => {
        e.preventDefault();
        state.filters.materialCode = $('fMaterialCode').value.trim();
        state.filters.materialDesc = $('fMaterialDesc').value.trim();
        state.filters.supplierCode = $('fSupplierCode').value.trim();
        state.filters.supplierName = $('fSupplierName').value.trim();
        state.filters.zoneCode = $('fZoneCode').value.trim();
        state.page = 1;
        renderAll();
      });
      $('resetBtn').addEventListener('click', () => {
        state.filters = { materialCode: '', materialDesc: '', supplierCode: '', supplierName: '', zoneCode: '' };
        $('fMaterialCode').value = ''; $('fMaterialDesc').value = ''; $('fSupplierCode').value = ''; $('fSupplierName').value = ''; $('fZoneCode').value = '';
        state.page = 1; renderAll();
      });
      $('addBtn').addEventListener('click', () => openForm());
      els.mSupplierName.addEventListener('change', () => syncMasterSelection(els.mSupplierName, els.mSupplierCode));
      els.mZoneName.addEventListener('change', () => { syncMasterSelection(els.mZoneName, els.mZoneCode); $('zoneNameError').textContent = ''; });
      els.materialForm.addEventListener('submit', submitForm);
      $('confirmDeleteBtn').addEventListener('click', confirmDelete);

      // 检验标准维护
      els.addStandardBtn.addEventListener('click', () => openStandardModal());
      els.standardForm.addEventListener('submit', submitStandard);
      els.addDrawingGroupBtn.addEventListener('click', addDrawingGroup);
      els.groupDrawingNumber.addEventListener('keydown', event => {
        if (event.isComposing || event.key !== 'Enter') return;
        event.preventDefault();
        addDrawingGroup();
      });
      els.drawingGroupTabs.addEventListener('click', event => {
        const group = event.target.closest('[data-drawing-group]');
        if (!group) return;
        state.activeDrawingNumber = group.dataset.drawingGroup;
        $('groupDrawingError').textContent = '';
        renderDrawingGroups();
        renderStandards();
      });
      els.standardsDoneBtn.addEventListener('click', () => { commitStandards(); closeModal('standardsManageModal'); });
      els.standardsBody.addEventListener('click', e => {
        const edit = e.target.closest('[data-edit-standard]');
        if (edit) { openStandardModal(Number(edit.dataset.editStandard)); return; }
        const del = e.target.closest('[data-delete-standard]');
        if (del) { deleteStandard(Number(del.dataset.deleteStandard)); }
      });
      els.batchDeleteBtn.addEventListener('click', () => requestDelete([...state.checkedIds]));

      els.selectAll.addEventListener('change', e => {
        const pageRows = getFilteredRows().slice((state.page - 1) * state.pageSize, (state.page - 1) * state.pageSize + state.pageSize);
        pageRows.forEach(r => e.target.checked ? state.checkedIds.add(r.id) : state.checkedIds.delete(r.id));
        renderAll();
      });

      els.tableBody.addEventListener('click', e => {
        const std = e.target.closest('[data-standards-manage]');
        if (std) { openStandardsManage(std.dataset.standardsManage); return; }
        const edit = e.target.closest('[data-edit]');
        if (edit) { openForm(edit.dataset.edit); return; }
        const del = e.target.closest('[data-delete]');
        if (del) { requestDelete([del.dataset.delete]); return; }
        const check = e.target.closest('.row-check');
        if (check) { check.checked ? state.checkedIds.add(check.dataset.id) : state.checkedIds.delete(check.dataset.id); renderAll(); }
      });

      // 分页
      els.pageSize.addEventListener('change', () => { state.pageSize = Number(els.pageSize.value); state.page = 1; renderAll(); });
      els.prevPage.addEventListener('click', () => { if (state.page > 1) { state.page--; renderAll(); } });
      els.nextPage.addEventListener('click', () => { const total = getFilteredRows().length; if (state.page < Math.ceil(total / state.pageSize)) { state.page++; renderAll(); } });
      els.pageNumbers.addEventListener('click', e => { const btn = e.target.closest('[data-page]'); if (btn) { state.page = Number(btn.dataset.page); renderAll(); } });
      els.goPageInput.addEventListener('change', () => {
        const total = getFilteredRows().length;
        const max = Math.max(1, Math.ceil(total / state.pageSize));
        const val = Math.min(max, Math.max(1, Number(els.goPageInput.value) || 1));
        state.page = val; els.goPageInput.value = val; renderAll();
      });

      // 导入
      $('importBtn').addEventListener('click', () => $('importFile').click());
      $('importFile').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => importData(reader.result, file.name.toLowerCase().endsWith('.json') ? 'json' : 'csv');
        reader.readAsText(file, 'utf-8');
        e.target.value = '';
      });

      // 弹窗关闭
      document.querySelectorAll('[data-close]').forEach(btn => btn.addEventListener('click', () => closeModal(btn.dataset.close)));
      document.querySelectorAll('.modal-layer').forEach(layer => layer.addEventListener('mousedown', e => { if (e.target === layer) closeModal(layer.id); }));
      document.addEventListener('keydown', e => { if (e.key === 'Escape') { const open = [...document.querySelectorAll('.modal-layer.show')].pop(); if (open) closeModal(open.id); } });

      renderAll();
    })();
  </script>
</body>
</html>
