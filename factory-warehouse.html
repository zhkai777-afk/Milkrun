<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="light">
  <title>博格华纳 · 工厂仓库收货</title>
  <style>
    :root {
      --primary: #07868d;
      --primary-dark: #046b71;
      --primary-soft: #e9f7f7;
      --primary-light: #eef9f9;
      --text: #27313a;
      --text-2: #5e6975;
      --text-3: #8b95a1;
      --surface: #ffffff;
      --canvas: #f4f6f8;
      --muted: #f6f8fa;
      --border: #e5e9ef;
      --border-strong: #d8dee7;
      --danger: #e95d62;
      --danger-soft: #fff0f0;
      --success: #48a66b;
      --success-soft: #eef9f1;
      --warning: #d99026;
      --warning-soft: #fff7e8;
      --shadow-sm: 0 1px 3px rgba(27,39,51,.06);
      --shadow: 0 12px 30px rgba(27,39,51,.08);
      --radius: 12px;
      --radius-sm: 8px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100dvh;
      background: var(--canvas);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding-bottom: calc(var(--safe-bottom) + 20px);
      user-select: none;
    }
    button { font: inherit; cursor: pointer; touch-action: manipulation; border: none; background: none; }
    button:active { transform: scale(.97); }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-top) + 10px) 20px 10px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .header-logo {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      display: grid; place-items: center;
      font-size: 16px; font-weight: 700;
      flex-shrink: 0;
    }
    .header-title { font-size: 16px; font-weight: 600; color: var(--text); }
    .header-sub { font-size: 11px; color: var(--text-3); margin-top: -1px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--muted);
      display: grid; place-items: center;
      color: var(--text-2); transition: background .15s;
    }
    .icon-btn:active { background: var(--border); }
    .badge-dot { position: relative; }
    .badge-dot::after {
      content: '';
      position: absolute; top: 4px; right: 4px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--danger);
      border: 1.5px solid var(--surface);
    }

    /* ── Page Body ── */
    .page-body { padding: 16px 16px 0; max-width: 640px; margin: 0 auto; }
    @media (min-width: 768px) { .page-body { padding: 24px 0 0; } }

    /* ── Welcome ── */
    .welcome { margin-bottom: 18px; }
    .welcome-greeting { font-size: 22px; font-weight: 700; color: var(--text); }
    .welcome-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--text-3); flex-wrap: wrap; }
    .welcome-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border-strong); }
    .welcome-meta strong { color: var(--text-2); font-weight: 500; }

    /* ── Stats Row ── */
    .stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
    @media (min-width: 540px) { .stats-row { gap: 14px; } }
    .stat-item {
      background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
      padding: 14px 12px; text-align: center;
      box-shadow: var(--shadow-sm); transition: box-shadow .2s;
    }
    .stat-num { font-size: 24px; font-weight: 700; color: var(--primary); line-height: 1.2; }
    @media (min-width: 540px) { .stat-num { font-size: 28px; } }
    .stat-label { font-size: 12px; color: var(--text-3); margin-top: 4px; }
    .stat-label.warning { color: var(--warning); }

    /* ── Filter Tabs ── */
    .filter-tabs {
      display: flex; gap: 6px; background: var(--muted); padding: 4px;
      border-radius: 10px; margin-bottom: 14px; overflow-x: auto;
    }
    .filter-tab {
      flex: 1; white-space: nowrap; padding: 8px 10px; border-radius: 7px;
      font-size: 13px; font-weight: 500; color: var(--text-2);
      transition: background .15s, color .15s;
    }
    .filter-tab.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }
    .filter-tab .t-count {
      display: inline-block; min-width: 18px; margin-left: 4px;
      font-size: 11px; color: var(--text-3); font-weight: 600;
    }
    .filter-tab.active .t-count { color: var(--primary); }

    /* ── Receipt List ── */
    .receipt-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .receipt-card {
      position: relative; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 14px 14px 16px;
      box-shadow: var(--shadow-sm); cursor: pointer;
      transition: border-color .15s, box-shadow .2s; overflow: hidden;
    }
    .receipt-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    }
    .receipt-card.sup::before { background: var(--primary); }
    .receipt-card.car::before { background: var(--warning); }
    .receipt-card:active { box-shadow: var(--shadow); border-color: var(--border-strong); }
    .rc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .rc-kind { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 9px; }
    .rc-kind.sup { background: var(--primary-soft); color: var(--primary); }
    .rc-kind.car { background: var(--warning-soft); color: var(--warning); }
    .rc-code { font-size: 15px; font-weight: 600; color: var(--text); }
    .rc-sub { font-size: 13px; color: var(--text-2); margin-top: 3px; }
    .rc-meta { font-size: 11px; color: var(--text-3); margin-top: 5px; }

    .recent-status { font-size: 12px; padding: 3px 9px; border-radius: 10px; font-weight: 500; flex-shrink: 0; }
    .recent-status.ok       { background: var(--success-soft); color: var(--success); }
    .recent-status.pending  { background: var(--warning-soft); color: var(--warning); }

    .empty-state { padding: 40px 20px; text-align: center; color: var(--text-3); background: var(--surface); border-radius: var(--radius); }

    /* ── Detail Sheet ── */
    .sheet-mask { position: fixed; inset: 0; background: rgba(27,39,51,.4); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .sheet-mask.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
      background: var(--surface); border-radius: 16px 16px 0 0; max-width: 640px; margin: 0 auto;
      transform: translateY(100%); transition: transform .25s ease; max-height: 90dvh;
      display: flex; flex-direction: column; padding-bottom: var(--safe-bottom);
    }
    .sheet.show { transform: translateY(0); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
    .sheet-title { font-size: 17px; font-weight: 700; }
    .sheet-close { width: 32px; height: 32px; border-radius: 50%; background: var(--muted); display: grid; place-items: center; color: var(--text-2); }
    .sheet-body { padding: 16px; overflow-y: auto; }
    .sheet-foot { padding: 12px 16px calc(12px + var(--safe-bottom)); border-top: 1px solid var(--border); display: flex; gap: 12px; }
    .sheet-foot .btn-confirm { flex: 1; }

    /* ── Detail content ── */
    .ds-summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .ds-code { font-size: 17px; font-weight: 700; color: var(--text); }
    .ds-type { font-size: 12px; color: var(--text-3); margin-top: 2px; }

    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-bottom: 18px; }
    .meta-item { min-width: 0; }
    .meta-label { font-size: 11px; color: var(--text-3); }
    .meta-val { font-size: 13px; color: var(--text); font-weight: 500; margin-top: 2px; word-break: break-all; }

    .block-title { font-size: 14px; font-weight: 600; color: var(--text); margin: 18px 0 10px; display: flex; align-items: center; gap: 6px; }
    .block-title::before { content: ''; width: 3px; height: 13px; background: var(--primary); border-radius: 2px; }

    /* Material table */
    .mat-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .mat-table th { text-align: left; font-size: 11px; color: var(--text-3); font-weight: 500; padding: 6px 8px; background: var(--muted); }
    .mat-table th:first-child { border-radius: 6px 0 0 6px; }
    .mat-table th:last-child { border-radius: 0 6px 6px 0; }
    .mat-table td { padding: 8px; border-top: 1px solid var(--border); vertical-align: middle; }
    .mat-table .m-code { font-weight: 600; color: var(--text); }
    .mat-table .m-sub { color: var(--text-2); font-size: 12px; }
    .mat-table .m-num { color: var(--primary); font-weight: 600; text-align: right; }
    .act-input {
      width: 84px; padding: 7px 8px; font-size: 13px; text-align: right;
      background: var(--muted); border: 1px solid var(--border); border-radius: 6px;
      outline: none; font-family: inherit; color: var(--text);
    }
    .act-input:focus { border-color: var(--primary); background: var(--surface); }
    .m-diff { font-size: 11px; margin-top: 2px; }
    .m-diff.neg { color: var(--danger); }
    .m-diff.zero { color: var(--text-3); }

    /* Map + Route */
    .map-wrap {
      position: relative; border-radius: 14px; overflow: hidden;
      border: 1px solid var(--border); background: #eef4f0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.6), 0 8px 24px rgba(17,51,40,.08);
    }
    .map-svg { display: block; width: 100%; height: auto; }
    .map-pin-label { font-size: 9px; fill: var(--text-2); }
    .map-pin-label.strong { fill: var(--text); font-weight: 700; }

    .map-overlay {
      position: absolute; left: 10px; top: 10px; right: 10px; display: flex; gap: 8px; justify-content: space-between; pointer-events: none;
    }
    .map-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,.92); backdrop-filter: blur(6px);
      box-shadow: 0 2px 8px rgba(17,51,40,.1); color: var(--text);
    }
    .map-badge.dot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
    .map-badge.dot.ok::before { background: var(--success); box-shadow: 0 0 0 2px var(--success-soft); }

    .map-legend {
      position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; pointer-events: none;
    }
    .map-legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-3); background: rgba(255,255,255,.9); padding: 4px 8px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .map-legend-dot { width: 7px; height: 7px; border-radius: 50%; }

    @keyframes dashFlow { to { stroke-dashoffset: -36; } }
    @keyframes pinBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes truckPulse {
      0% { transform: scale(1); opacity: .55; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    /* Tracking timeline (Taobao-style) */
    .timeline { margin-top: 4px; padding: 2px 0; }
    .tl-item { display: flex; gap: 12px; align-items: stretch; }
    .tl-rail { display: flex; flex-direction: column; align-items: center; width: 14px; flex-shrink: 0; }
    .tl-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; margin-top: 2px; box-sizing: border-box; }
    .tl-dot.done     { background: var(--primary); }
    .tl-dot.current  { background: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
    .tl-dot.todo     { background: #fff; border: 2px solid var(--border-strong); }
    .tl-line { flex: 1; width: 2px; background: var(--border); margin-top: 3px; }
    .tl-item:last-child .tl-line { display: none; }
    .tl-item.done .tl-line, .tl-item.current .tl-line { background: var(--primary); }
    .tl-body { flex: 1; padding-bottom: 16px; min-width: 0; }
    .tl-item:last-child .tl-body { padding-bottom: 0; }
    .tl-title { font-size: 13px; color: var(--text-2); line-height: 1.4; }
    .tl-item.current .tl-title { color: var(--text); font-weight: 600; }
    .tl-item.done .tl-title { color: var(--text); }
    .tl-time { font-size: 11px; color: var(--text-3); margin-top: 2px; }

    /* Buttons */
    .btn-confirm { padding: 12px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 600; border-radius: var(--radius-sm); }
    .btn-confirm:active { background: var(--primary-dark); }
    .ok-banner { width: 100%; text-align: center; padding: 13px; background: var(--success-soft); color: var(--success); border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; }

    .svg-icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .svg-icon.sm { width: 18px; height: 18px; }

    .toast {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(.9);
      background: rgba(39,49,58,.92); color: #fff; padding: 12px 20px; border-radius: 10px;
      font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100;
    }
    .toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  .page-body{max-width:none;width:auto;padding:24px}.receipt-workspace{display:grid;grid-template-columns:minmax(460px,42%) minmax(0,1fr);gap:20px;align-items:start}.receipt-view{background:white;padding:24px;border:1px solid var(--border);border-radius:8px;min-height:480px}.receipt-list{overflow:auto}.receipt-list table{width:100%;border-collapse:collapse;background:white}.receipt-list th,.receipt-list td{padding:14px 10px;text-align:left;border-bottom:1px solid var(--border)}.receipt-list tr[data-asn]{cursor:pointer}.receipt-list tr[data-asn]:hover{background:#eef9f9}.receipt-view input{padding:7px;border:1px solid var(--border);border-radius:4px}.receipt-view h2,.receipt-view p{margin:0 0 16px}.rate-row{padding:12px 0}.rate-track{height:9px;background:#eef2f5;border-radius:8px;margin:8px 0}.rate-fill{height:9px;background:#07868d;border-radius:8px}.receipt-view .btn-confirm{background:#07868d;color:white;padding:12px 20px;border-radius:4px;margin-top:16px}@media(max-width:1000px){.receipt-workspace{grid-template-columns:1fr}.page-body{padding:16px}}
</style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <div class="header-logo">BW</div>
      <div>
        <div class="header-title">工厂仓库 · 收货</div>
        <div class="header-sub">博格华纳宁波 · 物流部</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn badge-dot" aria-label="通知">
        <svg class="svg-icon sm" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      </button>
      <button class="icon-btn" aria-label="菜单">
        <svg class="svg-icon sm" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </header>

  <!-- Page Body -->
  <div class="page-body">

    <!-- Welcome -->
    <div class="welcome">
      <div class="welcome-greeting">收货管理台</div>
      <div class="welcome-meta" id="welcomeMeta">
        <span>宁波博格华纳</span>
        <span class="dot"></span>
        <span>工厂仓库</span>
        <span class="dot"></span>
        <strong id="pendingStrong">待收货 0 笔</strong>
      </div>
      <button onclick="document.getElementById('receiptImport').click()" style="margin-top:12px;border:0;border-radius:8px;background:#0f766e;color:#fff;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px">导入收货记录</button>
      <input id="receiptImport" type="file" accept=".csv" hidden>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-num" id="statPending">0</div>
        <div class="stat-label warning">待收货</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statOk">0</div>
        <div class="stat-label">已收货</div>
      </div>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">全部 <span class="t-count" id="cAll">0</span></button>
      <button class="filter-tab" data-filter="pending">待收货 <span class="t-count" id="cPending">0</span></button>
      <button class="filter-tab" data-filter="ok">已收货 <span class="t-count" id="cOk">0</span></button>
    </div>

    <!-- Receipt List -->
    <div class="receipt-workspace"><div class="receipt-list" id="receiptList"></div><section id="receiptView" class="receipt-view"><h2>交付统计</h2><div id="deliveryMetrics"></div><p>选择左侧ASN查看明细并确认收货。</p></section></div>

  </div>

  <!-- Detail Sheet -->
  <div class="sheet-mask" id="sheetMask" onclick="closeDetail()"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <div class="sheet-title">收货详情</div>
      <button class="sheet-close" onclick="closeDetail()" aria-label="关闭">
        <svg class="svg-icon sm" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="detailBody"></div>
    <div class="sheet-foot" id="detailFoot"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SUP_KEY = 'bw_supplier_deliveries';
    const CAR_KEY = 'bw_carrier_pickups';
    const PLAN_KEY = 'material-plan-v5';

    const SEED_SUP = [
      { no:'SHP-20260812-101', supplier:'博世汽车部件（苏州）有限公司',
        items:[{ materialCode:'108143-101', voucher:'2026-08-03-108143', planQty:800, arrivalDate:'2026-08-15', supplierName:'博世汽车部件（苏州）有限公司' }],
        eta:'2026-08-15 09:30', mode:'供应商直送', remark:'', time:'2026-08-12 14:20', status:'shipped' },
      { no:'SHP-20260813-202', supplier:'采埃孚传动系统（上海）有限公司',
        items:[{ materialCode:'110233-301', voucher:'2026-08-06-110233', planQty:1500, arrivalDate:'2026-08-15', supplierName:'采埃孚传动系统（上海）有限公司' }],
        eta:'2026-08-15 14:00', mode:'供应商直送', remark:'', time:'2026-08-13 10:05', status:'shipped' }
    ];
    const SEED_CAR = [
      { no:'PUP-20260812-301', carrier:'中通快递', relSupplier:'联合汽车电子有限公司',
        items:[{ materialCode:'109955-201', voucher:'2026-08-05-109955', planQty:500, arrivalDate:'2026-08-15', supplierName:'联合汽车电子有限公司' }],
        plate:'浙B·8H2K9', driver:'李师傅 139xxxx', trackNo:'ZT202608120033', eta:'2026-08-15 11:00', remark:'', time:'2026-08-12 16:40', status:'shipped' },
      { no:'PUP-20260813-402', carrier:'德邦物流', relSupplier:'博世汽车部件（苏州）有限公司',
        items:[{ materialCode:'41256LMN', voucher:'2026-08-07-41256', planQty:2200, arrivalDate:'2026-08-15', supplierName:'博世汽车部件（苏州）有限公司' }],
        plate:'沪C·5F8L2', driver:'王师傅 137xxxx', trackNo:'DB202608130088', eta:'2026-08-15 15:30', remark:'', time:'2026-08-13 09:30', status:'ok', receivedTime:'2026-08-13 15:20' }
    ];

    let curFilter = 'all';
    let cur = null;

    /* ── Helpers ── */
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmt(n){ return Number(n||0).toLocaleString('en-US'); }
    function shortName(s){ s=String(s||''); return s.length>7 ? s.slice(0,7)+'…' : s; }
    function nowStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
    let toastTimer;
    function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600); }

    function loadSup(){ try{ return JSON.parse(localStorage.getItem(SUP_KEY)||'[]'); }catch(e){ return []; } }
    function loadCar(){ try{ return JSON.parse(localStorage.getItem(CAR_KEY)||'[]'); }catch(e){ return []; } }

    // 收货后按凭证(voucher)回溯更新上游物料计划行的状态
    function markPlanStatus(vouchers, status){
      try {
        const rows = JSON.parse(localStorage.getItem(PLAN_KEY) || '[]');
        if (!Array.isArray(rows) || !rows.length) return;
        const set = new Set(vouchers);
        let changed = false;
        rows.forEach(r => { if (set.has(r.voucher) && r.status !== status) { r.status = status; changed = true; } });
        if (changed) localStorage.setItem(PLAN_KEY, JSON.stringify(rows));
      } catch (e) {}
    }

    function syncPlanReceipt(items){
      try {
        const rows = JSON.parse(localStorage.getItem(PLAN_KEY) || '[]');
        // 收货回写使用 ASN + 物料号精确匹配，避免同一采购凭证下多物料串数。
        const map = new Map(items.map(it => [`${it.asnNo || ''}|${it.materialCode || ''}`, it]));
        rows.forEach(r => {
          const it = map.get(`${r.asnNo || ''}|${r.materialCode || ''}`); if(!it) return;
          r.actualArrivalQty = Number(it.actualQty || 0);
          const expected = Number(r.actualShipQty ?? r.promisedQty ?? r.planQty ?? 0);
          r.status = r.actualArrivalQty >= expected ? 'received' : 'in_transit';
          r.receivedTime = nowStr();
        });
        localStorage.setItem(PLAN_KEY, JSON.stringify(rows));
      } catch(e) {}
    }

    function seedIfEmpty(){
      if(localStorage.getItem(SUP_KEY)===null && localStorage.getItem(CAR_KEY)===null){
        localStorage.setItem(SUP_KEY, JSON.stringify(SEED_SUP));
        localStorage.setItem(CAR_KEY, JSON.stringify(SEED_CAR));
      }
    }

    function statusKey(rec){
      if(rec.status==='ok') return 'ok';
      return 'pending';
    }
    function statusLabel(rec){
      const k=statusKey(rec);
      return k==='ok' ? '已收货' : '待收货';
    }

    function mergeReceipts(){
      const sup = loadSup().map(r=>({ ...r, kind:'supplier' }));
      const car = loadCar().map(r=>({ ...r, kind:'carrier' }));
      return [...sup, ...car].sort((a,b)=> String(b.time||'').localeCompare(String(a.time||'')));
    }

    function saveByKind(kind, rec){
      const key = kind==='supplier' ? SUP_KEY : CAR_KEY;
      const arr = kind==='supplier' ? loadSup() : loadCar();
      const idx = arr.findIndex(r=>r.no===rec.no);
      if(idx>=0){
        const clean = { ...rec }; delete clean.kind;
        arr[idx] = clean;
        localStorage.setItem(key, JSON.stringify(arr));
      }
    }

    /* ── Render ── */
    let receiptDraft={},selectedAsn='';
    function asnReceipts(){
      const groups=new Map(),plans=JSON.parse(localStorage.getItem(PLAN_KEY)||'[]');
      mergeReceipts().forEach(rec=>{const asn=rec.asnNo||rec.no;if(!groups.has(asn))groups.set(asn,{asnNo:asn,records:[],items:[]});const g=groups.get(asn);g.records.push(rec);rec.items.forEach(it=>g.items.push({...it,asnNo:asn}));});
      return [...groups.values()].map(g=>{const linked=plans.filter(p=>p.asnNo===g.asnNo&&p.status!=='cancelled');g.items=g.items.map(it=>{const matches=linked.filter(p=>p.materialCode===it.materialCode);return {...it,expected:matches.length===1?Number(matches[0].actualShipQty??matches[0].promisedQty??matches[0].planQty):Number(it.actualShipQty??it.promisedQty??it.planQty),plan:matches[0]};});g.complete=g.records.every(r=>r.status==='ok')&&(!linked.length||linked.every(p=>p.status==='received'));return g;});
    }
    function metricsHtml(groups){
      const date=v=>{const text=String(v||'').slice(0,10);return /^\d{4}-\d{2}-\d{2}$/.test(text)?Date.parse(text+'T00:00:00Z'):NaN};
      const rates=[['准时发货率','shipDate','shipmentRegDate'],['准时到货率','arrivalDate','receivedTime']];
      return rates.map(([label,planned,actual])=>{const eligible=groups.map(g=>g.items.map(i=>[date(i.plan?.[planned]),date(i.plan?.[actual])])).filter(a=>a.length&&a.every(([p,t])=>Number.isFinite(p)&&Number.isFinite(t)));const ok=eligible.filter(a=>a.every(([p,t])=>Math.abs(t-p)<=86400000)).length;const percent=eligible.length?Math.round(ok/eligible.length*100):null;return '<div class="rate-row">'+label+' <strong>'+(percent===null?'—':percent+'%')+'</strong><div class="rate-track"><div class="rate-fill" style="width:'+(percent||0)+'%"></div></div><small>准时 '+ok+' / 有效ASN '+eligible.length+'；缺少日期 '+(groups.length-eligible.length)+'</small></div>';}).join('')+'<p style="color:#8b95a1;margin-top:16px">计划日期±1天（含边界）。暂按ASN等权、全部明细准时统计；缺少实际日期不计入分母。图表为临时展示，待客户样式。</p>';
    }
    function renderAll(){
      const groups=asnReceipts(),ok=groups.filter(g=>g.complete).length,pending=groups.length-ok;
      [['cAll',groups.length],['cPending',pending],['cOk',ok],['statPending',pending],['statOk',ok]].forEach(([id,v])=>document.getElementById(id).textContent=v);
      document.getElementById('pendingStrong').textContent='待收货 '+pending+' 笔';
      const shown=groups.filter(g=>curFilter==='all'||(curFilter==='ok')===g.complete);
      const wrap=document.getElementById('receiptList');wrap.innerHTML='<table><thead><tr><th>ASN / 供应商</th><th>物料项数</th><th>状态</th></tr></thead><tbody>'+shown.map(g=>'<tr data-asn="'+esc(g.asnNo)+'"><td><strong>'+esc(g.asnNo)+'</strong><br>'+esc(g.records[0].supplier||g.records[0].relSupplier||'—')+'</td><td>'+g.items.length+'</td><td>'+(g.complete?'已收货':'待收货')+'</td></tr>').join('')+'</tbody></table>'+(shown.length?'':'<p class="empty-state">暂无记录</p>');
      wrap.querySelectorAll('[data-asn]').forEach(tr=>tr.onclick=()=>showAsn(tr.dataset.asn));
      if(selectedAsn)showAsn(selectedAsn);else document.getElementById('deliveryMetrics').innerHTML=metricsHtml(groups);
    }
    function showAsn(asn){
      selectedAsn=asn;const g=asnReceipts().find(g=>g.asnNo===asn);if(!g)return;
      const draft=receiptDraft[asn]||{};
      document.getElementById('receiptView').innerHTML='<h2>'+esc(asn)+'</h2>'+metricsHtml(asnReceipts())+'<table class="mat-table"><thead><tr><th>物料</th><th>系统数量</th><th>导入实收</th><th>比对</th></tr></thead><tbody>'+g.items.map(i=>{const q=draft[i.materialCode];return '<tr><td>'+esc(i.materialCode)+'</td><td>'+fmt(i.expected)+'</td><td>'+(q===undefined?(g.complete?fmt(i.actualQty):'未导入'):fmt(q))+'</td><td>'+(q===undefined?'—':q===i.expected?'一致':'不一致')+'</td></tr>';}).join('')+'</tbody></table><p>导入CSV：ASN号、物料编号、实际收货数量。全部物料比对一致后确认。</p><button id="confirmAsnReceipt" class="btn-confirm" '+(g.complete?'disabled':'')+'>'+(g.complete?'已收货':'确认收货')+'</button>';
      document.getElementById('confirmAsnReceipt').onclick=()=>{
        const plans=JSON.parse(localStorage.getItem(PLAN_KEY)||'[]').filter(p=>p.asnNo===asn&&p.status!=='cancelled');
        if(new Set(g.items.map(i=>i.materialCode)).size!==g.items.length||plans.some(p=>!g.items.some(i=>i.materialCode===p.materialCode))||plans.some(p=>plans.filter(x=>x.materialCode===p.materialCode).length>1)){toast('ASN明细存在重复或缺失，无法确认，请核对数据');return;}
        if(!g.items.length||g.items.some(i=>draft[i.materialCode]===undefined||draft[i.materialCode]!==i.expected)){toast('所有物料需先导入且与系统数量一致');return;}
        g.records.forEach(rec=>{rec.items.forEach(it=>{it.actualQty=draft[it.materialCode];it.asnNo=asn;});rec.status='ok';rec.receivedTime=nowStr();saveByKind(rec.kind,rec);syncPlanReceipt(rec.items);});delete receiptDraft[asn];renderAll();toast('ASN全部物料已确认收货');
      };
    }

    function positionTruck(rec){
      const path = document.getElementById('routeMain');
      const truck = document.getElementById('truckMarker');
      if(!path || !truck) return;
      let frac = 0.55;
      if(rec.status==='ok') frac = 1;
      const len = path.getTotalLength();
      const pt = path.getTotalLength ? path.getPointAtLength(len*frac) : { x:46, y:124 };
      const color = rec.status==='ok'?'#10b981':'#14b8a6';
      truck.setAttribute('transform', 'translate(' + pt.x + ',' + pt.y + ')');
      truck.querySelectorAll('circle').forEach(c=>{
        const s = c.getAttribute('stroke');
        if(s && (s.includes('14b8a6') || s.includes('0f766e') || s.includes('10b981'))){
          c.setAttribute('stroke', color);
        }
      });
      // rotate truck slightly along path tangent for natural feel
      if(path.getPointAtLength){
        const delta = 2;
        const pt2 = path.getPointAtLength(Math.min(len, len*frac+delta));
        const angle = Math.atan2(pt2.y-pt.y, pt2.x-pt.x)*180/Math.PI;
        const inner = truck.querySelector('g[transform*="translate"]');
        if(inner) inner.setAttribute('transform', 'translate(-7,-6) rotate('+Math.round(angle)+')');
      }
    }

    function trackingStepsForward(rec){
      const isSup = rec.kind==='supplier';
      const steps = [];
      if(isSup){
        steps.push({ t:'供应商发货', d:rec.time, s:'done' });
        steps.push({ t:'运输中（'+(rec.mode||'供应商直送')+'）', d:'', s: rec.status==='ok'?'done':'current' });
        steps.push({ t:'到达博格华纳·宁波工厂仓库', d:'', s: rec.status==='ok'?'done':'todo' });
        steps.push({ t:'已确认收货', d:rec.receivedTime||'', s: rec.status==='ok'?'current':'todo' });
      } else {
        steps.push({ t:(rec.carrier||'物流商')+' 已揽收', d:rec.time, s:'done' });
        steps.push({ t:'运输中', d:'', s: rec.status==='ok'?'done':'current' });
        steps.push({ t:'派送中（至博格华纳·宁波）', d:'', s: rec.status==='ok'?'done':'todo' });
        steps.push({ t:'已确认收货', d:rec.receivedTime||'', s: rec.status==='ok'?'current':'todo' });
      }
      return steps;
    }

    function trackingHtml(rec){
      const all = trackingStepsForward(rec);
      const occurred = all.filter(s=>s.s!=='todo').slice().reverse();
      const future = all.filter(s=>s.s==='todo');
      const ordered = occurred.concat(future);
      return `<div class="timeline">${ordered.map(st=>`
        <div class="tl-item ${st.s}">
          <div class="tl-rail"><span class="tl-dot ${st.s==='current'?'current':st.s}"></span><span class="tl-line"></span></div>
          <div class="tl-body">
            <div class="tl-title">${esc(st.t)}</div>
            ${st.d?`<div class="tl-time">${esc(st.d)}</div>`:''}
          </div>
        </div>`).join('')}</div>`;
    }

      return `<div class="meta-grid">${items.map(([l,v])=>`<div class="meta-item"><div class="meta-label">${esc(l)}</div><div class="meta-val">${esc(v)}</div></div>`).join('')}</div>`;

    function matTableHtml(rec){
      return `<table class="mat-table">
        <thead><tr><th>物料编号</th><th>供应商</th><th style="text-align:right">计划</th><th>实际到货</th><th>凭证</th></tr></thead>
        <tbody>${rec.items.map((it,i)=>{
          const plan = Number(it.planQty)||0;
          const act = it.actualQty!=null ? it.actualQty : Number(it.actualShipQty ?? it.promisedQty ?? plan);
          const diff = plan - act;
          const diffCls = diff===0 ? 'zero' : 'neg';
          const diffTxt = diff===0 ? '持平' : ('缺 '+fmt(Math.abs(diff)));
          return `<tr>
            <td class="m-code">${esc(it.materialCode)}</td>
            <td class="m-sub">${esc(it.supplierName||rec.supplier||rec.relSupplier||'-')}</td>
            <td class="m-num">${fmt(plan)}</td>
            <td>
              <input class="act-input" id="act_${i}" type="number" min="0" value="${act}">
              <div class="m-diff ${diffCls}">${diffTxt}</div>
            </td>
            <td class="m-sub">${esc(it.voucher)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;
    }

    function openDetail(id){
      cur = findReceipt(id);
      if(!cur) return;
      const sk = statusKey(cur);
      const isSup = cur.kind==='supplier';
      document.getElementById('detailBody').innerHTML = `
        <div class="ds-summary">
          <div>
            <div class="ds-code">${esc(cur.no)}</div>
            <div class="ds-type">${isSup ? '供应商直送 · ' : '物流商取货 · '}${esc(cur.supplier||cur.carrier||'')}</div>
          </div>
          <span class="recent-status ${sk}">${statusLabel(cur)}</span>
        </div>
        ${metaHtml(cur)}
        <div class="block-title">物料明细</div>
        ${matTableHtml(cur)}
        <div class="block-title">物流地图与路线</div>
        ${logisticsMapHtml(cur)}
        <div class="block-title">物流轨迹</div>
        ${trackingHtml(cur)}
      `;
      // footer
      const foot = document.getElementById('detailFoot');
      if(sk==='ok'){
        foot.innerHTML = `<div class="ok-banner">✓ 已于 ${esc(cur.receivedTime||cur.time||'')} 确认收货</div>`;
      } else {
        foot.innerHTML = `
          <button class="btn-confirm" onclick="confirmReceive()">确认收货</button>`;
      }
      document.getElementById('sheetMask').classList.add('show');
      document.getElementById('sheet').classList.add('show');
      positionTruck(cur);
    }
    function closeDetail(){
      document.getElementById('sheetMask').classList.remove('show');
      document.getElementById('sheet').classList.remove('show');
      cur = null;
    }

    function confirmReceive(){
      if(!cur) return;
      cur.items.forEach((it,i)=>{
        const v = document.getElementById('act_'+i).value;
        const act = Number(v)||0;
        it.actualQty = act;
        it.diff = (Number(it.planQty)||0) - act;
      });
      const receiptComplete = cur.items.every(it=>Number(it.actualQty||0)>=Number(it.actualShipQty??it.promisedQty??it.planQty??0));
      cur.status = receiptComplete ? 'ok' : 'shipped';
      cur.receivedTime = nowStr();
      saveByKind(cur.kind, cur);
      syncPlanReceipt(cur.items || []);
      closeDetail();
      toast(receiptComplete ? '已完成收货，计划状态已更新为已收货' : '已记录实收数量，尚未足量，保持待收货');
      renderAll();
    }

    /* ── Filter ── */
    document.getElementById('filterTabs').addEventListener('click', e=>{
      const btn = e.target.closest('.filter-tab');
      if(!btn) return;
      curFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-tab').forEach(t=>t.classList.toggle('active', t===btn));
      renderAll();
    });

    // CSV 字段：ASN号,物料编号,实际收货数量。导入后按 ASN+物料回写，部分收货保持“待收货”。
    document.getElementById('receiptImport').addEventListener('change', e=>{
      const file=e.target.files[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=()=>{
        const lines=String(reader.result||'').replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);
        const headers=(lines.shift()||'').split(',').map(x=>x.trim());
        const ai=headers.findIndex(x=>['ASN号','asnNo','ASN'].includes(x));
        const mi=headers.findIndex(x=>['物料编号','materialCode'].includes(x));
        const qi=headers.findIndex(x=>['实际收货数量','actualArrivalQty','actualQty'].includes(x));
        if(ai<0||mi<0||qi<0){ toast('导入失败：需要 ASN号、物料编号、实际收货数量'); return; }
        const imported=lines.map(line=>{const c=line.split(',');return{asnNo:(c[ai]||'').trim(),materialCode:(c[mi]||'').trim(),qty:c[qi]?.trim()?Number(c[qi]):NaN}});
        const groups=asnReceipts(),keys=new Set();
        for(const item of imported){const key=item.asnNo+'|'+item.materialCode;const g=groups.find(g=>g.asnNo===item.asnNo);if(keys.has(key)||!Number.isFinite(item.qty)||item.qty<0||!g||g.items.filter(i=>i.materialCode===item.materialCode).length!==1){toast('导入失败：存在重复、未知物料或非法数量，未写入数据');e.target.value='';return;}keys.add(key);}
        imported.forEach(it=>{(receiptDraft[it.asnNo]??={})[it.materialCode]=it.qty;});
        selectedAsn=imported[0]?.asnNo||selectedAsn;renderAll();toast('导入比对完成，请核对后点击确认收货');e.target.value='';
      };
      reader.readAsText(file,'utf-8');
    });

    seedIfEmpty();
    renderAll();
  </script>

</body>
</html>
