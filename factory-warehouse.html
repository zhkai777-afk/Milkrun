<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="light">
  <title>博格华纳 · 工厂仓库收货</title>
  <style>
    :root {
      --primary: #07868d;
      --primary-dark: #046b71;
      --primary-soft: #e9f7f7;
      --primary-light: #eef9f9;
      --text: #27313a;
      --text-2: #5e6975;
      --text-3: #8b95a1;
      --surface: #ffffff;
      --canvas: #f4f6f8;
      --muted: #f6f8fa;
      --border: #e5e9ef;
      --border-strong: #d8dee7;
      --danger: #e95d62;
      --danger-soft: #fff0f0;
      --success: #48a66b;
      --success-soft: #eef9f1;
      --warning: #d99026;
      --warning-soft: #fff7e8;
      --shadow-sm: 0 1px 3px rgba(27,39,51,.06);
      --shadow: 0 12px 30px rgba(27,39,51,.08);
      --radius: 12px;
      --radius-sm: 8px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100dvh;
      background: var(--canvas);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding-bottom: calc(var(--safe-bottom) + 20px);
      user-select: none;
    }
    button { font: inherit; cursor: pointer; touch-action: manipulation; border: none; background: none; }
    button:active { transform: scale(.97); }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-top) + 10px) 20px 10px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .header-logo {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      display: grid; place-items: center;
      font-size: 16px; font-weight: 700;
      flex-shrink: 0;
    }
    .header-title { font-size: 16px; font-weight: 600; color: var(--text); }
    .header-sub { font-size: 11px; color: var(--text-3); margin-top: -1px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--muted);
      display: grid; place-items: center;
      color: var(--text-2); transition: background .15s;
    }
    .icon-btn:active { background: var(--border); }
    .badge-dot { position: relative; }
    .badge-dot::after {
      content: '';
      position: absolute; top: 4px; right: 4px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--danger);
      border: 1.5px solid var(--surface);
    }

    /* ── Page Body ── */
    .page-body { padding: 16px 16px 0; max-width: 640px; margin: 0 auto; }
    @media (min-width: 768px) { .page-body { padding: 24px 0 0; } }

    /* ── Welcome ── */
    .welcome { margin-bottom: 18px; }
    .welcome-greeting { font-size: 22px; font-weight: 700; color: var(--text); }
    .welcome-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--text-3); flex-wrap: wrap; }
    .welcome-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border-strong); }
    .welcome-meta strong { color: var(--text-2); font-weight: 500; }

    /* ── Stats Row ── */
    .stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
    @media (min-width: 540px) { .stats-row { gap: 14px; } }
    .stat-item {
      background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
      padding: 14px 12px; text-align: center;
      box-shadow: var(--shadow-sm); transition: box-shadow .2s;
    }
    .stat-num { font-size: 24px; font-weight: 700; color: var(--primary); line-height: 1.2; }
    @media (min-width: 540px) { .stat-num { font-size: 28px; } }
    .stat-label { font-size: 12px; color: var(--text-3); margin-top: 4px; }
    .stat-label.warning { color: var(--warning); }

    /* ── Filter Tabs ── */
    .filter-tabs {
      display:flex;gap:28px;background:transparent;padding:0;
      border-bottom:1px solid var(--border);border-radius:0;margin-bottom:20px;overflow-x:auto;
    }
    .filter-tab {
      flex:0 0 auto;white-space:nowrap;padding:12px 4px;min-height:44px;border-radius:0;
      border-bottom:2px solid transparent;font-size:14px;font-weight:500;color:var(--text-2);
      transition:color .15s,border-color .15s;
    }
    .filter-tab:hover {color:var(--primary)}
    .filter-tab.active {background:transparent;color:var(--primary);box-shadow:none;border-bottom-color:var(--primary);font-weight:600}
    .filter-tab .t-count {display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:10px;background:var(--muted);font-size:12px;color:var(--text-3)}
    .filter-tab.active .t-count {color:var(--primary);background:var(--primary-soft)}

    /* ── Receipt List ── */
    .receipt-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .receipt-card {
      position: relative; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 14px 14px 16px;
      box-shadow: var(--shadow-sm); cursor: pointer;
      transition: border-color .15s, box-shadow .2s; overflow: hidden;
    }
    .receipt-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    }
    .receipt-card.sup::before { background: var(--primary); }
    .receipt-card.car::before { background: var(--warning); }
    .receipt-card:active { box-shadow: var(--shadow); border-color: var(--border-strong); }
    .rc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .rc-kind { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 9px; }
    .rc-kind.sup { background: var(--primary-soft); color: var(--primary); }
    .rc-kind.car { background: var(--warning-soft); color: var(--warning); }
    .rc-code { font-size: 15px; font-weight: 600; color: var(--text); }
    .rc-sub { font-size: 13px; color: var(--text-2); margin-top: 3px; }
    .rc-meta { font-size: 11px; color: var(--text-3); margin-top: 5px; }

    .recent-status { font-size: 12px; padding: 3px 9px; border-radius: 10px; font-weight: 500; flex-shrink: 0; }
    .recent-status.ok       { background: var(--success-soft); color: var(--success); }
    .recent-status.pending  { background: var(--warning-soft); color: var(--warning); }

    .empty-state { padding: 40px 20px; text-align: center; color: var(--text-3); background: var(--surface); border-radius: var(--radius); }

    /* ── Detail Sheet ── */
    .sheet-mask { position: fixed; inset: 0; background: rgba(27,39,51,.4); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .sheet-mask.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
      background: var(--surface); border-radius: 16px 16px 0 0; max-width: 640px; margin: 0 auto;
      transform: translateY(100%); transition: transform .25s ease; max-height: 90dvh;
      display: flex; flex-direction: column; padding-bottom: var(--safe-bottom);
    }
    .sheet.show { transform: translateY(0); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
    .sheet-title { font-size: 17px; font-weight: 700; }
    .sheet-close { width: 32px; height: 32px; border-radius: 50%; background: var(--muted); display: grid; place-items: center; color: var(--text-2); }
    .sheet-body { padding: 16px; overflow-y: auto; }
    .sheet-foot { padding: 12px 16px calc(12px + var(--safe-bottom)); border-top: 1px solid var(--border); display: flex; gap: 12px; }
    .sheet-foot .btn-confirm { flex: 1; }

    /* ── Detail content ── */
    .ds-summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .ds-code { font-size: 17px; font-weight: 700; color: var(--text); }
    .ds-type { font-size: 12px; color: var(--text-3); margin-top: 2px; }

    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-bottom: 18px; }
    .meta-item { min-width: 0; }
    .meta-label { font-size: 11px; color: var(--text-3); }
    .meta-val { font-size: 13px; color: var(--text); font-weight: 500; margin-top: 2px; word-break: break-all; }

    .block-title { font-size: 14px; font-weight: 600; color: var(--text); margin: 18px 0 10px; display: flex; align-items: center; gap: 6px; }
    .block-title::before { content: ''; width: 3px; height: 13px; background: var(--primary); border-radius: 2px; }

    /* Material table */
    .mat-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .mat-table th { text-align: left; font-size: 11px; color: var(--text-3); font-weight: 500; padding: 6px 8px; background: var(--muted); }
    .mat-table th:first-child { border-radius: 6px 0 0 6px; }
    .mat-table th:last-child { border-radius: 0 6px 6px 0; }
    .mat-table td { padding: 8px; border-top: 1px solid var(--border); vertical-align: middle; }
    .mat-table .m-code { font-weight: 600; color: var(--text); }
    .mat-table .m-sub { color: var(--text-2); font-size: 12px; }
    .mat-table .m-num { color: var(--primary); font-weight: 600; text-align: right; }
    .act-input {
      width: 84px; padding: 7px 8px; font-size: 13px; text-align: right;
      background: var(--muted); border: 1px solid var(--border); border-radius: 6px;
      outline: none; font-family: inherit; color: var(--text);
    }
    .act-input:focus { border-color: var(--primary); background: var(--surface); }
    .m-diff { font-size: 11px; margin-top: 2px; }
    .m-diff.neg { color: var(--danger); }
    .m-diff.zero { color: var(--text-3); }

    /* Map + Route */
    .map-wrap {
      position: relative; border-radius: 14px; overflow: hidden;
      border: 1px solid var(--border); background: #eef4f0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.6), 0 8px 24px rgba(17,51,40,.08);
    }
    .map-svg { display: block; width: 100%; height: auto; }
    .map-pin-label { font-size: 9px; fill: var(--text-2); }
    .map-pin-label.strong { fill: var(--text); font-weight: 700; }

    .map-overlay {
      position: absolute; left: 10px; top: 10px; right: 10px; display: flex; gap: 8px; justify-content: space-between; pointer-events: none;
    }
    .map-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,.92); backdrop-filter: blur(6px);
      box-shadow: 0 2px 8px rgba(17,51,40,.1); color: var(--text);
    }
    .map-badge.dot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
    .map-badge.dot.ok::before { background: var(--success); box-shadow: 0 0 0 2px var(--success-soft); }

    .map-legend {
      position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; pointer-events: none;
    }
    .map-legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-3); background: rgba(255,255,255,.9); padding: 4px 8px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .map-legend-dot { width: 7px; height: 7px; border-radius: 50%; }

    @keyframes dashFlow { to { stroke-dashoffset: -36; } }
    @keyframes pinBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes truckPulse {
      0% { transform: scale(1); opacity: .55; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    /* Tracking timeline (Taobao-style) */
    .timeline { margin-top: 4px; padding: 2px 0; }
    .tl-item { display: flex; gap: 12px; align-items: stretch; }
    .tl-rail { display: flex; flex-direction: column; align-items: center; width: 14px; flex-shrink: 0; }
    .tl-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; margin-top: 2px; box-sizing: border-box; }
    .tl-dot.done     { background: var(--primary); }
    .tl-dot.current  { background: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
    .tl-dot.todo     { background: #fff; border: 2px solid var(--border-strong); }
    .tl-line { flex: 1; width: 2px; background: var(--border); margin-top: 3px; }
    .tl-item:last-child .tl-line { display: none; }
    .tl-item.done .tl-line, .tl-item.current .tl-line { background: var(--primary); }
    .tl-body { flex: 1; padding-bottom: 16px; min-width: 0; }
    .tl-item:last-child .tl-body { padding-bottom: 0; }
    .tl-title { font-size: 13px; color: var(--text-2); line-height: 1.4; }
    .tl-item.current .tl-title { color: var(--text); font-weight: 600; }
    .tl-item.done .tl-title { color: var(--text); }
    .tl-time { font-size: 11px; color: var(--text-3); margin-top: 2px; }

    /* Buttons */
    .btn-confirm { padding: 12px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 600; border-radius: var(--radius-sm); }
    .btn-confirm:active { background: var(--primary-dark); }
    .ok-banner { width: 100%; text-align: center; padding: 13px; background: var(--success-soft); color: var(--success); border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; }

    .svg-icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .svg-icon.sm { width: 18px; height: 18px; }

    .toast {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(.9);
      background: rgba(39,49,58,.92); color: #fff; padding: 12px 20px; border-radius: 10px;
      font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100;
    }
    .toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  .page-body{max-width:none;width:auto;padding:24px}.receipt-workspace{display:grid;grid-template-columns:minmax(320px,30%) minmax(0,1fr);gap:20px;align-items:start}.receipt-view{background:white;padding:24px;border:1px solid var(--border);border-radius:8px;min-height:480px}.receipt-list{overflow:auto}.receipt-list table{width:100%;border-collapse:collapse;background:white}.receipt-list th,.receipt-list td{padding:14px 10px;text-align:left;border-bottom:1px solid var(--border)}.receipt-list tr[data-asn]{cursor:pointer}.receipt-list tr[data-asn]:hover{background:#eef9f9}.receipt-view input{padding:7px;border:1px solid var(--border);border-radius:4px}.receipt-view h2,.receipt-view p{margin:0 0 16px}.rate-row{padding:12px 0}.rate-track{height:9px;background:#eef2f5;border-radius:8px;margin:8px 0}.rate-fill{height:9px;background:#07868d;border-radius:8px}.receipt-view .btn-confirm{background:#07868d;color:white;padding:12px 20px;border-radius:4px;margin-top:16px}@media(max-width:1000px){.receipt-workspace{grid-template-columns:1fr}.page-body{padding:16px}}

.receipt-sidebar{min-width:0}.material-filters.asn-filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) auto;align-items:end;gap:8px;margin:0 0 8px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px}.asn-filters label{min-width:0;gap:4px}.asn-filter-actions{display:flex;align-items:center;gap:6px}.asn-filter-actions button{padding:8px;white-space:nowrap}

</style>

<body>

  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <div class="header-logo">BW</div>
      <div>
        <div class="header-title">工厂仓库 · 收货</div>
        <div class="header-sub">博格华纳宁波 · 物流部</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn badge-dot" aria-label="通知">
        <svg class="svg-icon sm" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      </button>
      <button class="icon-btn" aria-label="菜单">
        <svg class="svg-icon sm" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </header>

  <!-- Page Body -->
  <div class="page-body">

    <!-- Welcome -->
    <div class="welcome">
      <div class="page-heading"><div class="welcome-greeting">收货管理台</div><button id="importReceipts" type="button">导入SAP收货明细</button></div>
      <div class="welcome-meta" id="welcomeMeta">
        <span>宁波博格华纳</span>
        <span class="dot"></span>
        <span>工厂仓库</span>
        <span class="dot"></span>
        <strong id="pendingStrong">待收货 0 笔</strong>
      </div>
      <p class="receipt-help">支持一次导入多个 ASN 的SAP收货明细，无需先勾选 ASN。CSV必填：ASN号、物料编号、实际收货数量；同物料多行时须提供采购凭证。</p>
      <input id="receiptImport" type="file" accept=".csv" hidden>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">全部 <span class="t-count" id="cAll">0</span></button>
      <button class="filter-tab" data-filter="pending">待收货 <span class="t-count" id="cPending">0</span></button>
      <button class="filter-tab" data-filter="ok">已收货 <span class="t-count" id="cOk">0</span></button>
    </div>

    <!-- Receipt List -->
    <div class="receipt-workspace"><div class="receipt-sidebar">
      <form id="asnSearch" class="material-filters asn-filters">
        <label>ASN号<input id="asnFilterNo" type="search" placeholder="ASN号" aria-label="左侧ASN号筛选"></label>
        <label>供应商名称<input id="asnFilterSupplier" type="search" placeholder="供应商名称" aria-label="左侧供应商名称筛选"></label>
        <div class="asn-filter-actions"><button type="submit">查询</button><button id="resetAsnFilters" type="button">重置</button></div>
      </form>
      <div class="receipt-list" id="receiptList"></div></div><section id="receiptView" class="receipt-view"><p>请选择左侧 ASN 查看物料。</p></section></div>

  </div>

  <!-- Detail Sheet -->
  <div class="sheet-mask" id="sheetMask" onclick="closeDetail()"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <div class="sheet-title">收货详情</div>
      <button class="sheet-close" onclick="closeDetail()" aria-label="关闭">
        <svg class="svg-icon sm" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="detailBody"></div>
    <div class="sheet-foot" id="detailFoot"></div>
  </div>

  <dialog id="receiptDialog" class="receipt-dialog" aria-labelledby="receiptDialogTitle">
    <form id="receiptDialogForm" novalidate>
      <div class="receipt-dialog-head"><h2 id="receiptDialogTitle">手动收货</h2><button type="button" id="closeReceiptDialog" aria-label="关闭收货弹窗">×</button></div>
      <div class="receipt-dialog-body"><p class="receipt-help">请输入实际收货数量，确认后完成收货；允许与系统数量存在差异。</p><div id="receiptDialogItems"></div><p id="receiptDialogError" class="receipt-field-error" role="alert"></p></div>
      <div class="receipt-dialog-foot"><button type="button" id="cancelReceiptDialog">取消</button><button type="submit" id="confirmReceiptDialog">确认收货</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast"></div>

  <script>
    const SUP_KEY = 'bw_supplier_deliveries';
    const CAR_KEY = 'bw_carrier_pickups';
    const PLAN_KEY = 'material-plan-v8';

    const SEED_SUP = [
      { no:'SHP-20260812-101', supplier:'博世汽车部件（苏州）有限公司',
        items:[{ materialCode:'108143-101', voucher:'2026-08-03-108143', planQty:800, arrivalDate:'2026-08-15', supplierName:'博世汽车部件（苏州）有限公司' }],
        eta:'2026-08-15 09:30', mode:'供应商直送', remark:'', time:'2026-08-12 14:20', status:'shipped' },
      { no:'SHP-20260813-202', supplier:'采埃孚传动系统（上海）有限公司',
        items:[{ materialCode:'110233-301', voucher:'2026-08-06-110233', planQty:1500, arrivalDate:'2026-08-15', supplierName:'采埃孚传动系统（上海）有限公司' }],
        eta:'2026-08-15 14:00', mode:'供应商直送', remark:'', time:'2026-08-13 10:05', status:'shipped' }
    ];
    const SEED_CAR = [
      { no:'PUP-20260812-301', carrier:'中通快递', relSupplier:'联合汽车电子有限公司',
        items:[{ materialCode:'109955-201', voucher:'2026-08-05-109955', planQty:500, arrivalDate:'2026-08-15', supplierName:'联合汽车电子有限公司' }],
        plate:'浙B·8H2K9', driver:'李师傅 139xxxx', trackNo:'ZT202608120033', eta:'2026-08-15 11:00', remark:'', time:'2026-08-12 16:40', status:'shipped' },
      { no:'PUP-20260813-402', carrier:'德邦物流', relSupplier:'博世汽车部件（苏州）有限公司',
        items:[{ materialCode:'41256LMN', voucher:'2026-08-07-41256', planQty:2200, arrivalDate:'2026-08-15', supplierName:'博世汽车部件（苏州）有限公司' }],
        plate:'沪C·5F8L2', driver:'王师傅 137xxxx', trackNo:'DB202608130088', eta:'2026-08-15 15:30', remark:'', time:'2026-08-13 09:30', status:'ok', receivedTime:'2026-08-13 15:20' }
    ];

    let curFilter = 'all';
    let cur = null;

    /* ── Helpers ── */
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmt(n){ return Number(n||0).toLocaleString('en-US'); }
    function shortName(s){ s=String(s||''); return s.length>7 ? s.slice(0,7)+'…' : s; }
    function nowStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
    let toastTimer;
    function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600); }

    function loadSup(){ try{ return JSON.parse(localStorage.getItem(SUP_KEY)||'[]'); }catch(e){ return []; } }
    function loadCar(){ try{ return JSON.parse(localStorage.getItem(CAR_KEY)||'[]'); }catch(e){ return []; } }

    // 收货后按凭证(voucher)回溯更新上游物料计划行的状态
    function markPlanStatus(vouchers, status){
      try {
        const rows = JSON.parse(localStorage.getItem(PLAN_KEY) || '[]');
        if (!Array.isArray(rows) || !rows.length) return;
        const set = new Set(vouchers);
        let changed = false;
        rows.forEach(r => { if (set.has(r.voucher) && r.status !== status) { r.status = status; changed = true; } });
        if (changed) localStorage.setItem(PLAN_KEY, JSON.stringify(rows));
      } catch (e) {}
    }

    function syncPlanReceipt(items){
      try {
        const rows = JSON.parse(localStorage.getItem(PLAN_KEY) || '[]');
        // 收货回写使用 ASN + 物料号精确匹配，避免同一采购凭证下多物料串数。
        const map = new Map(items.map(it => [`${it.asnNo || ''}|${it.materialCode || ''}`, it]));
        rows.forEach(r => {
          const it = map.get(`${r.asnNo || ''}|${r.materialCode || ''}`); if(!it) return;
          r.actualArrivalQty = Number(it.actualQty || 0);
          const expected = Number(r.actualShipQty ?? r.promisedQty ?? r.planQty ?? 0);
          r.status = r.actualArrivalQty >= expected ? 'received' : 'in_transit';
          r.receivedTime = nowStr();
        });
        localStorage.setItem(PLAN_KEY, JSON.stringify(rows));
      } catch(e) {}
    }

    function seedIfEmpty(){
      if(localStorage.getItem(SUP_KEY)===null && localStorage.getItem(CAR_KEY)===null){
        localStorage.setItem(SUP_KEY, JSON.stringify(SEED_SUP));
        localStorage.setItem(CAR_KEY, JSON.stringify(SEED_CAR));
      }
    }

    function statusKey(rec){
      if(rec.status==='ok') return 'ok';
      return 'pending';
    }
    function statusLabel(rec){
      const k=statusKey(rec);
      return k==='ok' ? '已收货' : '待收货';
    }

    function mergeReceipts(){
      const sup = loadSup().map(r=>({ ...r, kind:'supplier' }));
      const car = loadCar().map(r=>({ ...r, kind:'carrier' }));
      return [...sup, ...car].sort((a,b)=> String(b.time||'').localeCompare(String(a.time||'')));
    }

    function saveByKind(kind, rec){
      const key = kind==='supplier' ? SUP_KEY : CAR_KEY;
      const arr = kind==='supplier' ? loadSup() : loadCar();
      const idx = arr.findIndex(r=>r.no===rec.no);
      if(idx>=0){
        const clean = { ...rec }; delete clean.kind;
        arr[idx] = clean;
        localStorage.setItem(key, JSON.stringify(arr));
      }
    }

    /* ── Render ── */
    let receiptDraft={},selectedAsn=''; // 旧详情兼容变量；首页使用多选集合
    const selectedAsns=new Set();
    const selectedMaterials=new Set(),quantityDrafts=new Map();
    let asnFilters={asnNo:'',supplierName:''};
    function visibleAsnGroups(groups){
      const includes=(value,query)=>String(value||'').toLowerCase().includes(query.trim().toLowerCase());
      return groups.filter(g=>(curFilter==='all'||(curFilter==='ok')===g.complete)&&includes(g.asnNo,asnFilters.asnNo)&&g.records.some(r=>includes(r.supplier||r.relSupplier||'',asnFilters.supplierName)));
    }
    let materialFilters={materialCode:'',voucher:''};
    function materialKey(i){return JSON.stringify([i.kind,i.recordNo,i.itemIndex]);}
    function filteredMaterials(groups){return groups.filter(g=>selectedAsns.has(g.asnNo)).flatMap(g=>g.items).filter(i=>Object.entries(materialFilters).every(([key,value])=>String(i[key]||'').toLowerCase().includes(value.trim().toLowerCase())));}
    function saveReceiptStores(sup,car,plans){
      const keys=[SUP_KEY,CAR_KEY,PLAN_KEY],values=[sup,car,plans],before=keys.map(k=>localStorage.getItem(k));
      try{keys.forEach((k,i)=>localStorage.setItem(k,JSON.stringify(values[i])));}catch(e){keys.forEach((k,i)=>{try{before[i]===null?localStorage.removeItem(k):localStorage.setItem(k,before[i]);}catch(ignore){}});throw new Error('保存失败，请重试；本次未确认成功');}
    }
    function finishReceiptRecords(sup,car,plans,time){
      [...sup,...car].forEach(rec=>{const linked=plans.filter(p=>p.asnNo===(rec.asnNo||rec.no)&&p.status!=='cancelled');if(rec.items.length&&rec.items.every(i=>i.receiptStatus==='received'||rec.status==='ok')&&linked.every(p=>p.status==='received')){rec.status='ok';rec.receivedTime=rec.receivedTime||time;}});
    }
    function manualReceive(keys){
      const items=filteredMaterials(asnReceipts()).filter(i=>keys.includes(materialKey(i)));
      if(!items.length)throw new Error('请先勾选当前列表物料');
      const changes=items.map(i=>{const value=quantityDrafts.has(materialKey(i))?quantityDrafts.get(materialKey(i)):i.actualQty;
        if(value==null||String(value).trim()===''||!Number.isFinite(Number(value))||Number(value)<0)throw new Error(i.asnNo+' / '+i.materialCode+'：请输入非负的实际收货数量');
        if(i.ambiguous)throw new Error(i.asnNo+' / '+i.materialCode+'：关联计划不唯一，不能收货');
        return {item:i,qty:Number(value)};});
      const sup=loadSup(),car=loadCar(),plans=readPlans(),time=nowStr();
      changes.forEach(({item:i,qty})=>{const rec=(i.kind==='supplier'?sup:car).find(r=>r.no===i.recordNo),target=rec.items[i.itemIndex];
        target.actualQty=qty;target.receiptStatus='received';target.receivedTime=time;target.receiptSource='manual';
        plans.filter(p=>p.asnNo===i.asnNo&&p.status!=='cancelled'&&identityMatch(i,p)).forEach(p=>{p.actualArrivalQty=qty;p.status='received';p.receivedTime=time;});});
      finishReceiptRecords(sup,car,plans,time);saveReceiptStores(sup,car,plans);
      items.forEach(i=>{quantityDrafts.delete(materialKey(i));selectedMaterials.delete(materialKey(i));});
      return items.length;
    }
    let lastImport=[],importBusy=false;
    function readPlans(){const rows=JSON.parse(localStorage.getItem(PLAN_KEY)||'[]');if(!Array.isArray(rows))throw new Error('计划数据格式错误');return rows;}
    function identityMatch(a,b){return a.materialCode===b.materialCode&&(!a.voucher||a.voucher===b.voucher);}
    function asnReceipts(){
      const groups=new Map(),plans=readPlans();
      mergeReceipts().forEach(rec=>{const asn=rec.asnNo||rec.no;if(!groups.has(asn))groups.set(asn,{asnNo:asn,records:[],items:[]});const g=groups.get(asn);g.records.push(rec);rec.items.forEach((it,index)=>g.items.push({...it,asnNo:asn,recordNo:rec.no,kind:rec.kind,itemIndex:index,recordComplete:rec.status==='ok'}));});
      return [...groups.values()].map(g=>{const linked=plans.filter(p=>p.asnNo===g.asnNo&&p.status!=='cancelled');g.items=g.items.map(it=>{const matches=linked.filter(p=>identityMatch(it,p)),plan=matches.length===1?matches[0]:null;return {...it,expected:Number(plan?.actualShipQty??plan?.promisedQty??plan?.planQty??it.actualShipQty??it.promisedQty??it.planQty),plan,ambiguous:matches.length>1,complete:it.receiptStatus==='received'||(it.recordComplete&&(!plan||plan.status==='received')),actualQty:it.actualQty??plan?.actualArrivalQty};});g.complete=g.items.length>0&&g.items.every(i=>i.complete)&&linked.every(p=>p.status==='received');return g;});
    }
    function renderAll(){
      const groups=asnReceipts(),ok=groups.filter(g=>g.complete).length,pending=groups.length-ok;
      [['cAll',groups.length],['cPending',pending],['cOk',ok]].forEach(([id,v])=>document.getElementById(id).textContent=v);
      document.getElementById('pendingStrong').textContent='待收货 '+pending+' 笔';
      const shown=visibleAsnGroups(groups),visible=new Set(shown.map(g=>g.asnNo));
      [...selectedAsns].forEach(asn=>{if(!visible.has(asn))selectedAsns.delete(asn);});
      const wrap=document.getElementById('receiptList');wrap.innerHTML='<table><thead><tr><th><input id="selectAllAsns" type="checkbox" aria-label="选择当前列表全部ASN"></th><th>ASN / 供应商</th><th>收货进度</th><th>状态</th></tr></thead><tbody>'+shown.map(g=>'<tr tabindex="0" data-asn="'+esc(g.asnNo)+'" class="'+(selectedAsns.has(g.asnNo)?'selected':'')+'"><td><input type="checkbox" aria-label="选择 '+esc(g.asnNo)+'" '+(selectedAsns.has(g.asnNo)?'checked':'')+'></td><td><strong>'+esc(g.asnNo)+'</strong><br>'+esc(g.records[0].supplier||g.records[0].relSupplier||'—')+'</td><td>'+g.items.filter(i=>i.complete).length+'/'+g.items.length+'项</td><td><span class="receipt-tag '+(g.complete?'done':'')+'">'+(g.complete?'已收货':'待收货')+'</span></td></tr>').join('')+'</tbody></table>'+(shown.length?'':'<p class="empty-state">无匹配ASN，请调整筛选条件。</p>');
      wrap.querySelectorAll('[data-asn]').forEach(tr=>{tr.onclick=e=>{if(e.target.type==='checkbox'){e.target.checked?selectedAsns.add(tr.dataset.asn):selectedAsns.delete(tr.dataset.asn);}else{selectedAsns.clear();selectedAsns.add(tr.dataset.asn);}renderAll();};tr.onkeydown=e=>{if(e.target!==tr)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();tr.click();}};});
      const all=document.getElementById('selectAllAsns');all.checked=shown.length>0&&shown.every(g=>selectedAsns.has(g.asnNo));all.indeterminate=selectedAsns.size>0&&!all.checked;all.disabled=!shown.length;all.onchange=()=>{shown.forEach(g=>all.checked?selectedAsns.add(g.asnNo):selectedAsns.delete(g.asnNo));renderAll();};
      const importButton=document.getElementById('importReceipts');importButton.disabled=importBusy;importButton.textContent=importBusy?'导入处理中…':'导入SAP收货明细';
      showMaterials(groups);
    }
    function promisedQuantity(item){
      const value=item.plan?.promisedQty??item.promisedQty;
      return value==null||String(value).trim()===''||!Number.isFinite(Number(value))?null:Number(value);
    }
    function showMaterials(groups){
      const chosen=groups.filter(g=>selectedAsns.has(g.asnNo)),total=chosen.flatMap(g=>g.items),items=filteredMaterials(groups),visible=new Set(items.map(materialKey));
      [...selectedMaterials].forEach(k=>{if(!visible.has(k))selectedMaterials.delete(k);});
      const qty=v=>v==null||String(v).trim()===''||!Number.isFinite(Number(v))?'—':fmt(v);
      document.getElementById('receiptView').innerHTML=`
        <h2>物料列表</h2><p>已选择 ${chosen.length} 个 ASN，共 ${total.length} 条物料；筛选结果 ${items.length} 条</p>
        <form id="materialSearch" class="material-filters">${[['materialCode','物料编号'],['voucher','采购凭证']].map(([key,label])=>`<label>${label}<input name="${key}" aria-label="${label}筛选" type="search" placeholder="请输入${label}" value="${esc(materialFilters[key])}"></label>`).join('')}<button type="submit">查询</button><button type="button" id="resetMaterialFilters">重置</button></form>
        <div class="receipt-toolbar"><span>已勾选 ${selectedMaterials.size} 条物料</span><button type="button" id="batchReceive" ${!selectedMaterials.size||importBusy?'disabled':''}>批量收货</button></div>
        <p class="receipt-help">通过“手动收货”或“调整实收”弹窗填写实际收货数量并确认，允许数量差异；批量收货仅处理当前筛选结果中勾选的物料。SAP导入按全量ASN匹配，数量一致后自动完成收货。</p>
        ${!items.length?`<p class="empty-state">${total.length?'无匹配物料，请调整筛选条件。':'请选择左侧 ASN 查看物料。'}</p>`:`<div class="material-scroll"><table><thead><tr><th><input id="selectAllMaterials" type="checkbox" aria-label="选择当前筛选全部物料"></th><th>物料编号 / 描述</th><th>采购凭证</th><th>计划发货数量</th><th>供应商承诺数量</th><th>实际收货数量</th><th>SAP导入数量</th><th>匹配结果</th><th>收货状态</th><th class="receipt-operation">操作</th></tr></thead><tbody>${items.map((i,index)=>{
          const key=materialKey(i);
          return `<tr><td><input type="checkbox" data-material-index="${index}" aria-label="选择物料 ${esc(i.asnNo)} ${esc(i.materialCode)} ${esc(i.voucher||'')}" ${selectedMaterials.has(key)?'checked':''}></td><td>${esc(i.materialCode)}<br>${esc(i.plan?.materialDesc||i.plan?.materialName||i.materialDesc||'—')}</td><td>${esc(i.voucher||'—')}</td><td>${qty(i.plan?.planQty??i.planQty)}</td><td>${qty(promisedQuantity(i))}</td><td>${qty(i.actualQty)}</td><td>${qty(i.sapImportedQty)}</td><td>${esc(i.receiptSource==='manual'?'人工确认':lastImport.findLast(r=>r.asnNo===i.asnNo&&r.materialCode===i.materialCode&&(!r.voucher||r.voucher===i.voucher))?.reason||(i.complete?'已核对':'未导入'))}</td><td><span class="receipt-tag ${i.complete?'done':''}">${i.complete?'已收货':'待收货'}</span></td><td class="receipt-operation"><button type="button" class="manual-receive" data-receive-index="${index}" ${importBusy?'disabled':''}>${i.complete?'调整实收':'手动收货'}</button></td></tr>`;
        }).join('')}</tbody></table></div>`}
        ${lastImport.length?'<h3>最近导入结果：成功 '+lastImport.filter(r=>r.result==='成功').length+'，跳过 '+lastImport.filter(r=>r.result==='跳过').length+'，失败 '+lastImport.filter(r=>r.result==='失败').length+'</h3><div class="import-results"><table><thead><tr><th>文件行</th><th>ASN / 物料</th><th>结果</th><th>原因</th></tr></thead><tbody>'+lastImport.map(r=>'<tr><td>'+r.line+'</td><td>'+esc(r.asnNo)+' / '+esc(r.materialCode)+'</td><td>'+r.result+'</td><td>'+esc(r.reason)+'</td></tr>').join('')+'</tbody></table></div>':''}`;
      const view=document.getElementById('receiptView');
      document.getElementById('materialSearch').onsubmit=e=>{e.preventDefault();view.querySelectorAll('[name]').forEach(input=>materialFilters[input.name]=input.value);showMaterials(asnReceipts());};
      document.getElementById('resetMaterialFilters').onclick=()=>{materialFilters={materialCode:'',voucher:''};showMaterials(asnReceipts());};
      document.getElementById('batchReceive').onclick=()=>openReceiptDialog([...selectedMaterials]);
      view.querySelectorAll('[data-receive-index]').forEach(button=>{button.onclick=()=>openReceiptDialog([materialKey(items[Number(button.dataset.receiveIndex)])]);});
      view.querySelectorAll('[data-material-index]').forEach(input=>{input.onchange=()=>{const key=materialKey(items[Number(input.dataset.materialIndex)]);input.checked?selectedMaterials.add(key):selectedMaterials.delete(key);showMaterials(asnReceipts());};});
      const all=document.getElementById('selectAllMaterials');
      if(items.length){all.checked=selectedMaterials.size===items.length;all.indeterminate=selectedMaterials.size>0&&!all.checked;all.onchange=()=>{items.forEach(i=>all.checked?selectedMaterials.add(materialKey(i)):selectedMaterials.delete(materialKey(i)));showMaterials(asnReceipts());};}
    }

    let receiptDialogKeys=[],receiptDialogBusy=false;
    function openReceiptDialog(keys){
      if(importBusy||receiptDialogBusy)return;
      const items=filteredMaterials(asnReceipts()).filter(i=>keys.includes(materialKey(i)));
      if(!items.length){toast('请先勾选当前列表物料');return;}
      receiptDialogKeys=items.map(materialKey);
      receiptDialogKeys.forEach(k=>quantityDrafts.delete(k));
      const title=items.length>1?'批量收货':items[0].complete?'调整实收':'手动收货';
      document.getElementById('receiptDialogTitle').textContent=title;
      document.getElementById('confirmReceiptDialog').textContent=items.length===1&&items[0].complete?'确认调整':'确认收货';
      document.getElementById('receiptDialogError').textContent='';
      const displayQty=value=>value==null||String(value).trim()===''||!Number.isFinite(Number(value))?'—':fmt(value);

    function positionTruck(rec){
      const path = document.getElementById('routeMain');
      const truck = document.getElementById('truckMarker');
      if(!path || !truck) return;
      let frac = 0.55;
      if(rec.status==='ok') frac = 1;
      const len = path.getTotalLength();
      const pt = path.getTotalLength ? path.getPointAtLength(len*frac) : { x:46, y:124 };
      const color = rec.status==='ok'?'#10b981':'#14b8a6';
      truck.setAttribute('transform', 'translate(' + pt.x + ',' + pt.y + ')');
      truck.querySelectorAll('circle').forEach(c=>{
        const s = c.getAttribute('stroke');
        if(s && (s.includes('14b8a6') || s.includes('0f766e') || s.includes('10b981'))){
          c.setAttribute('stroke', color);
        }
      });
      // rotate truck slightly along path tangent for natural feel
      if(path.getPointAtLength){
        const delta = 2;
        const pt2 = path.getPointAtLength(Math.min(len, len*frac+delta));
        const angle = Math.atan2(pt2.y-pt.y, pt2.x-pt.x)*180/Math.PI;
        const inner = truck.querySelector('g[transform*="translate"]');
        if(inner) inner.setAttribute('transform', 'translate(-7,-6) rotate('+Math.round(angle)+')');
      }
    }

    function trackingStepsForward(rec){
      const isSup = rec.kind==='supplier';
      const steps = [];
      if(isSup){
        steps.push({ t:'供应商发货', d:rec.time, s:'done' });
        steps.push({ t:'运输中（'+(rec.mode||'供应商直送')+'）', d:'', s: rec.status==='ok'?'done':'current' });
        steps.push({ t:'到达博格华纳·宁波工厂仓库', d:'', s: rec.status==='ok'?'done':'todo' });
        steps.push({ t:'已确认收货', d:rec.receivedTime||'', s: rec.status==='ok'?'current':'todo' });
      } else {
        steps.push({ t:(rec.carrier||'物流商')+' 已揽收', d:rec.time, s:'done' });
        steps.push({ t:'运输中', d:'', s: rec.status==='ok'?'done':'current' });
        steps.push({ t:'派送中（至博格华纳·宁波）', d:'', s: rec.status==='ok'?'done':'todo' });
        steps.push({ t:'已确认收货', d:rec.receivedTime||'', s: rec.status==='ok'?'current':'todo' });
      }
      return steps;
    }

    function trackingHtml(rec){
      const all = trackingStepsForward(rec);
      const occurred = all.filter(s=>s.s!=='todo').slice().reverse();
      const future = all.filter(s=>s.s==='todo');
      const ordered = occurred.concat(future);
      return `<div class="timeline">${ordered.map(st=>`
        <div class="tl-item ${st.s}">
          <div class="tl-rail"><span class="tl-dot ${st.s==='current'?'current':st.s}"></span><span class="tl-line"></span></div>
          <div class="tl-body">
            <div class="tl-title">${esc(st.t)}</div>
            ${st.d?`<div class="tl-time">${esc(st.d)}</div>`:''}
          </div>
        </div>`).join('')}</div>`;
    }

    function parseReceiptCsv(text){
      const rows=[];let row=[],cell='',quoted=false;
      text=String(text).replace(/^\uFEFF/,'');
      for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell.trim());cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell.trim());rows.push(row);row=[];cell='';}else cell+=c;}
      if(quoted)throw new Error('CSV引号未闭合');if(cell||row.length){row.push(cell.trim());rows.push(row);}return rows;
    }
    function importReceiptText(text){
      const csv=parseReceiptCsv(text),headers=csv.shift()||[],col=names=>headers.findIndex(h=>names.includes(h));
      const ai=col(['ASN号','asnNo','ASN']),mi=col(['物料编号','materialCode']),qi=col(['实际收货数量','actualArrivalQty','actualQty']),vi=col(['采购凭证','voucher']);
      if(ai<0||mi<0||qi<0)throw new Error('需要 ASN号、物料编号、实际收货数量');
      const rows=csv.map((c,index)=>({line:index+2,asnNo:c[ai]||'',materialCode:c[mi]||'',voucher:vi<0?'':c[vi]||'',qty:c[qi]?Number(c[qi]):NaN})).filter((r,index)=>csv[index].some(Boolean));
      if(!rows.length)throw new Error('文件没有收货明细');
      const groups=asnReceipts(),plans=readPlans(),sup=loadSup(),car=loadCar(),time=nowStr();
      const counts=new Map();rows.forEach(r=>{const k=JSON.stringify([r.asnNo,r.materialCode,r.voucher]);counts.set(k,(counts.get(k)||0)+1);});
      const claimed=new Set();let sapChanged=false;
      const results=rows.map(r=>{
        const fail=reason=>({...r,result:'失败',reason});
        if(!r.asnNo||!r.materialCode)return fail('ASN号和物料编号必填');
        if(!Number.isFinite(r.qty)||r.qty<0)return fail('实收数量必须为非负数字');
        if(counts.get(JSON.stringify([r.asnNo,r.materialCode,r.voucher]))>1)return fail('文件存在重复明细');
        const g=groups.find(g=>g.asnNo===r.asnNo);if(!g)return fail('系统不存在该ASN');
        const candidates=g.items.filter(i=>i.materialCode===r.materialCode&&(!r.voucher||i.voucher===r.voucher));
        if(candidates.length!==1)return fail(candidates.length?'物料无法唯一匹配，请提供采购凭证':'ASN下不存在对应物料/采购凭证');
        const item=candidates[0],key=JSON.stringify([item.kind,item.recordNo,item.itemIndex]);
        if(claimed.has(key))return fail('文件多行指向同一系统明细');claimed.add(key);
        if(item.ambiguous)return fail('共享计划存在重复明细，无法唯一回写');
        const record=(item.kind==='supplier'?sup:car).find(x=>x.no===item.recordNo),target=record.items[item.itemIndex];
        target.sapImportedQty=r.qty;sapChanged=true;
        if(item.complete)return r.qty===Number(item.actualQty)?{...r,result:'跳过',reason:'已收货且数量相同'}:fail('已收货数量冲突，不覆盖');
        if(!Number.isFinite(item.expected)||r.qty!==item.expected)return fail('数量不一致，系统数量 '+item.expected);
        target.receiptSource='sap';
        target.actualQty=r.qty;target.receiptStatus='received';target.receivedTime=time;
        const matched=plans.filter(p=>p.asnNo===r.asnNo&&p.status!=='cancelled'&&identityMatch(item,p));
        matched.forEach(p=>{p.actualArrivalQty=r.qty;p.status='received';p.receivedTime=time;});
        return {...r,result:'成功',reason:'匹配一致，已收货'};
      });
      if(sapChanged){finishReceiptRecords(sup,car,plans,time);saveReceiptStores(sup,car,plans);}
      lastImport=results;return results;
    }
    document.getElementById('importReceipts').onclick=()=>{if(!importBusy)document.getElementById('receiptImport').click();};
    document.getElementById('receiptImport').addEventListener('change',e=>{
      const file=e.target.files[0];if(!file||importBusy)return;importBusy=true;renderAll();
      const reader=new FileReader();reader.onload=()=>{try{const results=importReceiptText(reader.result);toast('导入完成：成功 '+results.filter(r=>r.result==='成功').length+'，失败 '+results.filter(r=>r.result==='失败').length);}catch(error){toast('导入失败：'+error.message);}finally{importBusy=false;e.target.value='';renderAll();}};reader.onerror=()=>{toast('读取文件失败，请重试');importBusy=false;e.target.value='';renderAll();};reader.readAsText(file,'utf-8');
    });

    seedIfEmpty();
    renderAll();
  </script>
