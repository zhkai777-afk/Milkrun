<main class="page"><div class="heading"><div><h1>物料计划导入</h1><p>先检查文件，再核对变化，最后查看每条计划的导入结果。</p></div><button class="btn" id="rulesBtn">导入规则说明</button></div>

<script>

 const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>v===null?'空白':typeof v==='number'?v.toLocaleString('zh-CN'):String(v),wait=ms=>new Promise(r=>setTimeout(r,ms));
 let state={step:1,rows:[],filter:'all',search:'',page:1,file:'',busy:false,result:null,demo:'',time:''},lastFocus=null,toastTimer;

 const base=[

 ];
 function samples(clean){return base.map((r,i)=>{const [code,po,date,old,value,kind,reason,next,status,asn,row,cell]=r;const x={id:i,code,po,date,old,value,kind,reason,next,status,asn,row,cell,sheet:'DeliveryPlan',ship:date};if(i===0||i===1){x.status='待供应商确认';x.reason=i===0?'尚未完成供应商确认，可以更新数量。':'数量已清空，取消这一天的未确认计划。';x.next=i===0?'更新后仍等待供应商确认，ASN承诺数量保持原值。':'';}if(i===9){x.kind=clean?'same':'error';x.value=clean?x.old:x.value;x.reason=clean?'与已确认计划相同，无需重复处理。':'供应商已确认这条计划，不能通过导入修改数量。';x.next=clean?'保留原计划与确认结果。':'请保留原数量4,000，或将该日期移出本次文件。';}if(clean&&kind==='error'){if(i===5){x.kind='same';x.value=x.old;x.reason='已发货计划内容未变化，无需重复处理。';x.next='原计划及实际发货记录保留。';}else{x.kind='new';x.old=null;x.value=i===4?3000:2000;x.reason='文件已修正，可以新增。';x.next='导入后等待SAP ASN数据。';x.status='无原计划';x.asn='';}}return x;}).filter((r,i)=>!clean||i!==7);}

 function renderRows(){const a=filtered(),pages=Math.max(1,Math.ceil(a.length/10));state.page=Math.min(state.page,pages);$('rows').innerHTML=a.slice((state.page-1)*10,state.page*10).map(r=>{const [c,l]=label(r);return `<tr><td class="loc">${esc(r.sheet)}<br>第${r.row}行 · ${esc(r.cell)}<small>${esc(r.date)}列</small></td><td class="code">${esc(r.code)}<small>${esc(r.po)}</small></td><td>到货：${esc(r.date)}<small>发货：${esc(r.ship)}</small></td><td class="amount">${r.old===null?'无原计划':num(r.old)} → <strong>${esc(num(r.value))}</strong></td><td><span class="tag ${c}">${l}</span><small>原状态：${esc(r.status)}<br>${esc(r.asn||'未关联ASN')}</small></td><td class="reason">${state.step===3&&state.result==='fail'&&r.kind!=='same'?'保存失败，原计划未改变。':esc(r.reason)}</td></tr>`;}).join('')||'<tr><td colspan="6"><div class="empty">没有符合条件的计划，请调整筛选或重置。</div></td></tr>';$('pagination').innerHTML=`<span>共 ${a.length} 条 · 每页10条</span><button class="btn" data-page="-1" ${state.page===1?'disabled':''}>上一页</button><span style="margin:0">${state.page} / ${pages}</span><button class="btn" data-page="1" ${state.page===pages?'disabled':''}>下一页</button>`;}

 async function readFile(file){if(!file||state.busy)return;if(!/\.xlsx$/i.test(file.name)){start();render('请上传.xlsx格式的Excel文件。');return;}if(file.size>20*1024*1024){start();render('文件超过20 MB，请缩小文件后重新选择。');return;}if(!window.XLSX){start();render('Excel读取工具暂未加载，请检查网络后刷新页面重试，或使用上方演示场景。');return;}state.busy=true;$('footer').hidden=true;$('content').innerHTML='<section class="card busy" role="status"><div class="spinner"></div><h2>正在读取并检查文件</h2></section>';try{const w=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const rows=[];let found=false;for(const name of w.SheetNames){const s=w.Sheets[name],a=XLSX.utils.sheet_to_json(s,{header:1,defval:null});const h=a.findIndex(r=>String(r[0]||'').trim()==='P/N'&&String(r[2]||'').includes('Schedule Agreement'));if(h<0)continue;found=true;const ar=a[h+1]||[],sr=a[h+2]||[],cols=ar.map((v,c)=>({c,date:date(v),ship:date(sr[c])})).filter(x=>x.c>=9&&x.date);if(!cols.length)throw Error('没有找到到货日期列，请检查客户模板中的Arrive date日期行。');for(let ri=h+3;ri<a.length;ri++){const r=a[ri];if(!r[0])continue;for(const d of cols){const v=r[d.c];if(v===null||v==='')continue;const valid=typeof v==='number'&&Number.isFinite(v)&&v>0;rows.push({id:rows.length,code:String(r[0]),po:String(r[2]??''),date:d.date,ship:d.ship,old:null,value:v,kind:valid&&r[2]&&d.ship?'new':'error',reason:!r[2]?'采购凭证为空，无法确定对应计划。':!d.ship?'对应的计划发货日期为空。':!valid?'数量应为大于0的数字，请核对。':'新计划，可以导入。',next:valid&&r[2]&&d.ship?'本独立页面未连接原计划，按新增示例检查。':'请修正该位置，再重新上传。',status:'未连接现有计划',asn:'',row:ri+1,cell:XLSX.utils.encode_cell({r:ri,c:d.c}),sheet:name,reconfirm:false});}}}if(!found)throw Error('未找到客户模板的P/N、Schedule Agreement表头，请使用客户交货计划文件。');if(!rows.length)throw Error('文件内没有可检查的数量。独立页面未连接原计划，不能由空白推断取消。');const seen=new Map();for(const r of rows){const key=JSON.stringify([r.code,r.po,r.date]);if(seen.has(key)){const old=seen.get(key);r.kind='error';old.kind='error';r.reason=old.reason='同一物料、采购凭证和到货日期重复出现，请核对。';r.next=old.next='请核对重复行，并保留正确的一条。';}else seen.set(key,r);}state.rows=rows;st
