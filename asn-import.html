 function uploadView(error=''){return `<section class="card upload"><div class="drop" id="drop"><div class="upload-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></svg></div><h2>上传SAP ASN数据文件</h2><p>将Excel文件拖到这里，或选择本地文件</p><div class="template-actions"><button class="btn primary" data-action="pick">选择文件</button><a class="btn" href="outputs/import-simple-20261014/asn-template/ASN导入模板.xlsx" download="ASN导入模板.xlsx">下载模板</a></div><small style="display:block;margin-top:12px">支持 .xlsx，文件大小不超过20 MB</small></div>${error?`<div class="notice error" role="alert" style="margin-top:16px"><span class="symbol">!</span><div><strong>文件未读取</strong><p>${esc(error)}</p></div></div>`:''}<div class="hint"><span class="symbol">ⓘ</span><div>需要填写：物料编号、采购凭证、计划到货日期、ASN号、承诺发货数量。<br>本独立页面与样例计划比对；正式SAP文件列名待核对。<br><small>此独立预览仅在当前页面演示检查和提交，不保存到现有业务数据。</small></div></div></section>`;}
 function render(error=''){step();$('footer').hidden=state.step===1||state.busy;if(state.step===1){$('content').innerHTML=uploadView(error);wireDrop();return;}const t=totals(),isResult=state.step===3,fail=state.result==='fail';
 const file=`<section class="card file"><div class="file-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H5v18h14V8zM14 3v5h5M8 12h8M8 16h8"/></svg></div><div><div class="file-name">${esc(state.file)}</div><div class="file-info">上传时间 ${esc(state.time)}　·　操作人 计划员（演示）　·　${state.demo?'演示文件':'本地文件'}</div></div><div class="template-actions file-actions"><a class="btn" href="outputs/import-simple-20261014/asn-template/ASN导入模板.xlsx" download="ASN导入模板.xlsx">下载模板</a>${!isResult?'<button class="btn" data-action="pick">重新选择文件</button>':''}</div></section>`;
 const notice=isResult?`<section class="card result-head"><div class="result-icon">${fail?'!':'✓'}</div><h2>${fail?'本次导入未完成':'导入完成'}</h2><p>${fail?'本次保存失败，所有待处理ASN均未保存，请重试。':'本次ASN检查和演示导入已完成。'}</p><small>独立演示，不修改现有物料计划或SAP数据。</small></section>`:'';
 const stats=isResult?[[t.total,'本次检查','按ASN物料明细统计'],[fail?0:t.new+t.update,'成功处理',fail?'尚未保存任何ASN':`首次关联${t.new} · 更新${t.update}（含换号${t.rebind}）`],[fail?t.new+t.update:0,'未导入',fail?'保存失败，可重试':'全部待处理数据已完成'],[t.same,'无变化跳过','原关联与确认结果保留']]:[[t.total,'本次检查','每个ASN物料明细算1条'],[t.new+t.update,'可以导入',`首次关联${t.new} · 更新${t.update}（含换号${t.rebind}）`],[t.error,'异常','修正后才能整批导入'],[t.same,'无变化','相同ASN与数量直接跳过']];
 $('content').innerHTML=file+notice+(isResult?`<div class="stats" style="${'grid-template-columns:repeat(4,1fr)'}">${stats.map(([n,l,s])=>`<div class="stat ${l==='异常'||(fail&&l==='未导入')?'err':''}"><span>${l}</span><b>${n}</b><small>${s}</small></div>`).join('')}</div>`: '')+`<section class="card"><div class="table-head"><h2>${isResult?'导入结果明细':'检查明细'}</h2><button class="btn" data-action="download">${isResult?'下载导入结果':'下载问题清单'}</button></div><div class="tabs" id="tabs">${tabs(t,isResult)}</div><div class="filter"><label for="search">查找计划</label><input type="search" id="search" placeholder="输入ASN号、物料编号或采购凭证" value="${esc(state.search)}"><button class="btn" data-action="resetFilter">重置</button></div><div class="table-scroll"><table><thead><tr><th>文件位置</th><th>物料编号 / 采购凭证</th><th>ASN号</th><th>计划到货日期</th><th>承诺数量变化</th><th>${isResult?'导入结果':'检查结果'}</th><th>原因</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagination" id="pagination"></div></section>`;
 $('footNote').textContent=isResult?(fail?'所有待处理记录均未保存，可重试本次导入。':'本次处理完成，可以继续上传下一份文件。'):t.error?`${t.error}条数据异常，修正前不能导入。`:`将处理${t.new+t.update}条计划，跳过${t.same}条无变化记录。`;
 $('backBtn').textContent=isResult?'继续上传文件':'重新上传';$('submitBtn').textContent=isResult?(fail?'重试导入':'继续上传文件'):'确认导入';$('submitBtn').hidden=isResult&&!fail;$('submitBtn').hidden=isResult&&!fail;$('submitBtn').disabled=!isResult&&(t.error>0||t.new+t.update===0);renderRows(); }
 function tabs(t,result){const list=result?[['all','全部',t.total],['failed','未导入',state.result==='fail'?t.new+t.update:0],['same','跳过',t.same]]:[['all','全部',t.total],['error','异常',t.error]];return list.map(([k,l,n])=>`<button class="tab ${state.filter===k?'active':''}" data-filter="${k}">${l} <span>${n}</span></button>`).join('');}
 function filtered(){return state.rows.filter(r=>(state.filter==='all'||state.filter==='failed'&&state.result==='fail'&&r.kind!=='same'||r.kind===state.filter)&&(!state.search||(r.asn+' '+r.code+' '+r.po).toLowerCase().includes(state.search.toLowerCase())));}
 function label(r){if(state.step===3)return r.kind==='same'?['same','无变化跳过']:state.result==='fail'?['error','未导入']:['success',r.kind==='update'?(r.rebind?'ASN关联更新成功':'更新成功'):'关联成功'];if(r.kind==='update'&&r.rebind)return['update','更新ASN关联'];return[r.kind,{new:'首次关联',update:'更新承诺',same:'无变化',error:'异常'}[r.kind]];}
 function renderRows(){const a=filtered(),pages=Math.max(1,Math.ceil(a.length/10));state.page=Math.min(state.page,pages);$('rows').innerHTML=a.slice((state.page-1)*10,state.page*10).map(r=>{const [c,l]=label(r),diff=typeof r.value==='number'&&r.plan!==null?r.value-r.plan:null;return `<tr><td class="loc">${esc(r.sheet)}<br>第${r.row}行 · ${esc(r.cell)}</td><td class="code">${esc(r.code)}<small>${esc(r.po)}</small></td><td>${r.rebind&&r.kind==='update'?`<strong>${esc(r.originalAsn)} → ${esc(r.asn)}</strong>`:esc(r.asn||'未填写')}<small>原ASN：${esc(r.originalAsn||'未关联')}</small></td><td>${esc(r.date||'未填写')}</td><td class="amount">${r.old===null?'未导入':num(r.old)} → <strong>${esc(num(r.value))}</strong></td><td><span class="tag ${c}">${l}</span><small>原状态：${esc(r.status)}</small>${state.step===3&&state.result==='success'&&r.reconfirm?'<small>导入后：待供应商确认</small>':''}</td><td class="reason">${state.step===3&&state.result==='success'&&r.kind==='update'&&r.rebind?'物料计划关联ASN已更新：'+esc(r.originalAsn)+' → '+esc(r.asn)+'。':state.step===3&&state.result==='fail'&&r.kind!=='same'?'保存失败，原ASN数据未改变。':esc(r.reason)}</td></tr>`;}).join('')||'<tr><td colspan="7"><div class="empty">没有符合条件的数据，请重置或调整筛选。</div></td></tr>';$('pagination').innerHTML=`<span>共 ${a.length} 条 · 每页10条</span><button class="btn" data-page="-1" ${state.page===1?'disabled':''}>上一页</button><span style="margin:0">${state.page} / ${pages}</span><button class="btn" data-page="1" ${state.page===pages?'disabled':''}>下一页</button>`;}
 function openLayer(html,center=false){lastFocus=document.activeElement;$('layer').innerHTML=`<div class="overlay ${center?'dialog-center':''}">${html}</div>`;$('layer').hidden=false;document.body.style.overflow='hidden';$('layer').querySelector('button')?.focus();}
 function closeLayer(){if(state.busy)return;$('layer').hidden=true;document.body.style.overflow='';lastFocus?.focus();}

 function confirm(){const t=totals();if(t.error||state.busy)return;openLayer(`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="modal-head"><h2 id="confirmTitle">核对本次ASN导入</h2><button class="close" data-action="close" aria-label="关闭">×</button></div><div class="modal-body"><p>本次将首次关联 <b>${t.new}</b> 条、更新 <b>${t.update}</b> 条（含换号 <b>${t.rebind}</b> 条），跳过 <b>${t.same}</b> 条。</p><div class="notice"><div><strong>本样例不启用ASN覆盖计划</strong><p>普通人工确认路径只关联ASN或更新承诺；供应商自动覆盖配置沿用既有规则，本样例不启用。数量差异将在现有确认流程处理；0表示承诺0，不表示取消计划。</p></div></div>${state.rows.some(r=>r.reconfirm)?`<div class="notice warning"><div><strong>已确认计划调整后需重新确认</strong>${state.rows.filter(r=>r.reconfirm).map(r=>`<p>${esc(r.code)} · ${esc(r.po)} · ${esc(r.date)}<br>ASN：${esc(r.originalAsn)} → ${esc(r.asn)}；承诺：${num(r.old)} → ${num(r.value)}<br>导入后进入待供应商确认。</p>`).join('')}</div></div>`:''}${t.rebind?`<div class="notice warning"><div><strong>确认后将更新以下物料计划关联的ASN号</strong>${state.rows.filter(r=>r.kind==='update'&&r.rebind).map(r=>`<p>${esc(r.code)} · ${esc(r.po)} · ${esc(r.date)}<br><b>${esc(r.originalAsn)} → ${esc(r.asn)}</b><br>承诺数量：${num(r.old)} → ${num(r.value)}</p>`).join('')}<label class="confirm-line"><input type="checkbox" id="ackRebind"><span>我确认用以上新ASN号替换这些物料计划的原ASN关联。</span></label></div></div>`:''}<label class="confirm-line"><input type="checkbox" id="ack"><span>我已核对ASN号、对应计划和承诺数量，确认本次导入；调整的已确认计划需重新确认。</span></label></div><div class="modal-foot"><button class="btn" data-action="close">返回核对</button><button class="btn primary" id="finalSubmit" disabled data-action="save">确认并导入</button></div></section>`,true);}
 async function save(retry=false){if(state.busy||totals().error)return;if(totals().rebind&&!retry&&!$('ackRebind')?.checked)return;if(totals().rebind&&retry&&!state.rebindAcknowledged)return;if(!retry&&!$('ack')?.checked)return;if(!retry)state.rebindAcknowledged=totals().rebind===0||$('ackRebind')?.checked;closeLayer();state.busy=true;$('footer').hidden=true;$('content').innerHTML='<section class="card busy" role="status"><div class="spinner"></div><h2>正在提交本次导入</h2><p class="muted">请稍候，完成后会显示每条计划的结果。</p></section>';await wait(750);state.busy=false;state.step=3;state.result=state.demo==='fail'&&!retry?'fail':'success';state.filter='all';state.page=1;render();toast(state.result==='fail'?'保存失败，所有待处理计划均未保存。':'演示导入已完成');}
 async function demo(){if(state.busy)return;state.demo=$('demoType').value;state.file=state.demo==='error'?'SAP ASN · 有异常示例.xlsx':'SAP ASN · 已修正示例.xlsx';state.time=new Date().toLocaleString('zh-CN',{hour12:false});state.busy=true;$('footer').hidden=true;$('content').innerHTML='<section class="card busy" role="status"><div class="spinner"></div><h2>正在检查ASN数据</h2><p class="muted">核对日期、数量和系统原有计划。</p></section>';await wait(600);if(state.demo==='unreadable'){state.busy=false;start();render('读取失败：缺少必要列：物料编号、采购凭证、计划到货日期、ASN号、承诺发货数量。');return;}state.rows=samples(state.demo!=='error');state.busy=false;state.step=2;state.result=null;state.filter='all';state.search='';state.page=1;render();}
 function date(v){if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;if(typeof v==='number'&&window.XLSX){const d=XLSX.SSF.parse_date_code(v);return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:'';}if(v){const d=new Date(String(v));if(!isNaN(d))return date(d);}return '';}
 async function readFile(file){if(!file||state.busy)return;if(!/\.xlsx$/i.test(file.name)){start();render('请上传.xlsx格式的Excel文件。');return;}if(file.size>20*1024*1024){start();render('文件超过20 MB，请缩小后重新上传。');return;}if(!window.XLSX){start();render('Excel读取工具暂未加载，请检查网络后刷新，或使用上方演示。');return;}state.busy=true;try{const w=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true}),items=[];const fields={code:['物料编号','materialCode','P/N'],po:['采购凭证','voucher','Schedule Agreement'],date:['计划到货日期','到货日期','arrivalDate'],asn:['ASN号','ASN','asnNo'],value:['承诺发货数量','ASN数量','asnQty']};let found=false;for(const name of w.SheetNames){const a=XLSX.utils.sheet_to_json(w.Sheets[name],{header:1,defval:null});const h=a.findIndex(row=>Object.values(fields).every(aliases=>row.some(x=>aliases.includes(String(x??'').trim()))));if(h<0)continue;found=true;const cols=Object.fromEntries(Object.entries(fields).map(([k,aliases])=>[k,a[h].findIndex(x=>aliases.includes(String(x??'').trim()))]));for(let i=h+1;i<a.length;i++){const row=a[i];if(row.every(v=>v===null||v===''))continue;items.push({code:String(row[cols.code]??'').trim(),po:String(row[cols.po]??'').trim(),date:date(row[cols.date]),asn:String(row[cols.asn]??'').trim(),value:row[cols.value],sheet:name,row:i+1,cell:XLSX.utils.encode_cell({r:i,c:cols.value})});}}if(!found)throw Error('缺少必要列：物料编号、采购凭证、计划到货日期、ASN号、承诺发货数量。');if(!items.length)throw Error('文件没有可检查的ASN明细。');state.rows=classify(items);state.file=file.name;state.time=new Date().toLocaleString('zh-CN',{hour12:false});state.demo='';state.result=null;state.filter='all';state.search='';state.page=1;state.step=2;state.busy=false;render();toast('文件读取完成，当前仅与独立样例计划比对。');}catch(e){state.busy=false;start();render('读取失败：'+e.message);}}
 function wireDrop(){const el=$('drop');el?.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag');});el?.addEventListener('dragleave',()=>el.classList.remove('drag'));el?.addEventListener('drop',e=>{e.preventDefault();readFile(e.dataTransfer.files[0]);});}
 function download(){const a=state.step===3?state.rows:state.rows.filter(r=>r.kind==='error');if(!a.length){toast('当前没有需要下载的问题数据。');return;}const rows=[['工作表','行号','单元格','原ASN号','ASN号','物料编号','采购凭证','到货日期','计划数量','原承诺','文件承诺','结果','原因','处理建议'],...a.map(r=>[r.sheet,r.row,r.cell,r.originalAsn,r.asn,r.code,r.po,r.date,r.plan??'',r.old===null?'未导入承诺':r.old,num(r.value),label(r)[1],state.step===3&&state.result==='fail'&&r.kind!=='same'?'保存失败，原计划未改变':r.reason,r.next])];const quote=v=>'"'+String(v??'').replace(/^[=+@\-]/,"'").replaceAll('"','""')+'"';const blob=new Blob(['\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),aEl=document.createElement('a');aEl.href=url;aEl.download=state.step===3?'SAP ASN导入结果.csv':'ASN导入问题清单.csv';aEl.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 document.addEventListener('click',e=>{if(state.busy)return;const f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;state.page=1;render();return;}const p=e.target.closest('[data-page]');if(p){state.page+=Number(p.dataset.page);renderRows();return;}const a=e.target.closest('[data-action]')?.dataset.action;if(a==='pick')$('fileInput').click();if(a==='close')closeLayer();if(a==='download')download();if(a==='save')save();if(a==='resetFilter'){state.search='';state.filter='all';state.page=1;render();}});
 document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value.trim();state.page=1;renderRows();}});document.addEventListener('change',e=>{if(['ack','ackRebind'].includes(e.target.id))$('finalSubmit').disabled=!$('ack')?.checked||(totals().rebind>0&&!$('ackRebind')?.checked);});
 $('fileInput').addEventListener('change',e=>readFile(e.target.files[0]));$('loadDemo').onclick=demo;$('backBtn').onclick=()=>{if(!state.busy)start();};$('submitBtn').onclick=()=>{if(state.step===2)confirm();else if(state.result==='fail')save(true);else start();};
 $('rulesBtn').onclick=()=>openLayer('<section class="modal" role="dialog" aria-modal="true" aria-labelledby="rulesTitle"><div class="modal-head"><h2 id="rulesTitle">ASN导入规则</h2><button class="close" data-action="close" aria-label="关闭">×</button></div><div class="modal-body"><p>1. 先按物料、采购凭证和到货日期找到对应计划，再关联ASN。</p><p>2. 一条计划同一时刻只关联一个ASN；供应商尚未确认或已确认但尚未预约、未发货时，换号不报异常，但必须核对原号和新号并明确确认。</p><p>3. ASN号和数量相同直接跳过；供应商尚未确认可更新，确认后不能修改。</p><p>4. 承诺数量可以是0，但不能为空、负数或文字。0不取消计划。</p><p>5. 数量不一致属于正常差异，不是导入异常。有异常整批暂不导入。</p></div><div class="modal-foot"><button class="btn" data-action="close">知道了</button></div></section>',true);
 $('layer').addEventListener('click',e=>{if(e.target.classList.contains('overlay'))closeLayer();});document.addEventListener('keydown',e=>{if($('layer').hidden)return;if(e.key==='Escape')closeLayer();if(e.key==='Tab'){const a=[...$('layer').querySelectorAll('button:not(:disabled),input')],first=a[0],last=a.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});render();
