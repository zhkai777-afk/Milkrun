<body>
  <main class="page">
    <h1 class="title">供应商管理</h1>
    <section class="filter" aria-label="供应商筛选">
      <div class="field">SAP供应商编号 <input id="filterCode" placeholder="请输入SAP供应商编号"></div>
      <div class="field">供应商名称 <input id="filterName" placeholder="请输入供应商名称"></div>
      <div class="field">供应商等级 <select id="filterGrade"><option value="">请选择供应商等级</option><option>一级</option><option>二级</option><option>三级</option></select></div>
      <div class="field">启用状态 <select id="filterStatus"><option value="">请选择启用状态</option><option value="true">启用</option><option value="false">停用</option></select></div>
      <button class="btn primary" id="searchBtn">查询</button><button class="btn" id="resetBtn">重置</button>
    </section>
    <div class="toolbar"><button class="btn primary" id="newBtn">新增供应商</button><button class="btn enable" data-batch="enable">批量启用</button><button class="btn disable" data-batch="disable">批量禁用</button><button class="btn delete" data-batch="delete">批量删除</button></div>
    <section class="table-wrap"><table class="grid"><thead><tr><th class="check"><input type="checkbox" id="checkAll" aria-label="全选"></th><th class="code">SAP供应商编号</th><th class="name">供应商名称</th><th class="type">供应商类型</th><th class="grade">供应商等级</th><th class="contact">联系人</th><th class="phone">联系电话</th><th class="address">地址</th><th class="planner">供应商计划员</th><th class="inspector">供应商质量检查员</th><th class="shipment">ASN承诺数量覆盖计划</th><th class="delivery">默认配送方式</th><th class="carrier">指定物流商</th><th class="time">添加时间</th><th class="status">启用状态</th><th class="actions">操作</th></tr></thead><tbody id="supplierRows"></tbody></table></section>
    <div class="pagination"><span>共 <b id="totalCount">0</b> 条</span><select><option>10条/页</option></select><span class="page-arrow">‹</span><span class="page-num">1</span><span class="page-arrow">›</span><span>前往</span><input value="1" aria-label="页码"><span>页</span></div>
  </main>
  <div class="modal-mask" id="modalMask"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="closeModal" aria-label="关闭">×</button><h2 id="modalTitle">新增供应商</h2><p style="color:#697582;margin-bottom:16px">开启数量覆盖后，导入ASN直接采用承诺数量并跳过人工确认。配送配置同步至尚未预约的业务ASN。</p><form id="supplierForm"><div class="form-layout"><div>
    <div class="form-row"><label class="required">SAP供应商编号</label><input name="code" required placeholder="请输入SAP供应商编号"></div>
    <div class="form-row"><label class="required">供应商名称</label><input name="name" required placeholder="请输入供应商名称"></div>
    <div class="form-row"><label class="required">供应商等级</label><select name="grade" required><option value="">请选择供应商等级</option><option>一级</option><option>二级</option><option>三级</option></select></div>
    <div class="form-row"><label class="required">默认配送方式</label><select name="deliveryMode" id="deliveryMode" required><option value="">请选择默认配送方式</option><option value="直送">直送</option><option value="自提">自提</option></select></div>
    <div class="form-row delivery-carrier" id="carrierRow"><label id="carrierLabel">指定物流商</label><select name="carrier" id="carrier"><option value="">请选择指定物流商</option><option>中通快递</option><option>顺丰物流</option><option>德邦物流</option></select></div>
    <div class="form-row"><label>联系人</label><input name="contact" placeholder="请输入联系人"></div>
    <div class="form-row"><label>联系电话</label><input name="phone" placeholder="请输入联系电话"></div>
    <div class="form-row"><label>地址</label><textarea name="address" placeholder="请输入地址"></textarea></div>
    <div class="form-row"><label>供应商计划员</label><div class="person-picker-field"><input id="plannerDisplay" readonly placeholder="从组织架构选择，支持多选" aria-label="已选供应商计划员"><input type="hidden" name="planner"><button class="btn" type="button" data-person-picker="planner">选择</button></div></div>
    <div class="form-row"><label>供应商质量检查员</label><div class="person-picker-field"><input id="inspectorDisplay" readonly placeholder="从组织架构选择，支持多选" aria-label="已选供应商质量检查员"><input type="hidden" name="inspector"><button class="btn" type="button" data-person-picker="inspector">选择</button></div></div>
    <div class="form-row"><label class="required">ASN承诺数量覆盖计划</label><div class="radio-group"><label class="radio"><input type="radio" name="supplierShipmentBased" value="true" checked required><span>是</span></label><label class="radio"><input type="radio" name="supplierShipmentBased" value="false"><span>否</span></label></div></div>
    <div class="form-row"><label class="required">状态</label><div class="radio-group"><label class="radio"><input type="radio" name="enabled" value="true" checked><span>启用</span></label><label class="radio"><input type="radio" name="enabled" value="false"><span>停用</span></label></div></div>
  </div><div><div class="upload-label">头像</div><div class="uploader"><div class="upload-icon">♟</div><div class="upload-text">请上传头像</div></div></div></div><footer class="modal-footer"><button type="button" class="btn" id="cancelBtn">取消</button><button type="submit" class="btn primary">确认</button></footer></form></section></div>
  <div class="modal-mask person-mask" id="personMask"><section class="modal person-modal" role="dialog" aria-modal="true" aria-labelledby="personPickerTitle">
    <header class="person-titlebar"><div><h2 id="personPickerTitle">选择供应商计划员</h2><p>从组织架构中选择人员，支持部门和人员多选</p></div><button class="modal-close" id="closePersonPicker" type="button" aria-label="关闭人员选择">&times;</button></header>
    <div class="person-transfer">
      <section class="person-pane" aria-labelledby="availablePeopleTitle"><div class="person-pane-head"><span class="person-pane-title" id="availablePeopleTitle">可选部门及人员 <span class="person-count" id="availablePeopleCount">0</span></span><span class="person-head-actions"><button class="person-text-action" id="expandPeople" type="button">全部展开</button><button class="person-text-action" id="collapsePeople" type="button">全部收起</button></span></div><div class="person-search"><input id="availablePeopleSearch" placeholder="搜索部门、姓名、岗位或邮箱" aria-label="搜索可选人员"></div><div class="person-tree" id="availablePeopleTree"></div></section>
      <div class="person-actions" aria-label="人员移动操作"><button class="btn primary" id="addCheckedPeople" type="button" aria-label="添加勾选人员">&rsaquo;</button><button class="btn" id="addMatchedPeople" type="button" aria-label="添加当前搜索结果">&raquo;</button><button class="btn" id="removeCheckedPeople" type="button" aria-label="移除勾选人员">&lsaquo;</button><button class="btn" id="removeAllPeople" type="button" aria-label="移除全部已选人员">&laquo;</button></div>
      <section class="person-pane selected" aria-labelledby="selectedPeopleTitle"><div class="person-pane-head"><span class="person-pane-title" id="selectedPeopleTitle">已选人员 <span class="person-count" id="selectedPeopleCount">0</span></span><button class="person-text-action danger" id="clearPeople" type="button">清空</button></div><div class="person-search"><input id="selectedPeopleSearch" placeholder="搜索已选人员" aria-label="搜索已选人员"></div><div class="person-selected-groups" id="selectedPeopleGroups"></div></section>
    </div>
    <footer class="person-transfer-foot"><span class="person-summary" id="personSelectionSummary">已选 0 个部门、0 名人员</span><div class="person-footer-actions"><button class="btn" id="cancelPersonPicker" type="button">取消</button><button class="btn primary" id="confirmPersonPicker" type="button">确认选择</button></div></footer>
  </section></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

    let personPickerField=null,personWorking=new Set(),personAvailableChecked=new Set(),personSelectedChecked=new Set(),personExpanded=new Set(['供应链管理部','质量管理部']),personAvailableQuery='',personSelectedQuery='';
    const splitPeople=value=>String(value||'').split(/[,，、;；]/).map(item=>item.trim()).filter(Boolean);

    function personDepartments(){return [...new Set(personDirectory.map(person=>person.department))]}
    function renderPersonPicker(){

      $('availablePeopleTree').innerHTML=departments.map(department=>{const all=personDirectory.filter(person=>person.department===department),matched=all.filter(person=>personMatches(person,personAvailableQuery));if(searching&&!matched.length)return'';const shown=searching?matched:all,expanded=searching||personExpanded.has(department),available=shown.filter(person=>!personWorking.has(person.id));return `<section class="person-group"><div class="person-group-head"><button class="person-caret" type="button" data-person-toggle="${esc(department)}" aria-label="${expanded?'收起':'展开'}${esc(department)}">${expanded?'⌄':'›'}</button><input class="person-group-check" type="checkbox" data-person-group="${esc(department)}" aria-label="选择${esc(department)}全部可选人员" ${available.length?'':'disabled'}><span>${esc(department)}</span><span class="person-ratio">${all.filter(person=>personWorking.has(person.id)).length}/${all.length}</span></div><div class="person-members" ${expanded?'':'hidden'}>${shown.map(person=>`<label class="person-member"><input class="person-member-check" type="checkbox" data-person-id="${esc(person.id)}" ${personWorking.has(person.id)||personAvailableChecked.has(person.id)?'checked':''} ${personWorking.has(person.id)?'disabled':''}><span class="person-avatar">${esc(person.initials)}</span><span class="person-info"><strong>${esc(person.name)}</strong><span class="person-meta">${esc(person.role)} · ${esc(person.email)}</span></span>${personWorking.has(person.id)?'<span class="person-selected-label">已选</span>':'<span></span>'}</label>`).join('')}</div></section>`}).join('')||'<div class="person-empty"><div><strong>无匹配人员</strong><br><span>请调整搜索关键词</span></div></div>';

      $('selectedPeopleGroups').innerHTML=departments.map(department=>{const members=personDirectory.filter(person=>person.department===department&&personWorking.has(person.id)&&personMatches(person,personSelectedQuery));if(!members.length)return'';return `<section class="person-selected-group"><div class="person-selected-group-head"><span>${esc(department)}</span><span>${members.length}人</span></div>${members.map(person=>`<div class="person-selected-member"><input class="person-selected-check" type="checkbox" data-selected-person="${esc(person.id)}" aria-label="选择移除${esc(person.name)}" ${personSelectedChecked.has(person.id)?'checked':''}><span class="person-avatar">${esc(person.initials)}</span><span class="person-info"><strong>${esc(person.name)}</strong><span class="person-meta">${esc(person.role)} · ${esc(person.email)}</span></span><button class="person-remove" type="button" data-remove-person="${esc(person.id)}" aria-label="移除${esc(person.name)}">&times;</button></div>`).join('')}</section>`}).join('')||'<div class="person-empty"><div><strong>尚未选择人员</strong><br><span>从左侧勾选后添加</span></div></div>';
      const selected=personDirectory.filter(person=>personWorking.has(person.id));$('availablePeopleCount').textContent=personDirectory.length;$('selectedPeopleCount').textContent=selected.length;$('personSelectionSummary').textContent=`已选 ${new Set(selected.map(person=>person.department)).size} 个部门、${selected.length} 名人员`;
    }
    function openPersonPicker(field){personPickerField=field;const names=splitPeople($('supplierForm').elements[field].value);ensureLegacyPeople(names);personWorking=new Set(personDirectory.filter(person=>names.includes(person.name)).map(person=>person.id));personAvailableChecked.clear();personSelectedChecked.clear();personAvailableQuery='';personSelectedQuery='';$('availablePeopleSearch').value='';$('selectedPeopleSearch').value='';$('personPickerTitle').textContent=field==='planner'?'选择供应商计划员':'选择供应商质量检查员';renderPersonPicker();$('personMask').classList.add('show');$('availablePeopleSearch').focus()}
    function closePersonPicker(){$('personMask').classList.remove('show');personPickerField=null}
    function addPeople(ids){ids.forEach(id=>personWorking.add(id));ids.forEach(id=>personAvailableChecked.delete(id));renderPersonPicker()}
    function removePeople(ids){ids.forEach(id=>personWorking.delete(id));ids.forEach(id=>personSelectedChecked.delete(id));renderPersonPicker()}
    function filtered(){return suppliers.filter(s=>(!filters.code||s.code.toLowerCase().includes(filters.code.toLowerCase()))&&(!filters.name||s.name.toLowerCase().includes(filters.name.toLowerCase()))&&(!filters.grade||s.grade===filters.grade)&&(!filters.status||String(s.enabled)===filters.status))}
    function save(){localStorage.setItem('bw-suppliers',JSON.stringify(suppliers)); if(window.LogisticsFlow)LogisticsFlow.saveRows(LogisticsFlow.loadRows())} function render(){const list=filtered();$('totalCount').textContent=list.length;$('supplierRows').innerHTML=list.map(s=>`<tr><td class="check"><input type="checkbox" data-id="${s.id}" aria-label="选择 ${esc(s.name)}"></td><td>${esc(s.code)}</td><td class="cell-ellipsis" title="${esc(s.name)}">${esc(s.name)}</td><td>${esc(s.type)}</td><td>${esc(s.grade)}</td><td>${esc(s.contact)}</td><td>${esc(s.phone)}</td><td class="cell-ellipsis" title="${esc(s.address)}">${esc(s.address)}</td><td>${esc(s.planner)}</td><td>${esc(s.inspector)}</td><td>${s.supplierShipmentBased?'是':'否'}</td><td>${esc(s.deliveryMode)}</td><td>${esc(s.carrier)||'--'}</td><td>${esc(s.time)}</td><td class="status"><button class="switch ${s.enabled?'on':''}" data-toggle="${s.id}" aria-pressed="${s.enabled}" aria-label="${s.enabled?'已启用，点击停用':'已停用，点击启用'}" title="${s.enabled?'已启用，点击停用':'已停用，点击启用'}"><span class="switch-text on">启用</span><span class="switch-text off">停用</span></button></td><td><button class="action" data-edit="${s.id}">编辑</button><button class="action danger" data-delete="${s.id}">删除</button></td></tr>`).join('')||'<tr><td colspan="16" style="text-align:center;color:#8b95a1;height:100px">暂无符合条件的数据</td></tr>';$('checkAll').checked=false}
    function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),2200)} function selected(){return [...document.querySelectorAll('#supplierRows input[type=checkbox]:checked')].map(e=>+e.dataset.id)}
    function syncCarrier(){const selfPickup=$('deliveryMode').value==='自提';$('carrier').required=selfPickup;$('carrierLabel').classList.toggle('required',selfPickup)} function openModal(id){editingId=id||null;const s=suppliers.find(x=>x.id===id);$('modalTitle').textContent=s?'编辑供应商':'新增供应商';$('supplierForm').reset();if(s){for(const [key,value] of Object.entries(s)){const el=$('supplierForm').elements[key];if(el){if(key==='enabled'||key==='supplierShipmentBased')$('supplierForm').elements[key].value=String(value);else el.value=value==='--'?'':value}}}syncPersonDisplays();syncCarrier();$('modalMask').classList.add('show');$('supplierForm').elements.code.focus()}
    function closeModal(){$('modalMask').classList.remove('show');editingId=null}
    $('newBtn').onclick=()=>openModal();$('closeModal').onclick=closeModal;$('cancelBtn').onclick=closeModal;$('modalMask').onclick=e=>{if(e.target===$('modalMask'))closeModal()};$('deliveryMode').onchange=syncCarrier;$('searchBtn').onclick=()=>{filters={code:$('filterCode').value.trim(),name:$('filterName').value.trim(),grade:$('filterGrade').value,status:$('filterStatus').value};render()};$('resetBtn').onclick=()=>{document.querySelector('.filter').querySelectorAll('input,select').forEach(x=>x.value='');filters={};render()};$('checkAll').onchange=e=>document.querySelectorAll('#supplierRows input[type=checkbox]').forEach(x=>x.checked=e.target.checked);
    document.querySelectorAll('[data-person-picker]').forEach(button=>button.onclick=()=>openPersonPicker(button.dataset.personPicker));
    $('closePersonPicker').onclick=closePersonPicker;$('cancelPersonPicker').onclick=closePersonPicker;$('personMask').onclick=e=>{if(e.target===$('personMask'))closePersonPicker()};
    $('availablePeopleSearch').oninput=e=>{personAvailableQuery=e.target.value;renderPersonPicker()};$('selectedPeopleSearch').oninput=e=>{personSelectedQuery=e.target.value;renderPersonPicker()};
    $('expandPeople').onclick=()=>{personDepartments().forEach(department=>personExpanded.add(department));renderPersonPicker()};$('collapsePeople').onclick=()=>{personExpanded.clear();renderPersonPicker()};
    $('availablePeopleTree').onclick=e=>{const toggle=e.target.closest('[data-person-toggle]');if(!toggle)return;const department=toggle.dataset.personToggle;personExpanded.has(department)?personExpanded.delete(department):personExpanded.add(department);renderPersonPicker()};
    $('availablePeopleTree').onchange=e=>{const person=e.target.closest('[data-person-id]'),group=e.target.closest('[data-person-group]');if(person){person.checked?personAvailableChecked.add(person.dataset.personId):personAvailableChecked.delete(person.dataset.personId)}if(group){personDirectory.filter(item=>item.department===group.dataset.personGroup&&!personWorking.has(item.id)&&personMatches(item,personAvailableQuery)).forEach(item=>group.checked?personAvailableChecked.add(item.id):personAvailableChecked.delete(item.id))}renderPersonPicker()};
    $('selectedPeopleGroups').onchange=e=>{const person=e.target.closest('[data-selected-person]');if(person)person.checked?personSelectedChecked.add(person.dataset.selectedPerson):personSelectedChecked.delete(person.dataset.selectedPerson)};$('selectedPeopleGroups').onclick=e=>{const remove=e.target.closest('[data-remove-person]');if(remove)removePeople([remove.dataset.removePerson])};
    $('addCheckedPeople').onclick=()=>addPeople([...personAvailableChecked]);$('addMatchedPeople').onclick=()=>addPeople(personDirectory.filter(person=>!personWorking.has(person.id)&&personMatches(person,personAvailableQuery)).map(person=>person.id));$('removeCheckedPeople').onclick=()=>removePeople([...personSelectedChecked]);$('removeAllPeople').onclick=$('clearPeople').onclick=()=>removePeople([...personWorking]);

    document.addEventListener('click',e=>{const trigger=e.target.closest('[data-toggle],[data-edit],[data-delete]');if(!trigger)return;const id=+(trigger.dataset.toggle||trigger.dataset.edit||trigger.dataset.delete);if(trigger.dataset.toggle){const s=suppliers.find(x=>x.id===id);s.enabled=!s.enabled;save();render();toast(s.enabled?'已启用供应商':'已停用供应商')}if(trigger.dataset.edit)openModal(id);if(trigger.dataset.delete){if(confirm('确定删除该供应商吗？')){suppliers=suppliers.filter(x=>x.id!==id);save();render();toast('已删除供应商')}}});document.querySelectorAll('[data-batch]').forEach(b=>b.onclick=()=>{const ids=selected(),action=b.dataset.batch;if(!ids.length)return toast('请先选择供应商');if(action==='delete'&&!confirm(`确定删除选中的 ${ids.length} 家供应商吗？`))return;if(action==='delete')suppliers=suppliers.filter(x=>!ids.includes(x.id));else suppliers.forEach(s=>{if(ids.includes(s.id))s.enabled=action==='enable'});save();render();toast(action==='delete'?'已批量删除':action==='enable'?'已批量启用':'已批量禁用')});
