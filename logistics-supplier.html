<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>物流商工作台</title>
  <style>
    :root {
      --primary: #07868d;
      --primary-dark: #046b71;
      --primary-soft: #e9f7f7;
      --text: #27313a;
      --text-2: #5e6975;
      --text-3: #8b95a1;
      --surface: #ffffff;
      --canvas: #f4f6f8;
      --muted: #f6f8fa;
      --border: #e5e9ef;
      --border-strong: #d8dee7;
      --danger: #e95d62;
      --danger-soft: #fff0f0;
      --success: #48a66b;
      --success-soft: #eef9f1;
      --warning: #d99026;
      --warning-soft: #fff7e8;
      --info: #3b82f6;
      --info-soft: #eff6ff;
      --shadow: 0 12px 30px rgba(27, 39, 51, .08);
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: var(--canvas);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(7, 134, 141, .22);
      outline-offset: 1px;
    }

    .app-shell { min-height: 100dvh; display: flex; flex-direction: column; width: 100%; }
    .top-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
    }
    .top-bar .logo {
      font-size: 15px; font-weight: 600; color: var(--primary);
      display: flex; align-items: center; gap: 10px;
    }
    .top-bar .logo-icon {
      width: 28px; height: 28px; border-radius: 6px;
      background: var(--primary); color: #fff;
      display: grid; place-items: center;
      font-size: 14px; font-weight: 700;
    }
    .user-info { display: flex; align-items: center; gap: 12px; color: var(--text-2); font-size: 13px; }
    .user-info .company { color: var(--text-3); font-size: 12px; }
    .user-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--primary-soft); color: var(--primary);
      display: grid; place-items: center; font-size: 13px; font-weight: 600;
    }
    .divider { width: 1px; height: 18px; background: var(--border-strong); flex-shrink: 0; }

    .page-body {
      flex: 1;
      padding: 20px 24px 32px;
      width: 100%;
      min-width: 0;
    }

    .welcome-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 1px 3px rgba(27,39,51,.04);
      width: 100%;
    }
    .welcome-avatar {
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--primary-soft); color: var(--primary);
      display: grid; place-items: center; flex-shrink: 0;
      font-size: 20px; font-weight: 700;
    }
    .welcome-text h1 { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .welcome-text p { font-size: 13px; color: var(--text-2); }

    .stat-cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 16px;
      width: 100%;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 20px;
      box-shadow: 0 1px 3px rgba(27,39,51,.04);
      transition: box-shadow .2s, transform .2s;
      min-width: 0;
    }
    .stat-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
    .stat-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
    .stat-card-label { font-size: 13px; color: var(--text-2); line-height: 1.4; }
    .stat-card-icon { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0; }
    .stat-card-icon.blue { background: var(--info-soft); color: var(--info); }
    .stat-card-icon.teal { background: var(--primary-soft); color: var(--primary); }
    .stat-card-icon.amber { background: var(--warning-soft); color: var(--warning); }
    .stat-card-icon.green { background: var(--success-soft); color: var(--success); }
    .stat-card-value { font-size: 30px; font-weight: 700; line-height: 1; margin-bottom: 8px; }
    .stat-card-sub { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .stat-card-sub .count {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 1px 7px; border-radius: 10px;
      background: var(--primary-soft); color: var(--primary);
      font-size: 11px; font-weight: 600;
    }

    .tab-bar {
      display: flex; gap: 0;
      background: var(--surface);
      border: 1px solid var(--border); border-bottom: none;
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 0 20px;
      width: 100%;
    }
    .tab-item {
      background: none; border: none; border-bottom: 3px solid transparent;
      padding: 14px 20px 12px; font-size: 14px; font-weight: 500;
      color: var(--text-2); cursor: pointer; transition: all .18s;
    }
    .tab-item:hover { color: var(--text); }
    .tab-item.active { color: var(--primary); font-weight: 600; border-bottom-color: var(--primary); }
    .tab-item .count {
      margin-left: 6px; padding: 1px 7px; border-radius: 10px;
      background: var(--border); color: var(--text-2); font-size: 11px; font-weight: 600;
    }
    .tab-item.active .count { background: var(--primary-soft); color: var(--primary); }

    .main-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 0 0 var(--radius) var(--radius);
      box-shadow: 0 1px 3px rgba(27,39,51,.04);
      width: 100%;
    }

    .filter-section { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); }
    .filter-row { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; width: 100%; }
    .filter-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .filter-field label { font-size: 12px; color: var(--text-2); font-weight: 500; }
    .filter-field input {
      min-height: 36px; border: 1px solid var(--border-strong);
      border-radius: 6px; padding: 7px 11px; font-size: 13px; color: var(--text);
      background: var(--surface); width: 170px; transition: border-color .18s, box-shadow .18s;
    }
    .filter-field input:hover { border-color: #bbc5d0; }
    .filter-field input:focus {
      border-color: var(--primary); box-shadow: 0 0 0 3px rgba(7,134,141,.1); outline: none;
    }
    .filter-field input::placeholder { color: #b0b8c4; }
    .date-separator { padding-bottom: 8px; color: var(--text-3); font-size: 13px; }
    .filter-actions { display: flex; gap: 8px; align-items: flex-end; margin-left: auto; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 36px; padding: 7px 16px; border-radius: 6px; border: 1px solid var(--border-strong);
      background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500;
      transition: all .18s; white-space: nowrap;
    }
    .btn:hover { background: var(--muted); border-color: #cdd3db; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }

    .table-wrap { overflow-x: auto; width: 100%; }
    table { width: 100%; border-collapse: collapse; min-width: 1100px; }
    th, td { padding: 12px 16px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: #fbfcfd; color: var(--text-2); font-weight: 600; position: sticky; top: 0; z-index: 2; }
    tbody tr:hover td { background: #f8fafc; }
    td { color: var(--text); background: var(--surface); transition: background .15s; }
    td.amount { text-align: right; font-variant-numeric: tabular-nums; }
    td.center { text-align: center; }

    .pagination-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; border-top: 1px solid var(--border);
      gap: 12px; flex-wrap: wrap;
    }
    .pagination-info { font-size: 13px; color: var(--text-2); }
    .pagination-controls { display: flex; gap: 4px; align-items: center; }
    .page-btn {
      min-width: 32px; height: 32px; padding: 0 8px;
      border: 1px solid var(--border-strong); border-radius: 5px;
      background: var(--surface); color: var(--text-2); font-size: 13px;
      cursor: pointer; transition: all .15s;
    }
    .page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .page-btn:disabled { opacity: .4; cursor: not-allowed; }
    .page-size-wrap { display: flex; align-items: center; gap: 6px; }
    .page-size-select {
      min-height: 32px; padding: 4px 10px; border-radius: 5px;
      border: 1px solid var(--border-strong); background: var(--surface);
      color: var(--text); font-size: 13px; cursor: pointer;
    }
    .go-page { display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 13px; }
    .go-page input { width: 48px; min-height: 32px; text-align: center; border: 1px solid var(--border-strong); border-radius: 5px; }

    .empty-row td { text-align: center; padding: 60px 16px; color: var(--text-3); }

    .toast-region {
      position: fixed; top: 20px; left: 50%; z-index: 1200;
      transform: translateX(-50%); display: grid; gap: 8px; pointer-events: none;
    }
    .toast {
      min-width: 260px; max-width: calc(100vw - 32px);
      padding: 11px 15px; border: 1px solid #b8e0ca;
      border-radius: 7px; background: #f2fbf5; color: #277645;
      box-shadow: var(--shadow); animation: toastIn .2s ease-out;
      text-align: center; font-size: 13px;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

    @media (max-width: 1200px) {
      .stat-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filter-field input { width: 150px; }
    }
    @media (max-width: 820px) {
      .page-body { padding: 16px; }
      .top-bar { padding: 0 16px; }
      .welcome-card { padding: 16px; }
      .welcome-text h1 { font-size: 16px; }
      .stat-cards { grid-template-columns: 1fr; }
      .stat-card-value { font-size: 26px; }
      .filter-row { flex-direction: column; align-items: stretch; gap: 10px; }
      .filter-field { width: 100%; }
      .filter-field input { width: 100%; }
      .date-separator { display: none; }
      .filter-actions { margin-left: 0; width: 100%; }
      .filter-actions .btn { flex: 1; }
      .tab-bar { padding: 0 12px; overflow-x: auto; }
      .tab-item { padding: 12px 14px 10px; white-space: nowrap; }
      .pagination-bar { flex-direction: column; align-items: stretch; }
      .pagination-controls { justify-content: center; }
    }
    @media (max-width: 560px) {
      .page-body { padding: 12px; }
      .welcome-card { flex-direction: column; align-items: flex-start; }
      .user-info .company { display: none; }
      .top-bar { min-height: 48px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="logo"><div class="logo-icon">B</div><span>博格华纳 物流商协同平台</span></div>
      <div class="user-info">
        <span class="company">ZTO快递</span>
        <div class="divider"></div>
        <span>物流商工作人员</span>
        <div class="user-avatar">物</div>
      </div>
    </header>

    <div class="page-body">
      <div class="welcome-card">
        <div class="welcome-avatar">物</div>
        <div class="welcome-text">
          <h1>欢迎回来，物流商一二</h1>
          <p>ZTO快递</p>
        </div>
      </div>

      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-card-top">
            <span class="stat-card-label">今日待取货<br>计划数</span>
            <div class="stat-card-icon teal"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="5" width="16" height="14" rx="2"/><path d="M21 9v6l-2 2v2h-2v-1H8v1H6v-2l-2-2V9"/><circle cx="7" cy="15" r="1.5"/><circle cx="14" cy="15" r="1.5"/></svg></div>
          </div>
          <div class="stat-card-value" id="statTodayPickup" style="color:var(--primary);">0</div>
          <div class="stat-card-sub">今日已取货计划数 <span class="count" id="statTodayPicked">0</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-top">
            <span class="stat-card-label">今日待取货<br>供应商</span>
            <div class="stat-card-icon blue"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></div>
          </div>
          <div class="stat-card-value" id="statTodaySuppliers" style="color:var(--info);">0</div>
          <div class="stat-card-sub">7天待取货 <span class="count" id="statWeekPickup">0</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-top">
            <span class="stat-card-label">昨日送货<br>计划数</span>
            <div class="stat-card-icon amber"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 21 13 21 21 16 21 16 8"/><line x1="5" y1="12" x2="10" y2="12"/><line x1="4" y1="7" x2="8" y2="7"/></svg></div>
          </div>
          <div class="stat-card-value" id="statYesterdayDeliver" style="color:var(--warning);">0</div>
          <div class="stat-card-sub">昨日送货供应商数 <span class="count" id="statYesterdaySuppliers">0</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-card-top">
            <span class="stat-card-label">昨日已派车<br>数</span>
            <div class="stat-card-icon green"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
          </div>
          <div class="stat-card-value" id="statYesterdayDispatched" style="color:var(--success);">0</div>
          <div class="stat-card-sub">已超期取货 <span class="count" id="statOverduePickup">0</span></div>
        </div>
      </div>

      <div class="tab-bar" id="tabBar">
        <button class="tab-item active" data-tab="pickupPlan">待取货计划</button>
        <button class="tab-item" data-tab="selfPickup">自提取货</button>
      </div>
      <div class="main-card">
        <div class="filter-section">
          <div class="filter-row">
            <div class="filter-field"><label>物料编号</label><input type="text" id="filterMaterialCode" placeholder="请输入物料编号"></div>
            <div class="filter-field"><label>供应商</label><input type="text" id="filterSupplier" placeholder="请输入供应商"></div>
            <div class="filter-field"><label>采购凭证</label><input type="text" id="filterPoNumber" placeholder="请输入采购凭证"></div>
            <div class="filter-field date-field"><label>计划发货日期</label><input type="date" id="filterDateStart"></div>
            <span class="date-separator">—</span>
            <div class="filter-field date-field"><label>&nbsp;</label><input type="date" id="filterDateEnd"></div>
            <div class="filter-actions">
              <button class="btn btn-primary" id="btnSearch">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>查询
              </button>
              <button class="btn" id="btnReset">重置</button>
            </div>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>承诺发货日期</th>
                <th>供应商名称</th>
                <th>供应商编号</th>
                <th>物料编号</th>
                <th class="center">托数</th>
                <th>采购凭证</th>
                <th class="amount">计划发货数量</th>
                <th>承诺到货日期</th>
                <th class="amount">承诺发货数量</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <div class="pagination-bar">
          <div class="pagination-info" id="pageInfo"></div>
          <div class="pagination-controls" id="pageControls"></div>
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <div class="page-size-wrap">
              <select class="page-size-select" id="pageSizeSelect">
                <option value="10" selected>10条/页</option>
                <option value="20">20条/页</option>
                <option value="50">50条/页</option>
              </select>
            </div>
            <span class="go-page">前往 <input id="goPageInput" type="number" min="1"> 页</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

  <script>
    (() => {
      'use strict';

      const records = [
        {
          id: '1', commitShipDate: '2026-08-15', commitArriveDate: '2026-08-15',
          supplierName: '苏州瑞玛精密工业集团股份有限公司', supplierCode: '16668',
          materialCode: '10626MSC', palletCount: 77,
          poNumber: '2026-08-15-10626MSC', planQty: 7777, commitQty: 7777
        },
        {
          id: '2', commitShipDate: '2026-08-16', commitArriveDate: '2026-08-17',
          supplierName: '无锡威孚精密制造有限公司', supplierCode: '18002',
          materialCode: '20815ABC', palletCount: 12,
          poNumber: '2026-08-16-20815ABC', planQty: 2200, commitQty: 2200
        },
        {
          id: '3', commitShipDate: '2026-08-17', commitArriveDate: '2026-08-18',
          supplierName: '上海博格华纳动力系统有限公司', supplierCode: '19005',
          materialCode: '30987XYZ', palletCount: 5,
          poNumber: '2026-08-17-30987XYZ', planQty: 1000, commitQty: 1000
        }
      ];

      const state = {
        records, filteredRecords: [...records],
        currentPage: 1, pageSize: 10, activeTab: 'pickupPlan'
      };

      const $ = id => document.getElementById(id);

      function formatNumber(num) {
        if (num === null || num === undefined || num === '') return '—';
        return Number(num).toLocaleString('zh-CN');
      }

      function toast(msg) {
        const n = document.createElement('div'); n.className = 'toast'; n.textContent = msg;
        $('toastRegion').appendChild(n); setTimeout(() => n.remove(), 3000);
      }

      function getTabFiltered() {
        const mc = $('filterMaterialCode').value.trim().toLowerCase();
        const sp = $('filterSupplier').value.trim().toLowerCase();
        const pn = $('filterPoNumber').value.trim().toLowerCase();
        const ds = $('filterDateStart').value;
        const de = $('filterDateEnd').value;

        return state.records.filter(r => {
          if (state.activeTab === 'selfPickup' && r.palletCount < 50) return false;
          if (mc && !r.materialCode.toLowerCase().includes(mc)) return false;
          if (sp && !(r.supplierName.toLowerCase().includes(sp) || r.supplierCode.toLowerCase().includes(sp))) return false;
          if (pn && !r.poNumber.toLowerCase().includes(pn)) return false;
          if (ds && r.commitShipDate < ds) return false;
          if (de && r.commitShipDate > de) return false;
          return true;
        });
      }

      function applyFilter() {
        state.filteredRecords = getTabFiltered();
        state.currentPage = 1;
        renderTable();
      }

      function renderTable() {
        const s = (state.currentPage - 1) * state.pageSize;
        const e = s + state.pageSize;
        const pg = state.filteredRecords.slice(s, e);
        const b = $('tableBody');

        if (!pg.length) {
          b.innerHTML = '<tr class="empty-row"><td colspan="9"><div style="font-size:15px;margin-bottom:6px;">暂无数据</div><div style="font-size:12px;">没有符合条件的计划记录</div></td></tr>';
        } else {
          b.innerHTML = pg.map(r => `
            <tr>
              <td>${r.commitShipDate}</td>
              <td>${r.supplierName}</td>
              <td>${r.supplierCode}</td>
              <td>${r.materialCode}</td>
              <td class="center">${r.palletCount}</td>
              <td>${r.poNumber}</td>
              <td class="amount">${formatNumber(r.planQty)}</td>
              <td>${r.commitArriveDate}</td>
              <td class="amount">${formatNumber(r.commitQty)}</td>
            </tr>
          `).join('');
        }
        renderPagination();
      }

      function renderPagination() {
        const t = state.filteredRecords.length;
        const tp = Math.ceil(t / state.pageSize) || 1;
        $('pageInfo').textContent = `共 ${t} 条`;

        let h = `<button class="page-btn" ${state.currentPage <= 1 ? 'disabled' : ''} data-page="${state.currentPage - 1}">‹</button>`;
        for (let i = 1; i <= tp; i++) {
          if (tp <= 7 || i === 1 || i === tp || (i >= state.currentPage - 1 && i <= state.currentPage + 1))
            h += `<button class="page-btn${i === state.currentPage ? ' active' : ''}" data-page="${i}">${i}</button>`;
          else if (i === state.currentPage - 2 || i === state.currentPage + 2)
            h += '<span style="padding:0 4px;color:var(--text-3);">...</span>';
        }
        h += `<button class="page-btn" ${state.currentPage >= tp ? 'disabled' : ''} data-page="${state.currentPage + 1}">›</button>`;
        $('pageControls').innerHTML = h;
        $('goPageInput').max = tp;
        $('goPageInput').value = state.currentPage;
      }

      function updateStats() {
        $('statTodayPickup').textContent = state.records.filter(r => r.commitShipDate === '2026-08-15').length;
        $('statTodayPicked').textContent = 0;
        $('statTodaySuppliers').textContent = new Set(state.records.filter(r => r.commitShipDate === '2026-08-15').map(r => r.supplierCode)).size;
        $('statWeekPickup').textContent = state.records.length;
        $('statYesterdayDeliver').textContent = 0;
        $('statYesterdaySuppliers').textContent = 0;
        $('statYesterdayDispatched').textContent = 0;
        $('statOverduePickup').textContent = 0;
      }

      $('btnSearch').addEventListener('click', applyFilter);
      $('btnReset').addEventListener('click', () => {
        $('filterMaterialCode').value = '';
        $('filterSupplier').value = '';
        $('filterPoNumber').value = '';
        $('filterDateStart').value = '';
        $('filterDateEnd').value = '';
        applyFilter();
        toast('筛选条件已重置');
      });

      $('tabBar').addEventListener('click', e => {
        const tab = e.target.closest('.tab-item');
        if (!tab) return;
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        state.activeTab = tab.dataset.tab;
        state.currentPage = 1;
        applyFilter();
      });

      $('pageControls').addEventListener('click', e => {
        const btn = e.target.closest('.page-btn');
        if (btn && !btn.disabled) {
          const p = parseInt(btn.dataset.page);
          const tp = Math.ceil(state.filteredRecords.length / state.pageSize) || 1;
          if (p >= 1 && p <= tp) { state.currentPage = p; renderTable(); }
        }
      });

      $('pageSizeSelect').addEventListener('change', e => {
        state.pageSize = parseInt(e.target.value);
        state.currentPage = 1;
        renderTable();
      });

      $('goPageInput').addEventListener('change', () => {
        const tp = Math.ceil(state.filteredRecords.length / state.pageSize) || 1;
        const val = Math.min(tp, Math.max(1, parseInt($('goPageInput').value) || 1));
        state.currentPage = val;
        renderTable();
      });

      updateStats();
      renderTable();
    })();
  </script>
</body>
</html>
